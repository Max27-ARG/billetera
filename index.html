// Partes que se recalculan mientras escribís (sin redibujar la ventana)
function calcForm(f) {
  const ef = efectivoDe(f.negocio, f.editando ? f.id : null);
  if (f.tipo === 'Inversión') {
    const total = num(f.monto) > 0 ? num(f.monto) : 0, un = num(f.unidades), pct = num(f.pctRecargo);
    const rec = f.pago === 'Transferencia' && pct > 0 ? r2(total * pct / 100) : 0;
    return { a: total > 0 && un > 0 ? 'Sale a ' + fmt(total / un) + ' por unidad' : 'Poné el total que pagaste por todo.',
      b: `${f.pago === 'Efectivo' ? notaEfectivo(ef, total) : ''}<div class="caja" style="margin-top:${f.pago === 'Efectivo' ? 13 : 0}px"><div><span>Productos</span><span>${fmt(total)}</span></div>${rec ? `<div><span>Recargo (${pct}%)</span><span>${fmt(rec)}</span></div>` : ''}<div class="t"><span>Total pagado</span><b>${fmt(total + rec)}</b></div></div>` };
  }
  if (f.tipo === 'No reversible' || f.tipo === 'Gasto general') return { b: f.pago === 'Efectivo' ? notaEfectivo(ef, num(f.monto)) : '' };
  const m = num(f.monto) > 0 ? num(f.monto) : 0, pc = num(f.pctCambio);
  const com = m > 0 && pc >= 0 ? r2(m * pc / 100) : 0, efe = f.pagoComision === 'Efectivo', rec = efe ? m : r2(m - com);
  return { b: `<div class="caja"><div><span>Comisión (cuenta como gasto)</span><span style="color:#FFB3D9;font-weight:800">-${fmt(com)}</span></div>${efe && com ? `<div><span>La pagás en efectivo</span><span>${fmt(com)}</span></div>` : ''}<div class="t"><span>Efectivo que recibís</span><b>${fmt(rec)}</b></div></div>
      <div class="efe-nota" style="margin-top:13px">Efectivo de ${esc(f.negocio)}: ${fmt(ef)} → <b>${fmt(r2(ef + m - com))}</b></div>` };
}
function notaEfectivo(ef, monto) {
  const queda = r2(ef - (monto > 0 ? monto : 0));
  return `<div class="efe-nota${queda < 0 ? ' mal' : ''}">Efectivo disponible: ${fmt(ef)}${monto > 0 ? ` → te quedan <b>${fmt(queda)}</b>` : ''}</div>`;
}
function guardarNegocio() {
  const f = S.form;
  const d = { negocio: f.negocio, tipo: f.tipo, fecha: f.fecha, viaje: (f.viaje || '').trim() };
  if (!d.fecha) return errorForm('Poné la fecha.');
  let saleEfectivo = 0;
  if (f.tipo === 'Inversión') {
    d.descripcion = f.descripcion.trim(); d.unidades = num(f.unidades); d.monto = num(f.monto); d.pago = f.pago;
    d.pctRecargo = f.pago === 'Transferencia' && f.pctRecargo.trim() ? num(f.pctRecargo) : '';
    if (!d.descripcion) return errorForm('Escribí qué producto compraste.');
    if (!(d.unidades > 0)) return errorForm('Poné las unidades.');
    if (!(d.monto > 0)) return errorForm('Poné el costo total.');
    if (d.pctRecargo !== '' && !(d.pctRecargo >= 0 && d.pctRecargo <= 100)) return errorForm('Revisá el % de recargo.');
    if (d.pago === 'Efectivo') saleEfectivo = d.monto;
  } else if (f.tipo === 'No reversible') {
    d.categoria = f.categoria; d.descripcion = f.descripcion.trim(); d.monto = num(f.monto); d.pago = f.pago;
    if (!d.categoria) return errorForm('Elegí una categoría.');
    if (!(d.monto > 0)) return errorForm('Poné el monto.');
    if (d.pago === 'Efectivo') saleEfectivo = d.monto;
  } else if (f.tipo === 'Gasto general') {
    d.categoria = f.categoria; d.descripcion = (f.descripcion || '').trim(); d.monto = num(f.monto); d.pago = f.pago; d.viaje = '';
    if (!d.categoria) return errorForm('Elegí una categoría.');
    if (!(d.monto > 0)) return errorForm('Poné el monto.');
    if (d.pago === 'Efectivo') saleEfectivo = d.monto;
  } else {
    // Cambio: en Bermejo va dentro del viaje (si no hay, se arma el del día); en otro lugar, sin viaje
    d.viaje = f.lugar === 'Otro' ? '' : (d.viaje || 'Bermejo ' + fCorta(f.fecha));
    d.monto = num(f.monto); d.pctCambio = num(f.pctCambio || '0'); d.nota = (f.nota || '').trim(); d.pagoComision = f.pagoComision === 'Efectivo' ? 'Efectivo' : 'Transferencia';
    if (!(d.monto > 0)) return errorForm('Poné cuánto transferiste.');
    if (!(d.pctCambio >= 0 && d.pctCambio <= 100)) return errorForm('Revisá el % del cambio.');
  }
  if (saleEfectivo && !f.permitirSinEfectivo) {
    const ef = efectivoDe(f.negocio, f.editando ? f.id : null);
    if (saleEfectivo > ef) return avisoSinEfectivo(saleEfectivo, ef);
  }
  if (d.viaje) LS.set('bd_viaje_' + S.yo.usuario, d.viaje);
  const volver = f.tipo === 'Cambio' ? S.volverA : null;
  encolar({ tipo: 'guardar', hoja: 'negocio', id: f.id, datos: d });
  if (volver) { S.volverA = null; S.form = volver; volver.viaje = volver.viaje || d.viaje; pintarFormNegocio(); return avisar('Cambio guardado. Ahora guardá la compra.'); }
  cerrarModal(); avisar(f.editando ? 'Cambios guardados' : f.tipo === 'Cambio' ? 'Cambio guardado' : f.tipo === 'Inversión' ? 'Compra guardada' : 'Gasto guardado');
  if (d.viaje && S.vista !== 'negocio') S.viaje = '';
  irA('negocio');
}

/* ---------- Aviso: no alcanza el efectivo ---------- */
function avisoSinEfectivo(monto, ef) {
  const guardado = S.form;
  S.formGuardado = guardado;
  abrirModal(`<div class="v-cab"><span class="ic" style="background:rgba(255,181,71,.18);color:var(--amber)">${svg('alerta', 22, 2)}</span><b>No te alcanza el efectivo</b></div>
    <p style="margin:0;font-size:15px;font-weight:600;color:var(--soft);line-height:1.45">Esto es de <b style="color:var(--ink)">${fmt(monto)}</b> en efectivo, pero según la app te quedan <b style="color:var(--ink)">${fmt(ef)}</b>. ¿Te faltó cargar un cambio?</p>
    <button class="btn" type="button" data-acc="avisoCambio" style="background:linear-gradient(135deg,#1F9E95,#7C4DFF);color:#fff">Cargar un cambio</button>
    <button class="btn btn-sec" type="button" data-acc="avisoAjustar">Ajustar el efectivo</button>
    <button class="btn btn-ghost" type="button" data-acc="avisoVolver">Volver</button>`);

/* ---------- Efectivo inicial / ajuste ---------- */
function formAjuste(negocio, inicial) {

function cargarXLSX() {
  return new Promise((ok, mal) => {
    if (window.XLSX) return ok();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = ok; s.onerror = () => mal(new Error('Para descargar el Excel la primera vez necesitás internet.'));
    document.head.appendChild(s);
  });
}
async function exportar(btn) {
  const porViaje = !!S.expViaje, val = valorExport();
  if (!val) return avisar('No hay nada para descargar todavía.');
  const neg = S.yo.admin ? (S.expNeg || '') : S.yo.negocio;
  const listo = cargando(btn, 'Preparando…');
  try { await cargarXLSX(); } catch (e) { listo(); return avisar(e.message); }
  listo();
  const filtra = f => (!neg || f.negocio === neg) && (porViaje ? f.viaje === val : String(f.fecha).slice(0, 7) === val);
  const N = S.negocio.filter(filtra).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const Pp = porViaje ? [] : S.personal.filter(f => (!neg || f.negocio === neg) && String(f.fecha).slice(0, 7) === val).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const negs = neg ? [neg] : (S.listas['Negocios'] || []);
  const resumen = [['Negocio', 'Inversión (recuperable)', 'Insumos', 'Sueldo', 'Interés/Gastos', 'Otros', 'Subtotal no reversible', 'Gastos generales', 'TOTAL', 'Gastos personales', 'De esos, con plata del negocio']];
  negs.forEach(n => {
    const fs = N.filter(f => f.negocio === n), partes = fs.flatMap(partesNegocio);
    const suma = c => partes.filter(p => p[0] === c).reduce((s, p) => s + p[1], 0);
    const inv = suma('Productos');
    const no = partes.filter(p => p[2] === 'no').reduce((s, p) => s + p[1], 0);
    const gen = partes.filter(p => p[2] === 'gen').reduce((s, p) => s + p[1], 0);
    const pn = Pp.filter(f => f.negocio === n);
    // ins/su: solo de los viajes (lo de gastos generales va en su propia columna)
    const sumaNo = c => partes.filter(p => p[2] === 'no' && p[0] === c).reduce((s, p) => s + p[1], 0);
    const ins2 = sumaNo('Insumos'), su2 = sumaNo('Sueldo'), it2 = sumaNo('Interés/Gastos');
    resumen.push([n, inv, ins2, su2, it2, r2(no - ins2 - su2 - it2), no, gen, inv + no + gen, pn.reduce((s, f) => s + Number(f.monto), 0), pn.filter(f => f.origen !== 'Personal').reduce((s, f) => s + Number(f.monto), 0)]);
  });
  const inv = [['Fecha', 'Negocio', 'Viaje', 'Descripción (producto)', 'Unidades', 'Precio de costo unitario', 'Precio de costo total', 'Pago', '% recargo', 'Recargo $']]
    .concat(N.filter(f => f.tipo === 'Inversión').map(f => [f.fecha, f.negocio, f.viaje, f.descripcion, Number(f.unidades), Number(f.costoUnit), Number(f.monto), f.pago, f.pctRecargo === '' ? '' : Number(f.pctRecargo), Number(f.recargo) || '']));
  const nor = [['Fecha', 'Negocio', 'Viaje', 'Categoría', 'Descripción', 'Pago', 'Gasto real']]
    .concat(N.filter(f => f.tipo === 'No reversible').map(f => [f.fecha, f.negocio, f.viaje, f.categoria, f.descripcion, f.pago, Number(f.gastoReal)]));
  const gral = [['Fecha', 'Negocio', 'Categoría', 'Descripción', 'Pago', 'Monto']]
    .concat(N.filter(f => f.tipo === 'Gasto general').map(f => [f.fecha, f.negocio, f.categoria, f.descripcion, f.pago, Number(f.gastoReal)]));
  const cam = [['Fecha', 'Negocio', 'Lugar', 'Viaje', 'Nota', 'Transferido', '% del cambio', 'Comisión (gasto real)', 'Comisión pagada con', 'Efectivo recibido']]
    .concat(N.filter(f => f.tipo === 'Cambio').map(f => [f.fecha, f.negocio, f.viaje ? 'Bermejo' : 'Otro lugar', f.viaje, notaCambio(f), Number(f.monto), Number(f.pctCambio), Number(f.comision), Number(f.comision) ? (f.pago === 'Efectivo' ? 'Efectivo' : 'Descontada') : '', Number(f.recibido)]));
  const per = [['Fecha', 'Negocio', 'Origen de la plata', 'Categoría', 'Descripción', 'Pago', 'Monto', 'A devolver']]
    .concat(Pp.map(f => [f.fecha, f.negocio, f.origen, f.categoria, f.descripcion, f.pago, Number(f.monto), f.devolver === 'sí' ? 'Sí' : '']));
  const dev = [['Fecha', 'Negocio', 'Nota', 'Cómo se devolvió', 'Devuelto']]
    .concat(N.filter(f => f.tipo === 'Devolución').map(f => [f.fecha, f.negocio, f.descripcion !== 'Devolución al negocio' ? f.descripcion : '', f.pago === 'Transferencia' ? 'Transferencia' : 'Efectivo', Number(f.monto)]));
  const wb = XLSX.utils.book_new();
  const hoja = (aoa, nombre, anchos) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = anchos.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, nombre); };
  hoja(resumen, 'Resumen', [20, 14, 12, 12, 14, 12, 16, 16, 14, 16, 18]);
  hoja(inv, 'Inversiones', [12, 18, 16, 30, 10, 14, 14, 14, 10, 12]);
  hoja(nor, 'No reversibles', [12, 18, 16, 16, 26, 14, 12]);
  if (gral.length > 1) hoja(gral, 'Gastos generales', [12, 18, 22, 28, 14, 14]);
  hoja(cam, 'Cambios', [12, 18, 12, 16, 24, 14, 12, 18, 18, 16]);
  if (!porViaje) hoja(per, 'Personal', [12, 18, 22, 22, 26, 14, 12, 12]);
  if (dev.length > 1) hoja(dev, 'Devoluciones', [12, 18, 26, 18, 14]);
  const nombre = 'Billetera_' + (neg || 'Todos').replace(/[^A-Za-z0-9]+/g, '-') + '_' + val.replace(/[^A-Za-z0-9]+/g, '-') + '.xlsx';
  XLSX.writeFile(wb, nombre);
  avisar('Excel descargado');
}

/* ---------- Admin ---------- */
async function cargarUsuarios(btn) {
  if (!navigator.onLine) return avisar('Para ver las cuentas necesitás internet.');
  const listo = cargando(btn, 'Cargando…');
  try { const r = await api({ accion: 'usuarios', token: S.token }); usuariosAdmin = r.usuarios; render(); }
  catch (e) { listo(); avisar(e.message); }
}
async function accionAdmin(spec, btn) {
  const [acc, usuario, valor] = spec.split(':');
  if (acc === 'modo') {
    if (!navigator.onLine) return avisar('Para esto necesitás internet.');
    const listo = cargando(btn, 'Cargando…');
    try {
      const r = await api({ accion: 'modoUsuario', token: S.token, usuario, modo: valor });
      usuariosAdmin = r.usuarios;
      if (usuario === S.yo.usuario) return setModo(valor);
      avisar(valor === 'simple' ? 'Modo simple activado para ' + usuario : 'Modo completo activado para ' + usuario);
      render();
    } catch (e) { listo(); avisar(e.message.includes('desconocida') ? 'Falta actualizar el código de Google (Codigo.gs).' : e.message); }
    return;
  }
  if (!navigator.onLine) return avisar('Para esto necesitás internet.');
  if (acc === 'clave') {
    abrirModal(`${cab('Nueva contraseña', 'var(--violet)', 'candado')}
      <p class="ayuda" style="margin:0">Para <b>${esc(usuario)}</b>. Pasale la contraseña nueva; también se desbloquea la cuenta.</p>
      <label class="campo" for="admClave">Contraseña nueva<input id="admClave" placeholder="Mínimo 6 caracteres"></label>
      <div class="error" id="fError" hidden></div>
      <button class="btn btn-grad" type="button" id="admGuardar">Guardar contraseña</button>`);
    $('admGuardar').onclick = async () => {
      const c = $('admClave').value;
      if (c.length < 6) return errorForm('Tiene que tener al menos 6 caracteres.');
      const listo = cargando($('admGuardar'), 'Guardando…');
      try { const r = await api({ accion: 'nuevaClave', token: S.token, usuario, clave: c }); usuariosAdmin = r.usuarios; cerrarModal(); avisar('Contraseña cambiada'); render(); }
      catch (e) { listo(); errorForm(e.message); }
    };
    return;
  }
  const listo = cargando(btn, 'Cargando…');
  try {
    const r = await api({ accion: { aprobar: 'aprobar', rechazar: 'rechazar', desbloquear: 'desbloquear' }[acc], token: S.token, usuario });
    usuariosAdmin = r.usuarios;
    S.pendientes = usuariosAdmin.filter(u => u.estado === 'pendiente').length;
    avisar({ aprobar: 'Cuenta activada', rechazar: 'Cuenta desactivada', desbloquear: 'Cuenta desbloqueada' }[acc]);
    render();
  } catch (e) { listo(); avisar(e.message); }
}

/* =========================================================
   Botones que esperan a Google: muestran "Cargando…"
   ========================================================= */
function cargando(b, texto) {
  if (!b) return () => {};
  const antes = b.innerHTML;
  b.disabled = true; b.classList.remove('toque'); b.textContent = texto;
  return () => { if (b.isConnected) { b.disabled = false; b.innerHTML = antes; } };
}

function abrirCal(valor, fn, modo, titulo) {
  leerCampos();
  const d = aFecha(valor || hoy());
  Object.assign(CAL, { y: d.getFullYear(), m: d.getMonth(), valor: valor || '', fn, vista: modo || 'dias', soloMes: modo === 'meses', titulo: titulo || 'Elegí la fecha' });
  pintarCal(); if ($('cal').hidden) { $('cal').hidden = false; histRevisar(); }
}
function cerrarCal(desdeAtras) { const estaba = !$('cal').hidden; $('cal').hidden = true; CAL.fn = null; if (estaba && !desdeAtras) histRevisar(); }
$('cal').addEventListener('click', e => { if (e.target === $('cal')) cerrarCal(); });
const MES_CORTO = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
function pintarCal() {
  if (CAL.vista === 'meses' || CAL.vista === 'anios') return pintarCalGrilla();
  const h = hoy(), a = ayer();
  const primero = new Date(CAL.y, CAL.m, 1), vacios = (primero.getDay() + 6) % 7, dias = new Date(CAL.y, CAL.m + 1, 0).getDate();
  const mes = MESES[CAL.m][0].toUpperCase() + MESES[CAL.m].slice(1);

// Vista rápida: los 12 meses de un año, o 12 años para elegir
function pintarCalGrilla() {
  const hoyD = aFecha(hoy()), sel = CAL.valor ? aFecha(CAL.valor) : null;
  let cab, grilla;
  if (CAL.vista === 'meses') {
    cab = `<button type="button" data-calanio="-1" aria-label="Año anterior">${svg('izq', 20, 2.4)}</button><button type="button" class="cal-tit" data-calvista="anios" aria-label="Elegir año">${CAL.y}${svg('abajo', 16, 2.6)}</button><button type="button" data-calanio="1" aria-label="Año siguiente">${svg('der', 20, 2.4)}</button>`;
    grilla = MES_CORTO.map((m, i) => `<button type="button" data-calm="${i}" class="${CAL.y === hoyD.getFullYear() && i === hoyD.getMonth() ? 'hoy' : ''}" aria-selected="${!!sel && sel.getFullYear() === CAL.y && sel.getMonth() === i}" aria-label="${MESES[i]} ${CAL.y}">${m}</button>`).join('');
  } else {
    const ini = CAL.y - 7;
    cab = `<button type="button" data-calbloque="-1" aria-label="Años anteriores">${svg('izq', 20, 2.4)}</button><b>${ini} – ${ini + 11}</b><button type="button" data-calbloque="1" aria-label="Años siguientes">${svg('der', 20, 2.4)}</button>`;
    grilla = Array.from({ length: 12 }, (_, k) => ini + k).map(y => `<button type="button" data-caly="${y}" class="${y === hoyD.getFullYear() ? 'hoy' : ''}" aria-selected="${!!sel && sel.getFullYear() === y}">${y}</button>`).join('');
  }
  const pie = CAL.soloMes
    ? `<button class="btn btn-sec" type="button" data-calm="${hoyD.getMonth()}" data-esteanio="1">Este mes</button>`
    : `<button class="btn btn-sec" type="button" data-calvista="dias">Volver a los días</button>`;
  $('calIn').innerHTML = `
    <div class="v-cab"><span class="ic" style="background:var(--grad)">${svg('cal', 20)}</span><b>${esc(CAL.titulo)}</b><button class="cerrar" type="button" data-cal="cerrar" aria-label="Cerrar">${svg('x', 18, 2.2)}</button></div>
    <div class="cal-cab">${cab}</div>
    <div class="cal-grilla">${grilla}</div>
    <div class="dos">${pie}<button class="btn btn-ghost" type="button" data-cal="cerrar">Cancelar</button></div>`;
}

/* =========================================================
   Todos los movimientos: lista por día, buscador y filtros
   ========================================================= */
const norm = t => String(t == null ? '' : t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const FILTROS_TIPO = [['todos', 'Todos'], ['personal', 'Personal'], ['Inversión', 'Compras'], ['No reversible', 'No reversible'], ['Gasto general', 'Gastos generales'], ['Cambio', 'Cambios'], ['Efectivo', 'Efectivo'], ['Transferencia', 'Transferencia']];
function filasTodos() {
  const q = norm(S.busca || '').trim(), ft = S.ftipo || 'todos';
  const l = [...datosFiltrados(S.personal).map(f => Object.assign({ _n: false }, f)), ...datosFiltrados(S.negocio).map(f => Object.assign({ _n: true }, f))];
  return ordenar(l.filter(f => {
    if (ft === 'personal' && f._n) return false;
    if (['Inversión', 'No reversible', 'Gasto general', 'Cambio'].includes(ft) && (!f._n || f.tipo !== ft)) return false;
    if ((ft === 'Efectivo' || ft === 'Transferencia') && f.pago !== ft) return false;
    if (q) {
      const txt = norm([f.descripcion, f.categoria, f.viaje, f.negocio, f.tipo, f.origen, f.pago, f.monto, fmt(f.monto), fCorta(f.fecha)].join(' '));
      if (!q.split(/\s+/).every(p => txt.includes(p))) return false;
    }
    return true;
  }));
}
function fechaGrupo(iso) {
  if (iso === hoy()) return 'Hoy';
  if (iso === ayer()) return 'Ayer';
  const d = aFecha(iso), base = d.getDate() + ' de ' + MESES[d.getMonth()];
  return d.getFullYear() === aFecha(hoy()).getFullYear() ? base : base + ' de ' + d.getFullYear();
}
function htmlListaTodos() {
  const l = filasTodos(), max = S.todosMax || 60;
  if (!l.length) return `<div class="tarj"><div class="vacio">${S.busca || (S.ftipo && S.ftipo !== 'todos') ? 'No hay movimientos con esa búsqueda o filtro.' : 'Todavía no hay movimientos.'}</div></div>`;
  let h = '', dia = '';
  l.slice(0, max).forEach(f => {
    if (f.fecha !== dia) { if (dia) h += '</div></section>'; dia = f.fecha; h += `<section class="tarj"><h3 class="fecha-grupo">${esc(fechaGrupo(dia))}</h3><div class="lista">`; }
    h += filaMov(f, f._n);

  h += '</div></section>';
  if (l.length > max) h += `<button class="btn btn-sec" type="button" data-acc="verMas">Ver más (${l.length - max} más)</button>`;

}

/* =========================================================
   Detalle de un gasto: primero se mira, el lápiz lo edita
   ========================================================= */
function verDetalle(h, f) {
  const esN = h === 'negocio', filas = [];
  const add = (k, v) => { if (v !== '' && v != null) filas.push([k, String(v)]); };
  let titulo, monto, signo = '-';
  if (esN && f.tipo === 'Inversión') {
    titulo = f.descripcion; monto = totalNegocio(f);
    add('Tipo', 'Compra (inversión, se recupera)'); add('Producto', f.descripcion); add('Unidades', f.unidades);
    add('Costo por unidad', fmt(f.costoUnit)); add('Costo total', fmt(f.monto));
    if (Number(f.recargo)) add(`Recargo de la tienda (${pct(f.pctRecargo)})`, fmt(f.recargo));
    add('Pago', f.pago);
  } else if (esN && f.tipo === 'No reversible') {
    titulo = f.descripcion || f.categoria; monto = f.gastoReal;
    add('Tipo', 'Gasto no reversible'); add('Categoría', f.categoria); add('Descripción', f.descripcion); add('Pago', f.pago);
  } else if (esN && f.tipo === 'Cambio') {
    titulo = 'Cambio a efectivo'; monto = f.recibido; signo = '+';
    add('Nota', notaCambio(f)); add('Transferiste', fmt(f.monto)); add('% del cambio', pct(f.pctCambio));
    add('Comisión (cuenta como gasto)', fmt(f.comision));
    if (Number(f.comision)) add('La comisión se pagó', f.pago === 'Efectivo' ? 'En efectivo' : 'Descontada de la transferencia');
    add('Efectivo recibido', fmt(f.recibido));
    add('Lugar', f.viaje ? 'Bermejo' : 'Otro lugar');
  } else if (esN && f.tipo === 'Gasto general') {
    titulo = f.descripcion || f.categoria; monto = f.gastoReal;
    add('Tipo', 'Gasto general del negocio'); add('Categoría', f.categoria); add('Detalle', f.descripcion); add('Pago', f.pago);
  } else if (esN && f.tipo === 'Devolución') {
    titulo = 'Devolución al negocio'; monto = f.monto; signo = '+';
    add('Tipo', 'Devolución al negocio'); if (f.descripcion !== 'Devolución al negocio') add('Nota', f.descripcion);
    if (f.pago === 'Transferencia') add('Cómo se devolvió', 'Por transferencia (el efectivo no cambia)'); else add('Entró al efectivo', fmt(f.monto));
  } else if (esN) {
    titulo = f.descripcion; monto = Math.abs(f.movEfectivo); signo = f.movEfectivo >= 0 ? '+' : '-';
    add('Tipo', 'Ajuste de efectivo'); add('Efectivo contado', fmt(f.monto));
  } else {
    titulo = f.descripcion || f.categoria; monto = f.monto;
    add('Tipo', 'Gasto personal'); add('Categoría', f.categoria); add('Descripción', f.descripcion);
    add('¿De dónde salió la plata?', f.origen === 'Personal' ? 'Personal (plata propia)' : 'Negocio (MercadoLibre)'); add('Pago', f.pago);
    if (f.devolver === 'sí') add('A devolver', 'Sí, se devuelve al negocio');
  }
  if (esN) add('Viaje', f.viaje);
  const d = aFecha(f.fecha);
  add('Fecha', DIAS[d.getDay()][0].toUpperCase() + DIAS[d.getDay()].slice(1) + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' ' + d.getFullYear());
  add('Negocio', f.negocio);
  if (f.cargado) { const c = new Date(f.cargado); if (!isNaN(c)) add('Cargado a las', String(c.getHours()).padStart(2, '0') + ':' + String(c.getMinutes()).padStart(2, '0') + ' h'); }
  if (S.yo.admin) add('Cargado por', f.usuario);
  limpiarModal();
  S.detalle = { h, id: f.id };
  const col = esN ? (['Cambio', 'Ajuste', 'Devolución'].includes(f.tipo) ? 'var(--teal)' : f.tipo === 'Gasto general' ? '#C97A2B' : 'var(--violet)') : 'var(--fuchsia)';
  abrirModal(`<div class="v-cab"><span class="ic" style="background:${col}">${svg(icoDe(f, esN), 20)}</span><b>Detalle</b>
      ${esSimple() ? '' : `<button class="cerrar" type="button" data-acc="editarDetalle" aria-label="Editar">${svg('lapiz', 19, 2.1)}</button>`}
      <button class="cerrar" type="button" data-acc="cerrar" aria-label="Cerrar">${svg('x', 18, 2.2)}</button></div>
    ${bannerRech(f.id)}
    <div class="det-cab"><span>${esc(titulo)}</span><b class="${signo === '+' ? 'pos' : ''}">${signo}${fmt(monto)}</b>${enCola(f.id) && !rechDe(f.id) ? '<small class="esperando">sin subir todavía</small>' : ''}</div>
    <div class="det-filas">${filas.map(([k, v]) => `<div class="fila-p"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>
    ${esSimple() ? botonesDetalleSimple(esN, f) : ''}`);
}
// En el modo simple, abajo del detalle: Corregir y Borrar, grandes

/* =========================================================
   Animación al tocar: se hunde, se oscurecen los bordes y
   una luz sigue al dedo. Si sacás el dedo del botón, no se toca.
   ========================================================= */
let toque = null, cancelado = null;
// La luz sigue al dedo todo el tiempo. Si el dedo sale del botón, la luz queda en el borde más cercano (más suave)
// y el botón deja de estar "hundido": al soltar afuera, no se toca.
function moverToque(x, y) {
  const b = toque.b, r = b.getBoundingClientRect();
  const dentro = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  toque.dentro = dentro;
  b.style.setProperty('--x', (Math.min(Math.max(x, r.left), r.right) - r.left) + 'px');
  b.style.setProperty('--y', (Math.min(Math.max(y, r.top), r.bottom) - r.top) + 'px');
  b.classList.toggle('toque', dentro && !toque.scroll);
  b.classList.toggle('toque-fuera', !dentro || !!toque.scroll);
}
function soltarToque(cancelar) {
  if (!toque) return;
  const b = toque.b, falta = Math.max(0, 140 - (Date.now() - toque.t));
  if (cancelar) cancelado = { b, t: Date.now() };
  toque = null;
  const fin = () => b.classList.remove('toque', 'toque-fuera');
  if (cancelar) fin(); else setTimeout(fin, falta);
}
// Un gesto (deslizar la pantalla, tirar para actualizar) anula el toque pero la luz sigue al dedo hasta soltar
function anularToque() { if (toque) { toque.scroll = true; toque.b.classList.remove('toque'); toque.b.classList.add('toque-fuera'); } }
document.addEventListener('pointerdown', e => {
  cancelado = null;
  const b = e.target.closest && e.target.closest('button');
  if (!b || b.disabled) return;
  toque = { b, t: Date.now(), id: e.pointerId, tipo: e.pointerType, dentro: true, scroll: false };
  moverToque(e.clientX, e.clientY);
}, true);
// Mouse / lápiz
document.addEventListener('pointermove', e => { if (toque && toque.tipo !== 'touch' && e.pointerId === toque.id) moverToque(e.clientX, e.clientY); }, true);
document.addEventListener('pointerup', e => { if (!toque || toque.tipo === 'touch' || e.pointerId !== toque.id) return; moverToque(e.clientX, e.clientY); soltarToque(!toque.dentro); }, true);
// Dedo: el celular sigue mandando el movimiento aunque la pantalla se deslice
document.addEventListener('pointercancel', e => { if (!toque) return; if (toque.tipo === 'touch') anularToque(); else soltarToque(true); }, true);
document.addEventListener('touchmove', e => { if (toque && toque.tipo === 'touch' && e.touches[0]) moverToque(e.touches[0].clientX, e.touches[0].clientY); }, { capture: true, passive: true });
const finDedo = e => {
  if (!toque || toque.tipo !== 'touch') return;

  if (t) moverToque(t.clientX, t.clientY);

document.addEventListener('touchend', finDedo, { capture: true, passive: true });

document.addEventListener('click', e => {

/* =========================================================
   Deslizar hacia abajo para actualizar (sin recargar la app)
   ========================================================= */
const PTR = { y0: null, dist: 0, activo: false, ocupado: false };
const UMBRAL = 72;
function ptrPintar(dist, texto) {
  const el = $('ptr');
  el.classList.remove('vuelve');
  el.style.opacity = Math.min(1, dist / 40);
  el.style.transform = `translate(-50%, ${dist - 60}px)`;
  el.querySelector('.giro').style.transform = `rotate(${Math.round(dist * 3.3)}deg)`;
  el.querySelector('small').textContent = texto || (dist >= UMBRAL ? 'Soltá para actualizar' : 'Deslizá para actualizar');
}
function ptrOcultar() {
  const el = $('ptr');
  el.classList.add('vuelve'); el.classList.remove('girando');
  el.style.opacity = 0; el.style.transform = 'translate(-50%,-90px)';
}
const esperar = ms => new Promise(r => setTimeout(r, ms));
async function ptrActualizar() {
  PTR.ocupado = true;
  const el = $('ptr');
  el.classList.add('vuelve'); ptrPintar(UMBRAL, navigator.onLine ? 'Actualizando…' : 'Sin internet'); el.classList.add('vuelve');
  if (navigator.onLine) {
    el.classList.add('girando');
    const t0 = Date.now();
    let bien = await sincronizar();
    while (S.sincronizando) { await esperar(150); bien = true; }
    await esperar(Math.max(0, 1000 - (Date.now() - t0))); // que se vea girar al menos un segundo
    el.classList.remove('girando');
    el.querySelector('small').textContent = bien ? (S.cola.length ? 'Quedan gastos sin subir' : 'Todo actualizado ✓') : 'No se pudo conectar';
  }
  await esperar(900);
  ptrOcultar(); PTR.ocupado = false;
}
/* Acordeón: al llegar arriba o abajo, se abre un poco el espacio entre las tarjetas de ese lado */
function estirar(dist, lado) {
  const vista = document.querySelector('#contenido .vista'); if (!vista) return;
  const hijos = [...vista.children], n = hijos.length;
  vista.classList.remove('volviendo'); vista.classList.add('estirando');
  hijos.forEach((h, k) => {
    const off = lado === 'arriba' ? dist * 0.45 * (1 - Math.pow(0.55, k + 1)) : -dist * 0.45 * (1 - Math.pow(0.55, n - k));
    h.style.transform = `translateY(${off.toFixed(1)}px)`;
  });
}
function soltarEstirar() {
  const vista = document.querySelector('#contenido .vista'); if (!vista) return;
  vista.classList.remove('estirando'); vista.classList.add('volviendo');
  [...vista.children].forEach(h => { h.style.transform = ''; });
  setTimeout(() => vista.classList.remove('volviendo'), 550);
}
(function () {
  const cont = $('contenido');
  const G = { y0: null, lado: '', activo: false, dist: 0 };
  cont.addEventListener('touchstart', e => {
    G.activo = false; G.dist = 0; G.lado = '';
    if (e.touches.length !== 1) { G.y0 = null; return; }
    G.y0 = e.touches[0].clientY;
    G.arriba = cont.scrollTop <= 0;
    G.abajo = cont.scrollTop + cont.clientHeight >= cont.scrollHeight - 2;
  }, { passive: true });
  cont.addEventListener('touchmove', e => {
    if (G.y0 === null) return;
    const dy = e.touches[0].clientY - G.y0;
    const lado = dy > 0 && G.arriba && cont.scrollTop <= 0 ? 'arriba' : dy < 0 && G.abajo && cont.scrollTop + cont.clientHeight >= cont.scrollHeight - 2 ? 'abajo' : '';
    if (!lado) { if (G.activo) { soltarEstirar(); if (G.lado === 'arriba') ptrOcultar(); } G.activo = false; return; }
    if (!G.activo && Math.abs(dy) > 12) { G.activo = true; G.lado = lado; anularToque(); }
    if (!G.activo) return;
    G.dist = Math.min(Math.abs(dy) * 0.5, 110);
    estirar(G.dist, lado);
    if (lado === 'arriba' && !PTR.ocupado) ptrPintar(G.dist);
  }, { passive: true });
  const fin = () => {
    G.y0 = null;
    if (!G.activo) return;
    G.activo = false; soltarEstirar();
    if (G.lado === 'arriba' && !PTR.ocupado) { if (G.dist >= UMBRAL) ptrActualizar(); else ptrOcultar(); }
  };
  cont.addEventListener('touchend', fin);
  cont.addEventListener('touchcancel', fin);
})();

/* =========================================================
   Botón "atrás" del celular: cierra lo que está abierto
   (calendario, ventana, o vuelve a Inicio) en vez de salir de la app
   ========================================================= */
// Mientras haya algo abierto, se deja UNA "marca" en el historial. Atrás la consume y cierra lo de arriba.
const HIST = { guarda: false, ignorar: 0, t: null };
const algoAbierto = () => !$('cal').hidden || !$('modal').hidden || (!$('app').hidden && S.vista !== 'inicio');
function histRevisar() {
  clearTimeout(HIST.t);
  HIST.t = setTimeout(() => {
    const hace = algoAbierto();
    try {
      if (hace && !HIST.guarda) { history.pushState({ billetera: 1 }, ''); HIST.guarda = true; }
      else if (!hace && HIST.guarda) { HIST.guarda = false; HIST.ignorar++; history.back(); }
    } catch (e) {}
  }, 80);
}
window.addEventListener('popstate', () => {
  if (HIST.ignorar > 0) { HIST.ignorar--; return; }
  HIST.guarda = false;
  if (!$('cal').hidden) cerrarCal(true);
  else if (!$('modal').hidden) cerrarModal(true);
  else if (!$('app').hidden && S.vista === 'flujo' && S.flujo && S.flujo.i > 0) { S.flujo.i--; render(); }
  else if (!$('app').hidden && S.vista === 'flujo' && S.flujo && S.flujo.menu) { S.menu = S.flujo.menu; S.flujo = null; irA('menu', true); }
  else if (!$('app').hidden && S.vista !== 'inicio') { if (S.vista === 'flujo') S.flujo = null; irA('inicio', true); }
  histRevisar();
});

// Ubica la luz y el globito sobre lo que hay que tocar (se llama en cada cuadro, así sigue a la pantalla)
function ubicarGuia() {
  const p = pasoActual(); if (!p) return;
  const el = p.el(), luz = $('guia').querySelector('.guia-luz'), globo = $('guia').querySelector('.guia-globo');
  const vv = window.visualViewport, W = vv ? vv.width : innerWidth, H = vv ? vv.height : innerHeight, top0 = vv ? vv.offsetTop : 0;
  if (!el || !el.getClientRects().length) {
    // lo que había que tocar desapareció (por ejemplo, se cerró la ventana)

  }

// Durante una guía, solo se puede tocar lo que está iluminado, el globito (✕, Listo, Siguiente, Saltar)

function guiaPermite(t) {

/* ---------- Comparación con el mes anterior (solo modo completo) ---------- */
function totalMes(ym) {
  const per = datosFiltrados(S.personal).filter(f => String(f.fecha).slice(0, 7) === ym).reduce((s, f) => s + (Number(f.monto) || 0), 0);
  const neg = datosFiltrados(S.negocio).filter(f => String(f.fecha).slice(0, 7) === ym).reduce((s, f) => s + totalNegocio(f), 0);
  return r2(per + neg);
}
function mesesAtras(n) { const d = aFecha(hoy()); d.setDate(1); d.setMonth(d.getMonth() - n); return aISO(d).slice(0, 7); }
function tarjComparacion() {
  const meses = [5, 4, 3, 2, 1, 0].map(mesesAtras), tot = meses.map(totalMes);
  if (!tot.some(v => v > 0)) return '';
  const act = tot[5], ant = tot[4], nomAnt = MESES[Number(meses[4].slice(5)) - 1];
  let txt;
  if (!ant) txt = `No hay gastos en ${nomAnt} para comparar.`;
  else {
    const dif = Math.round((act - ant) / ant * 100);
    txt = dif === 0 ? `Vas gastando <b>lo mismo</b> que en ${nomAnt}.` : `Vas gastando <b class="${dif < 0 ? 'menos' : 'mas'}">${Math.abs(dif)}% ${dif < 0 ? 'menos' : 'más'}</b> que en ${nomAnt}.`;
  }
  const max = Math.max(...tot, 1);
  return `<section class="tarj comp"><h2 style="margin:0">Comparado con ${nomAnt}</h2><p>${txt}</p>
    <div class="barras" role="img" aria-label="Gastos de los últimos 6 meses">${meses.map((m, i) => `<div class="${i === 5 ? 'actual' : ''}" title="${MESES[Number(m.slice(5)) - 1]}: ${fmt(tot[i])}"><i style="height:${Math.max(4, Math.round(tot[i] / max * 86))}px"></i><small>${MESES[Number(m.slice(5)) - 1].slice(0, 3)}</small></div>`).join('')}</div></section>`;
}

/* =========================================================
   Teclado del celular
   - La tecla "→" pasa al campo siguiente; en el último, esconde el teclado.
   - Al esconder el teclado con "⌄", Android a veces escribe la tecla que pasa por debajo
     del dedo mientras baja (el "7 fantasma"). La app ignora cualquier tecla en ese instante.
   ========================================================= */
const TEC = { maxAlto: 0, abierto: false, cerrado: 0, ult: null };
function camposDe(cont) {
  return [...cont.querySelectorAll('input:not([type=hidden]):not([type=file]):not([disabled]):not([readonly])')].filter(e => e.getClientRects().length);
}
document.addEventListener('focusin', ev => {
  const el = ev.target;
  if (!el.matches || !el.matches('#modalIn input')) return;
  const lista = camposDe($('modalIn'));
  el.setAttribute('enterkeyhint', lista.indexOf(el) < lista.length - 1 ? 'next' : 'done');
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || ev.isComposing) return;
  const el = ev.target;
  if (!el.matches) return;
  if (el.id === 'buscarTodos') { ev.preventDefault(); return el.blur(); }
  if (!el.matches('#modalIn input') || el.id === 'fIn') return;
  ev.preventDefault();
  const lista = camposDe($('modalIn')), i = lista.indexOf(el);
  if (i >= 0 && i < lista.length - 1) { lista[i + 1].focus(); if (lista[i + 1].classList.contains('plata-in')) { const L = lista[i + 1].value.length; try { lista[i + 1].setSelectionRange(L, L); } catch (e) {} } }
  else el.blur();
});
// Antes de cada tecla: si el teclado se acaba de esconder, se ignora; si no, se guarda cómo estaba el campo
document.addEventListener('beforeinput', ev => {
  const el = ev.target;
  if (!el.matches || !el.matches('input,textarea')) return;
  if (performance.now() - TEC.cerrado < 600) { ev.preventDefault(); return; }
  TEC.ult = { el, valor: el.value, t: performance.now() };
}, true);
function tecladoSeCerro() {
  const ahora = performance.now();
  TEC.cerrado = ahora;
  const el = document.activeElement;
  if (!el || !el.matches || !el.matches('input,textarea')) return;
  // Una tecla que llegó justo antes de que termine de bajar el teclado: se deshace
  if (TEC.ult && TEC.ult.el === el && ahora - TEC.ult.t < 450 && el.value !== TEC.ult.valor) {
    el.value = TEC.ult.valor;
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
  TEC.ult = null;
  el.blur();
}
if (window.visualViewport) {
  const medir = () => {
    const h = visualViewport.height;
    if (h > TEC.maxAlto) TEC.maxAlto = h;
    const abierto = h < TEC.maxAlto - 150;
    if (TEC.abierto && !abierto) tecladoSeCerro();
    TEC.abierto = abierto;
  };
  visualViewport.addEventListener('resize', medir);
  window.addEventListener('orientationchange', () => { TEC.maxAlto = 0; TEC.abierto = false; });
  medir();
}

- Si la respuesta es cómo hacer algo en la app, terminá con UNA etiqueta (sola, en el último renglón) de esta lista, la que corresponda; la app la convierte en "Ver cómo se hace". No la nombres en el texto:
  [[guia:cambio]] cambio de plata · [[guia:compra]] compra de mercadería · [[guia:pasero]] gastos del viaje (pasaje, pasero, chalana, comida) · [[guia:general]] gastos generales del negocio (envíos, contadora, monotributo, publicidad…) · [[guia:personal]] gasto personal con su plata · [[guia:usar]] usé plata del negocio · [[guia:devolver]] devolver plata al negocio · [[guia:contar]] contar o ajustar el efectivo · [[guia:efectivo]] qué es el efectivo disponible · [[guia:corregir]] corregir o borrar · [[guia:cuanto]] ver cuánto gasté · [[guia:todos]] ver todos los movimientos · [[guia:excel]] descargar el Excel · [[guia:tipos]] qué es recuperable y no reversible · [[guia:ajustes]] tamaño o tipo de letra, modo claro/oscuro y modo simple · [[guia:recorrido]] recorrido por la app
- Temas fuera de la app (impuestos, monotributo, precios, consejos de plata): decí con amabilidad que solo ayudás con la Billetera.
- Si alguien dice que el admin (Enzo) le cargó algo y no le aparece: NO le sugieras cargarlo de nuevo (quedaría dos veces). Decile que abra la app con internet y deslice hacia abajo para actualizar; si sigue sin aparecer, que le avise a Enzo.

CARGAR MOVIMIENTOS DESDE LA CHARLA
- Si la persona te pide anotar/cargar algo (o manda la foto de un comprobante para cargar), armá la propuesta: una frase corta y, en el último renglón, UNA etiqueta [[cargar:{...}]] con JSON válido (números sin puntos de miles, con punto para decimales). La app muestra una tarjeta con **Guardar** y **Corregir**: vos nunca guardás, la persona confirma.
- Si falta un dato obligatorio (por ejemplo, si pagó en efectivo o por transferencia), preguntalo antes y no pongas la etiqueta todavía.
- Formatos ("fecha" es opcional, "aaaa-mm-dd"; si no la dicen, es hoy):
  · Cambio a efectivo: {"tipo":"cambio","monto":500000,"pct":1,"comision":"Efectivo" o "Descuento","lugar":"Bermejo" u "Otro","nota":""}  (si no le cobraron, pct 0; lugar por defecto Bermejo)
  · Compra de mercadería: {"tipo":"compra","descripcion":"Tazas","unidades":24,"monto":60000,"pago":"Efectivo" o "Transferencia","pct":0}
  · Gasto del viaje (pasero, chalana, comida, colectivo…): {"tipo":"viaje","que":"<una de Gastos del viaje o un texto corto>","monto":3000,"pago":"Efectivo"}
  · Gasto general del negocio (envíos, contadora, monotributo, publicidad…): {"tipo":"general","categoria":"<una de Categorías de gastos generales>","monto":8450,"pago":"Transferencia","descripcion":""}
  · Gasto personal con su plata: {"tipo":"personal","categoria":"<una de Categorías personales>","monto":15000,"pago":"Efectivo","descripcion":""}
  · Usó plata del negocio para algo personal: {"tipo":"usar","categoria":"<Categorías personales>","monto":27000,"pago":"Transferencia","devuelto":"Toda" | "Parte" | "Todavia" | "No","parte":20000,"pagoDev":"Efectivo" o "Transferencia","descripcion":""}
  · Devolvió plata al negocio: {"tipo":"devolver","monto":7000,"pagoDev":"Efectivo" o "Transferencia"}
- Usá los nombres exactos de las LISTAS DE LA APP que están en los datos.

QUÉ ES LA APP
Billetera Digital anota los gastos de la familia: los personales y los del negocio de cada uno (sus tiendas de MercadoLibre). Cada persona tiene su negocio. Enzo es el admin: armó la app, ve los datos de todos y aprueba las cuentas nuevas.
- Funciona SIN internet (por ejemplo en la feria de Bermejo, Bolivia): guarda todo en el celular y lo sube solo cuando vuelve la señal. Arriba se ve "Todo subido" o cuántos faltan subir. La IA sí necesita internet.
- Para abrir la app se dibuja un patrón. Si se olvidó: "Olvidé mi patrón" y se entra con usuario y contraseña.
- Los montos se escriben como en Ualá: los números entran por la derecha y los dos últimos son los centavos. Para $ 500.000,00 se escribe 50000000 (con los dos ceros de los centavos). Si escribe 500000 queda $ 5.000,00.
- Si un movimiento aparece en rojo, Google no lo aceptó: hay que abrirlo y corregirlo.
- Hay dos modos; se cambia en **Perfil** → **Modo simple** (prender o apagar).
- **Perfil** → **Apariencia**: tamaño de la letra (barra de Chica a Enorme), tipo de letra (Moderna, Muy clara, Redondeada) y modo **Oscuro**, **Claro** o **Automático** (sigue al celular). Se guarda en cada celular.
- Teclado: la tecla → del teclado pasa al campo siguiente; en el último, lo esconde. Si al esconder el teclado se escribía un número solo, la app ahora lo ignora.
- En esta charla se puede mandar una **foto o captura** con el ícono 📷. Si te mandan una foto, describí lo que ves que tenga que ver con la app o con sus gastos (por ejemplo un comprobante o una pantalla con error) y explicá cómo cargarlo o resolverlo. No podés cargar nada vos.
- Cada persona ve todo lo de su negocio, aunque lo haya cargado otro (por ejemplo, el admin), y lo puede corregir.

MODO SIMPLE (una pregunta por pantalla)
Inicio: arriba el saludo y el círculo con las iniciales (abre el Perfil). Si se debe plata al negocio, aparece "Le debés al negocio $ X" con **Devolver**. Después "Efectivo del negocio" con **Contar**. Dos opciones grandes: **🧳 Negocio - Compras** y **🏠 Gastos personales**. Abajo, **Ver lo que cargué**. El ícono 🤖 abre esta charla. Arriba hay un **ojito** para ocultar los montos.
- 🧳 Negocio - Compras:
  · **💱 Cambié plata**: ¿Cuánto transferiste? → ¿Qué porcentaje te cobraron? → ¿Cómo pagaste la comisión? (**En efectivo**: me dieron todo y pagué la comisión con billetes / **Me la descontaron**: me dieron menos) → nota opcional → resumen → **Guardar**. En el resumen dice "Lugar: Bermejo"; si fue en otro lugar, se elige **¿Fue en otro lugar?**.
  · **🛒 Compré mercadería**: producto, unidades, cuánto pagó en total, cómo pagó.
  · **🚌 Gastos del viaje**: qué pagó (pasaje, pasero, chalana, comida…), cuánto, cómo.
  · **🧾 Otro gasto del negocio**: gastos del negocio fuera de viajes (envíos, contadora, monotributo, publicidad…): categoría, cuánto, cómo, detalle opcional. Sin viaje.
- 🏠 Gastos personales:
  · **👛 Gasté con mi plata**: gasto personal pagado con su propia plata.
  · **↩️ Usé plata del negocio**: para qué, cuánto, cómo pagó, ¿ya la devolviste? (Sí, toda / Una parte / Todavía no / No la voy a devolver). Si ya devolvió, pregunta cómo: en efectivo o por transferencia.
  · **💵 Devolví plata al negocio**: cuánto (ya aparece todo lo que se debe) y cómo: **En efectivo** o **Por transferencia**.
- En cada pantalla: **Siguiente**, **Atrás** arriba a la izquierda y **✕** para salir. Al final, un resumen "¿Está todo bien?" y **Guardar**.
- **Ver lo que cargué**: la lista; tocando uno se ve el detalle y se puede **corregir** o **borrar**.

MODO COMPLETO
Barra de abajo: **Inicio**, **Personal**, **+** (en el medio), **Negocio**, **Perfil**. El ícono 🤖 (abajo a la derecha) tiene esta charla y guías paso a paso que iluminan dónde tocar.
- **Inicio**: cuánto se gastó en el mes, "Comparado con <mes anterior>" (cuánto más o menos que el mes pasado y barras de 6 meses), "Por categoría" (se agranda al elegirla), "Últimos gastos" con **Consultar todos** (buscar por palabra o monto y filtrar por tipo: Personal, Compras, No reversible, Gastos generales, Cambios, Efectivo, Transferencia).
- **+** abre dos grupos. **Negocio**: **Viajes** (pestañas **Inversión** y **No reversible**), **Gastos generales** (categoría, fecha, monto, detalle, pago; sin viaje) y **Cambio a efectivo**. **Personal**: **Gasto personal** y **Plata del negocio** (Usé plata del negocio / Devolví plata al negocio).
  · Cambio: **Lugar** (**Bermejo**, ya marcado, o **Otro lugar**; en Bermejo queda dentro del viaje del día, en otro lugar sin viaje), monto transferido, % (0 si no cobraron) y "¿Cómo pagaste la comisión?" (**En efectivo** / **Descontada**), nota opcional.
  · Gasto personal: de dónde salió la plata (**Negocio** o **Personal**), categoría, fecha (Hoy, Ayer o calendario), monto, detalle opcional, efectivo o transferencia. Si la plata es del negocio, **Lo voy a devolver** deja anotada la deuda.
  · Devolución: cuánto, cómo (**En efectivo** / **Transferencia**) y nota opcional.
- **Negocio**: Mes / Semana / Día, cuatro tarjetas: **Recuperable**, **No reversible (viajes)**, **Gastos generales** y **Efectivo disponible** (elegirlo permite ajustarlo), y los movimientos. Se puede ver por viaje.
- **Personal**: los gastos personales, mes por mes (elegí el mes para ver otro).
- **Perfil**: datos de la cuenta, **Versión de la app**, **Subir y actualizar ahora**, **Modo simple**, **Descargar resumen** (Excel o **PDF**, por mes o por viaje), **Cuentas de la familia** (solo el admin), **Mostrar ayudante 🤖**, **Apariencia** (letra y modo claro u oscuro), **Cambiar mi patrón**, **Cerrar sesión**.
- Para corregir: abrir el movimiento → lápiz ✏️ → cambiar → **Guardar cambios**. Para borrar: **Borrar este gasto**, abajo de todo.

CONCEPTOS
- **Inversión / Recuperable**: mercadería comprada para vender. La plata vuelve cuando se vende. Puede tener un recargo de la tienda si se pagó por transferencia.
- **No reversible**: gastos que no vuelven: pasero, colectivo, chalana, baño, bodega, comida del viaje, la comisión del cambio. Categorías: Insumos (pasajes, pasero), Sueldo (comida y bebida del viaje), Interés/Gastos (comisiones, recargos), Otros.
- **Cambio a efectivo**: se transfiere (por ejemplo a un cambista en Bermejo, o a un conocido) y te dan efectivo. Con conocidos muchas veces no hay comisión (0%). La comisión (un %) es un gasto no reversible. Con la comisión en efectivo dan todo lo transferido y la comisión se paga con billetes; descontada, dan menos. En los dos casos el efectivo del negocio sube lo transferido menos la comisión.
- **Efectivo del negocio / Efectivo disponible**: la plata del negocio que la persona tiene en la mano. Sube con los cambios y las devoluciones en efectivo; baja con lo que se paga en efectivo. Si no coincide con lo que cuenta: **Contar** (simple) o elegir **Efectivo disponible** (completo), escribir lo que tiene y la app corrige la diferencia ("Ajuste de efectivo"). Si al pagar no alcanza el efectivo, la app avisa.
- **Viaje**: cada ida a Bermejo se anota como "Bermejo" + la fecha (ida y vuelta en el día).
- **Plata del negocio usada para algo personal**: se carga con **Usé plata del negocio**. Si se va a devolver, queda "Le debés al negocio". Al devolver, baja la deuda: **en efectivo** suma al efectivo del negocio; **por transferencia** vuelve a Mercado Pago y el efectivo no cambia.
- Si alguien quiere devolver y la app dice que no tiene nada anotado, es porque la plata usada no se cargó con **Usé plata del negocio** (o ya devolvió todo). La app ofrece **Cargarlo ahora**.
- **Excel y PDF**: se descargan desde Perfil (modo completo), por mes o por viaje, y quedan en las Descargas del celular. El PDF trae totales, comparación con el mes anterior, categorías y movimientos.
- **Gastos generales**: gastos del negocio que no son de un viaje (Mercado Envíos FULL, correo y envíos, publicidad, contadora, monotributo / IIBB, sueldo, insumos de embalaje, otros). No reversible (viajes) son solo los gastos de los viajes.
- **Ojito** (arriba, al lado del saludo): oculta todos los montos como "$ •••••" y queda así hasta que se vuelva a tocar. Mientras se carga algo, los montos se ven.
- **Lo de siempre**: al cargar algo que ya se cargó antes, abajo del monto aparecen los últimos montos usados para eso; un toque y queda puesto.
- **Accesos directos**: dejando apretado el ícono de la app en el celular aparecen Cambié plata, Compré mercadería, Gastos del viaje y Gasté con mi plata (si la app está instalada en la pantalla de inicio).
- **Versión**: en Perfil → Versión de la app se ve el número (por ejemplo 1.10.0) y la fecha.`;

// Etiqueta de la IA → guía (modo completo) o paso a paso / pantalla (modo simple)
const IA_ACC = {
  cambio: { guia: 'cambio', flujo: 'cambio' }, compra: { guia: 'compra', flujo: 'compra' }, pasero: { guia: 'noreversible', flujo: 'viaje' },
  personal: { guia: 'personal', flujo: 'personal' }, usar: { guia: 'usar', flujo: 'usar' }, devolver: { guia: 'devolver', flujo: 'devolver' }, general: { guia: 'general', flujo: 'general' },
  contar: { guia: 'contar', flujo: 'contar' }, efectivo: { guia: 'efectivo' }, corregir: { guia: 'corregir', vista: 'lista' },
  cuanto: { guia: 'cuanto', vista: 'lista' }, todos: { guia: 'todos', vista: 'lista' }, excel: { guia: 'excel' }, tipos: { guia: 'tipos' },
  ajustes: { guia: 'ajustes', vista: 'perfil' }, recorrido: { guia: 'recorrido' }
};
const IA = { msgs: [], cargando: false, img: '', imgUrl: '' };

// Lo que la IA sabe de la persona: lo mismo que ve en la app
function contextoIA() {
  const y = S.yo, L = [];
  const negs = y.admin ? (S.listas['Negocios'] || []) : [y.negocio];
  L.push('Hoy es ' + new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + '.');
  L.push(`Persona: ${y.nombre} (usuario ${y.usuario}). Su negocio: ${y.negocio}. ${y.admin ? 'Es el ADMIN: ve los datos de todos los negocios.' : 'Ve lo que cargó en la app.'}`);
  L.push('Modo de la app que usa ahora: ' + (esSimple() ? 'SIMPLE' : 'COMPLETO') + '.');
  L.push(`Movimientos sin subir todavía: ${S.cola.length}. Con error (en rojo): ${S.rech.length}.`);
  L.push('\nLISTAS DE LA APP (usá estos nombres exactos al cargar):');
  L.push('- Categorías personales: ' + (S.listas['Categorías personales'] || []).join(' | '));
  L.push('- Categorías de gastos generales: ' + (S.listas['Categorías gastos generales'] || LISTAS_BASE['Categorías gastos generales']).join(' | '));
  L.push('- Gastos del viaje (descripciones rápidas): ' + (S.listas['Descripciones rápidas'] || []).join(' | '));
  L.push('\nEFECTIVO Y DEUDA (ahora mismo):');
  negs.forEach(n => L.push(`- ${n}: efectivo del negocio ${fmtReal(efectivoDe(n))} · le deben al negocio (plata usada sin devolver) ${fmtReal(deudaDe(n))}`));
  const suma = (arr, fk, fv) => { const m = {}; arr.forEach(f => { const k = fk(f); m[k] = (m[k] || 0) + (Number(fv(f)) || 0); }); return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${fmtReal(v)}`).join(', '); };
  const tot = (arr, fv) => fmtReal(arr.reduce((s, f) => s + (Number(fv(f)) || 0), 0));
  const meses = [...new Set(S.personal.concat(S.negocio).map(f => String(f.fecha).slice(0, 7)))].filter(Boolean).sort().reverse().slice(0, 12);
  L.push('\nRESÚMENES POR MES (más nuevo primero):');
  meses.forEach(m => {
    L.push(`* ${MESES[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}`);
    negs.forEach(n => {
      const P = S.personal.filter(f => f.negocio === n && String(f.fecha).startsWith(m));
      const N = S.negocio.filter(f => f.negocio === n && String(f.fecha).startsWith(m));
      if (!P.length && !N.length) return;
      const pre = negs.length > 1 ? `  [${n}] ` : '  ';
      if (P.length) {
        L.push(`${pre}Gastos personales: total ${tot(P, f => f.monto)} (${P.length} gastos). Por categoría: ${suma(P, f => f.categoria, f => f.monto)}.`);
        const PN = P.filter(f => f.origen === 'Negocio (MercadoLibre)');
        if (PN.length) L.push(`${pre}  De esos, pagados con plata del negocio: ${tot(PN, f => f.monto)}; marcados para devolver: ${tot(PN.filter(f => f.devolver === 'sí'), f => f.monto)}.`);
      }
      const t = tp => N.filter(f => f.tipo === tp);
      if (t('Inversión').length) L.push(`${pre}Compras de mercadería (recuperable): ${tot(t('Inversión'), f => f.monto)} en ${t('Inversión').length} compras.`);
      const no = N.flatMap(partesNegocio).filter(p => p[2] === 'no');
      if (no.length) L.push(`${pre}No reversible: total ${fmtReal(no.reduce((s, p) => s + p[1], 0))}. Por categoría: ${suma(no, p => p[0], p => p[1])}.`);
      if (t('Gasto general').length) L.push(`${pre}Gastos generales (fuera de viajes): ${tot(t('Gasto general'), f => f.gastoReal)}. Por categoría: ${suma(t('Gasto general'), f => f.categoria, f => f.gastoReal)}.`);
      if (t('Cambio').length) L.push(`${pre}Cambios a efectivo: ${t('Cambio').length}, transferido ${tot(t('Cambio'), f => f.monto)}, comisiones ${tot(t('Cambio'), f => f.comision)}.`);
      if (t('Devolución').length) L.push(`${pre}Devoluciones al negocio: ${tot(t('Devolución'), f => f.monto)} (en efectivo ${tot(t('Devolución').filter(f => f.pago !== 'Transferencia'), f => f.monto)}, por transferencia ${tot(t('Devolución').filter(f => f.pago === 'Transferencia'), f => f.monto)}).`);
    });
  });
  const orden = (a, b) => String(b.fecha).localeCompare(String(a.fecha));
  // Movimientos con detalle: solo los últimos 3 meses (para que la IA responda rápido). Los resúmenes de arriba cubren todo el año.
  const d3 = new Date(); d3.setMonth(d3.getMonth() - 3); const desde = aISO(d3);
  const recientes = arr => arr.filter(f => String(f.fecha) >= desde).sort(orden).slice(0, 150);
  L.push('\nMOVIMIENTOS PERSONALES DE LOS ÚLTIMOS 3 MESES (más nuevo primero; lo anterior está solo en los resúmenes): fecha | negocio | cargó | categoría | detalle | plata de | pago | monto | a devolver');
  recientes(S.personal).forEach(f => L.push([f.fecha, f.negocio, f.usuario || '', f.categoria, f.descripcion || '-', f.origen === 'Personal' ? 'propia' : 'del negocio', f.pago, fmtReal(f.monto), f.devolver === 'sí' ? 'sí' : 'no'].join(' | ')));
  L.push('\nMOVIMIENTOS DEL NEGOCIO DE LOS ÚLTIMOS 3 MESES (más nuevo primero): fecha | negocio | cargó | viaje | tipo | categoría | detalle | monto | pago | extra | efectivo +/-');
  recientes(S.negocio).forEach(f => {
    let extra = '';
    if (f.tipo === 'Inversión') extra = `${f.unidades} unidades a ${fmtReal(f.costoUnit)}` + (Number(f.recargo) ? `, recargo ${fmtReal(f.recargo)}` : '');
    else if (f.tipo === 'Cambio') extra = `${pct(f.pctCambio)}, comisión ${fmtReal(f.comision)} ${f.pago === 'Efectivo' ? 'pagada en efectivo' : 'descontada'}, efectivo recibido ${fmtReal(f.recibido)}`;
    else if (f.tipo === 'Ajuste') extra = 'efectivo contado ' + fmtReal(f.monto);
    else if (f.tipo === 'Devolución') extra = f.pago === 'Transferencia' ? 'devuelta por transferencia' : 'devuelta en efectivo';
    const mov = Number(f.movEfectivo) || 0;
    L.push([f.fecha, f.negocio, f.usuario || '', f.viaje || '-', f.tipo, f.categoria, f.descripcion || '-', fmtReal(f.monto), f.pago, extra || '-', (mov >= 0 ? '+' : '-') + fmtReal(Math.abs(mov))].join(' | '));
  });
  return L.join('\n');
}

      const limpio = m.txt.replace(/\[\[guia:[a-z]*\]\]/g, '').replace(/\[\[cargar:[\s\S]*?\]\]/g, '').trim();
      const ir = acc && IA_ACC[acc] && (esSimple() ? (IA_ACC[acc].flujo || IA_ACC[acc].vista) : IA_ACC[acc].guia);
      h += `<div class="ia-b ia">${textoIA(limpio)}${m.carga ? tarjetaCarga(m.carga, IA.msgs.indexOf(m)) : ''}${ir && !m.carga ? `<button type="button" class="ia-ver" data-acc="iaGuia" data-g="${acc}">Ver cómo se hace ${svg('der', 16, 2.6)}</button>` : ''}</div>`;
    }
  });
  if (IA.cargando) h += `<div class="ia-b ia escribiendo" aria-label="La IA está escribiendo"><i></i><i></i><i></i></div>`;
  box.innerHTML = h;
  box.scrollTop = box.scrollHeight;
  const b = document.querySelector('#modalIn .ia-enviar'); if (b) b.disabled = IA.cargando;
}
async function enviarIA(texto) {
  const inp = $('iaIn');
  const txt = String(texto != null ? texto : (inp ? inp.value : '')).trim();
  if ((!txt && !IA.img) || IA.cargando) return;
  if (inp && texto == null) { inp.value = ''; inp.style.height = ''; }
  IA.msgs.push({ rol: 'yo', txt, img: IA.img, imgUrl: IA.imgUrl });
  quitarFotoIA();
  if (!navigator.onLine) { IA.msgs.push({ rol: 'error', txt: 'No hay internet. La IA funciona solo con señal: probá cuando tengas conexión.' }); return pintarIA(); }
  IA.cargando = true; pintarIA();
  // Las fotos viajan solo en los 2 mensajes más nuevos que tengan (para que sea liviano)
  const conFoto = IA.msgs.filter(m => m.img).slice(-2);
  const mensajes = IA.msgs.filter(m => m.rol !== 'error').slice(-14).map(m => ({ rol: m.rol === 'yo' ? 'user' : 'ia', txt: m.txt, img: conFoto.includes(m) ? m.img : undefined }));
  try {
    const r = await api({ accion: 'ia', token: S.token, mensajes, manual: MANUAL_IA, contexto: contextoIA() });
    IA.msgs.push({ rol: 'ia', txt: String(r.respuesta || '') });
  } catch (e) {
    if (e.sesionVencida) { IA.cargando = false; cerrarModal(); return cerrarSesionLocal(e.message); }
    IA.msgs.push({ rol: 'error', txt: e.red ? 'No pude conectarme. Revisá la señal y probá de nuevo.' : /Acción desconocida/.test(e.message) ? 'La IA todavía no está activada en Google. Avisale a Enzo.' : e.message });
  }
  IA.cargando = false;
  if ($('iaMsgs')) pintarIA();
}
// Foto: se achica a 1280 px como máximo y se manda como JPEG (liviano)
async function fotoElegida(file) {
  if (!file || !/^image\//.test(file.type)) return;
  try {
    const url = URL.createObjectURL(file);
    const im = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
    const k = Math.min(1, 1280 / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const dataUrl = c.toDataURL('image/jpeg', 0.8);
    IA.img = dataUrl.split(',')[1]; IA.imgUrl = dataUrl;
    const a = $('iaAdj');
    if (a) { a.innerHTML = `<img src="${dataUrl}" alt="Foto elegida"><span>Foto lista para mandar. Escribí tu pregunta (o mandala así).</span><button type="button" class="cerrar" data-acc="iaQuitarFoto" aria-label="Quitar la foto">${svg('x', 16, 2.4)}</button>`; a.hidden = false; }
    const i = $('iaIn'); if (i) i.focus();
  } catch (e) { avisar('No pude abrir esa foto. Probá con otra.'); }
}
function quitarFotoIA() { IA.img = ''; IA.imgUrl = ''; const a = $('iaAdj'); if (a) { a.hidden = true; a.innerHTML = ''; } const f = $('iaArchivo'); if (f) f.value = ''; }
document.addEventListener('change', ev => { if (ev.target.id === 'iaArchivo') fotoElegida(ev.target.files && ev.target.files[0]); });
/* ---------- La IA propone cargar un movimiento: tarjeta con Guardar / Corregir (nunca guarda sola) ---------- */
function leerCarga(txt) {
  const m = String(txt || '').match(/\[\[cargar:([\s\S]*?)\]\](?![\s\S]*\[\[cargar:)/);
  if (!m) return null;
  let c; try { c = JSON.parse(m[1].trim()); } catch (e) { return { errores: ['No pude leer la propuesta de la IA. Pedile que la arme de nuevo.'] }; }
  return Object.assign(validarCarga(c), { estado: '' });
}
function validarCarga(c) {
  const tipos = ['cambio', 'compra', 'viaje', 'general', 'personal', 'usar', 'devolver'];
  const tipo = String(c && c.tipo || '').toLowerCase(), err = [];
  if (!tipos.includes(tipo)) return { errores: ['La IA propuso algo que la app no sabe cargar.'] };
  const n = v => { const x = typeof v === 'number' ? v : num(String(v == null ? '' : v)); return isNaN(x) ? NaN : r2(x); };
  const enLista = (v, lista) => lista.find(x => x.toLowerCase() === String(v || '').trim().toLowerCase()) || '';
  const pago = v => /^ef/i.test(String(v || '')) ? 'Efectivo' : /^tr/i.test(String(v || '')) ? 'Transferencia' : '';
  const negocio = S.yo.admin && S.filtro ? S.filtro : S.yo.negocio;
  let fecha = String(c.fecha || '').slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha) || fecha > hoy() || isNaN(aFecha(fecha))) fecha = hoy();
  const d = { fecha }, monto = n(c.monto);
  if (!(monto > 0)) err.push('Falta el monto.'); else d.monto = String(monto);
  if (['compra', 'viaje', 'general', 'personal', 'usar'].includes(tipo)) { d.pago = pago(c.pago); if (!d.pago) err.push('Falta si pagaste en efectivo o por transferencia.'); }
  if (tipo === 'cambio') {
    const pc = c.pct == null || c.pct === '' ? 0 : n(c.pct);
    if (!(pc >= 0 && pc <= 100)) err.push('Revisá el porcentaje.'); else d.pct = String(pc);
    d.comision = /^ef/i.test(String(c.comision || '')) ? 'Efectivo' : 'Descuento';
    d.lugar = /^otro/i.test(String(c.lugar || '')) ? 'Otro' : 'Bermejo';
    d.nota = String(c.nota || '').trim().slice(0, 80);
  } else if (tipo === 'compra') {
    d.descripcion = String(c.descripcion || '').trim().slice(0, 120); if (!d.descripcion) err.push('Falta qué compraste.');
    const u = n(c.unidades); if (!(u > 0)) err.push('Faltan las unidades.'); else d.unidades = String(u);
    const pc = n(c.pct); d.extra = d.pago === 'Transferencia' && pc > 0 ? 'Sí' : 'No'; if (d.extra === 'Sí') d.pct = String(pc);
  } else if (tipo === 'viaje') {
    const q = String(c.que || c.descripcion || '').trim(), l = enLista(q, S.listas['Descripciones rápidas'] || []);
    if (!q) err.push('Falta qué pagaste.');
    if (l) d.que = l; else { d.que = 'Otra cosa'; d.otro = q.slice(0, 120); }
  } else if (tipo === 'general') {
    d.categoria = enLista(c.categoria, S.listas['Categorías gastos generales'] || LISTAS_BASE['Categorías gastos generales']);
    if (!d.categoria) err.push('Elegí la categoría con Corregir.');
    d.descripcion = String(c.descripcion || '').trim().slice(0, 120);
  } else if (tipo === 'personal' || tipo === 'usar') {
    d.categoria = enLista(c.categoria, S.listas['Categorías personales'] || []);
    if (!d.categoria) err.push('Elegí la categoría con Corregir.');
    d.descripcion = String(c.descripcion || '').trim().slice(0, 120);
    if (tipo === 'usar') {
      d.devuelto = ['Toda', 'Parte', 'Todavia', 'No'].find(x => x.toLowerCase() === String(c.devuelto || '').toLowerCase().replace('í', 'i')) || 'Todavia';
      if (d.devuelto === 'Parte') { const pa = n(c.parte); if (!(pa > 0 && pa < monto)) err.push('Revisá cuánto devolviste.'); else d.parte = String(pa); }
      if (d.devuelto === 'Toda' || d.devuelto === 'Parte') d.pagoDev = /^tr/i.test(String(c.pagoDev || '')) ? 'Transferencia' : 'Efectivo';
    }
  } else if (tipo === 'devolver') {
    d.pagoDev = /^tr/i.test(String(c.pagoDev || c.pago || '')) ? 'Transferencia' : 'Efectivo';
    if (!(deudaDe(negocio) > 0)) err.push('No hay plata anotada para devolver: primero cargá lo que usaste del negocio.');
  }
  return { fl: { tipo, d, negocio, pedirInicial: false, sinControl: true }, errores: err };
}
function tarjetaCarga(c, i) {
  if (!c.fl) return `<div class="ia-carga mal">${esc((c.errores || []).join(' '))}</div>`;
  const F = FLUJOS[c.fl.tipo], filas = filasFlujo(c.fl);
  const { saleEfectivo } = c.estado ? { saleEfectivo: 0 } : opDeFlujo(Object.assign({}, c.fl, { d: Object.assign({}, c.fl.d) }));
  const noAlcanza = saleEfectivo > 0 && saleEfectivo > efectivoDe(c.fl.negocio);
  return `<div class="ia-carga${c.estado === 'guardado' ? ' ok' : ''}">
    <div class="ia-carga-tit">${F.emoji} ${esc(F.titulo)}</div>
    ${filas.map(([k, v]) => `<div class="fila-p"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}
    ${c.errores && c.errores.length ? `<div class="ia-carga-av">${esc(c.errores.join(' '))}</div>` : ''}
    ${noAlcanza ? `<div class="ia-carga-av">Según la app no alcanza el efectivo del negocio. Revisalo antes de guardar.</div>` : ''}
    ${c.estado === 'guardado' ? `<div class="ia-carga-listo">✓ Guardado</div>` : `<div class="ia-carga-bot"><button type="button" class="ia-ver" data-acc="iaGuardar" data-i="${i}" ${c.errores && c.errores.length ? 'disabled' : ''}>Guardar ✓</button><button type="button" class="btn btn-sec" data-acc="iaCorregir" data-i="${i}">Corregir</button></div>`}
  </div>`;
}
function guardarCarga(i) {
  const m = IA.msgs[Number(i)], c = m && m.carga;
  if (!c || !c.fl || c.estado || (c.errores && c.errores.length)) return;
  const fl = Object.assign({}, c.fl, { d: Object.assign({}, c.fl.d) });
  const { op } = opDeFlujo(fl);
  if (!op) return;
  encolar(Object.assign({ tipo: 'guardar', id: nuevoId() }, op));
  if (fl.extra) encolar(fl.extra);
  c.estado = 'guardado'; pintarIA(); avisar('✓ Guardado');
}
function corregirCarga(i) {
  const m = IA.msgs[Number(i)], c = m && m.carga;
  if (!c || !c.fl) return;
  const { tipo, d } = c.fl;
  cerrarModal();
  if (esSimple()) return iniciarFlujo(tipo, { d: Object.assign({}, d) });
  // Modo completo: se abre el formulario con todo completado
  const neg = c.fl.negocio, set = o => { Object.assign(S.form, o); S.form.hoja === 'personal' ? pintarFormPersonal() : pintarFormNegocio(); };
  if (tipo === 'cambio') { formNegocio(null, 'Cambio', neg); return set({ fecha: d.fecha, monto: d.monto || '', pctCambio: d.pct || '', pagoComision: d.comision === 'Efectivo' ? 'Efectivo' : 'Transferencia', lugar: d.lugar, nota: d.nota || '' }); }
  if (tipo === 'compra') { formNegocio(null, 'Inversión', neg); return set({ fecha: d.fecha, descripcion: d.descripcion || '', unidades: d.unidades || '', monto: d.monto || '', pago: d.pago || 'Transferencia', pctRecargo: d.extra === 'Sí' ? d.pct : '' }); }
  if (tipo === 'viaje') { formNegocio(null, 'No reversible', neg); return set({ fecha: d.fecha, categoria: catDeViaje(d.que), descripcion: d.que === 'Otra cosa' ? (d.otro || '') : d.que, monto: d.monto || '', pago: d.pago || 'Efectivo' }); }
  if (tipo === 'general') { formNegocio(null, 'Gasto general', neg); return set({ fecha: d.fecha, categoria: d.categoria || '', descripcion: d.descripcion || '', monto: d.monto || '', pago: d.pago || 'Transferencia' }); }
  if (tipo === 'personal' || tipo === 'usar') { limpiarModal(); formPersonal(null); return set({ fecha: d.fecha, origen: tipo === 'personal' ? 'Personal' : 'Negocio (MercadoLibre)', devolver: tipo === 'usar' && d.devuelto !== 'No' ? 'sí' : '', categoria: d.categoria || '', descripcion: d.descripcion || '', monto: d.monto || '', pago: d.pago || 'Efectivo' }); }
  if (tipo === 'devolver') { limpiarModal(); formDevolucion(neg, null, { monto: d.monto || '', pago: d.pagoDev === 'Transferencia' ? 'Transferencia' : 'Efectivo', fecha: d.fecha }); }
}
function irAccionIA(id) {
  const a = IA_ACC[id]; if (!a) return;

// Globito del ícono 🤖: aparece unos segundos cada vez que se entra a la app
function globitoRobot() {
  const r = $('robot'), g = $('robotGlobo');
  if (!r || !g || r.hidden) return;
  clearTimeout(globitoRobot.t1); clearTimeout(globitoRobot.t2);
