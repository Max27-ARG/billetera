<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Billetera Digital</title>
<meta name="theme-color" content="#0E0B1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Billetera Digital">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800;900&display=swap">
<script src="config.js"></script>
<style>
/* Billetera Digital — oscuro, violeta/fucsia, tarjetas sólidas, ventanas de carga semitransparentes */
:root{
  --bg:#0E0B1A; --bg2:#120E22; --card:#1A1530; --card2:#241D3F; --card3:#2E2550;
  --ink:#F4F1FF; --muted:#A49CC4; --soft:#C9C0E6; --dim:#7F76A3;
  --violet:#7C4DFF; --violet2:#9B6BFF; --lilac:#D7C8FF; --fuchsia:#E040A0; --pink:#F05BB5;
  --teal:#1F9E95; --teal2:#3FD6C6; --tealbg:#1F4D47; --tealink:#BDF5EE;
  --amber:#FFB547; --red:#FF6B81;
  --grad:linear-gradient(135deg,#7C4DFF 0%,#B347D9 55%,#E040A0 100%);
  --font:'Urbanist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --campo:rgba(11,9,22,.5); --campo2:rgba(11,9,22,.3); --borde:rgba(255,255,255,.13); --sutil:rgba(255,255,255,.07);
  --errtxt:#FFB3BF; --vidrio:rgba(34,27,60,.72); --chatbg:rgba(26,21,48,.96); --velo:rgba(8,6,16,.55); --login1:#2A1650;
  --sobre:#1A1530; --globo:var(--ink); --acento:var(--lilac); --naranja:#F0A04B;
  --toque1:rgba(196,170,255,.40); --toque2:rgba(155,107,255,.20); --toque3:rgba(124,77,255,.06); --toque4:rgba(155,107,255,.22); --c3:#B79CFF; --patpunto:#4A4170;
  color-scheme:dark;
}
/* ---------- Modo claro: fondo claro teñido de lila ---------- */
html.claro .s-efe b{color:var(--tealink)}
html.claro .opcion.chica{color:var(--ink)}
html.claro .opcion.chica .oi{background:var(--card2);color:var(--lilac)}
html.claro .robot-globo,html.claro .guia-globo{border:1px solid var(--borde);box-shadow:0 12px 30px rgba(60,30,140,.22)}
html.claro .vidrio{box-shadow:0 18px 50px rgba(60,30,140,.18)}
html.claro{
  --bg:#F5F1FF; --bg2:#EEE7FF; --card:#FFFFFF; --card2:#F0EAFF; --card3:#E6DCFF;
  --ink:#1F1739; --muted:#6A5F90; --soft:#4B4170; --dim:#9289B5;
  --violet:#7C4DFF; --violet2:#7C4DFF; --lilac:#5B2FD6; --fuchsia:#D6338F; --pink:#C42A82;
  --teal:#1F9E95; --teal2:#0F8278; --tealbg:#D3F2EE; --tealink:#0B6058;
  --amber:#A86300; --red:#D2304D;
  --campo:#FFFFFF; --campo2:rgba(255,255,255,.75); --borde:rgba(70,40,150,.16); --sutil:rgba(70,40,150,.07);
  --errtxt:#B8173F; --vidrio:rgba(255,255,255,.9); --chatbg:#FBF9FF; --velo:rgba(45,25,100,.32); --login1:#E2D5FF;
  --sobre:#1F1739; --globo:#FFFFFF; --acento:#5B2FD6; --naranja:#B5651D;
  --toque1:rgba(124,77,255,.26); --toque2:rgba(124,77,255,.13); --toque3:rgba(124,77,255,.05); --toque4:rgba(124,77,255,.16); --c3:#7C4DFF; --patpunto:#CFC3F0;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.pantalla{position:fixed;inset:0;overflow:auto;padding:calc(24px + var(--safe-t)) max(18px,env(safe-area-inset-right,0px)) calc(24px + var(--safe-b)) max(18px,env(safe-area-inset-left,0px))}

/* ---------- Campos ---------- */
.campo{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--soft);min-width:0}
.campo input,.campo select,.input{width:100%;border:1px solid var(--borde);background:var(--campo);color:var(--ink);border-radius:14px;padding:12px;font-size:16px;font-weight:600}
.clave{position:relative}
.clave input{padding-right:54px}
.ojo{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--soft);display:flex;align-items:center;justify-content:center}
.ojo[aria-pressed="true"]{color:var(--lilac);background:rgba(124,77,255,.18)}
.campo input:focus,.input:focus{outline:none;border-color:var(--violet2);box-shadow:0 0 0 3px rgba(124,77,255,.3)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos>*{min-width:0}
.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-grad{background:var(--grad);color:#fff}
.btn-sec{background:var(--card3);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--soft);font-weight:700;font-size:14px;padding:10px}
.btn:disabled{opacity:.55;cursor:default}
.error{background:rgba(255,107,129,.14);color:var(--errtxt);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.ok{background:rgba(63,214,198,.14);color:var(--tealink);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.ayuda{font-size:12px;font-weight:600;color:var(--soft);line-height:1.4}
.segm{display:flex;background:var(--campo);border-radius:16px;padding:4px;gap:4px}
.segm button{flex:1 1 0;border:0;background:transparent;border-radius:12px;padding:10px 4px;font-weight:700;font-size:14px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:1px}
.segm button small{font-size:10px;font-weight:600}
.segm button[aria-pressed="true"]{background:var(--violet);color:#fff;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--borde);background:var(--campo2);border-radius:14px;padding:10px 12px;font-weight:700;font-size:13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg2);border-color:var(--ink);font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* ---------- Login ---------- */
#login{display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 70% at 50% 0%,var(--login1) 0%,var(--bg) 60%)}
.login-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.marca{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px;text-align:center}
.marca img{width:84px;height:84px;border-radius:24px;box-shadow:0 14px 40px rgba(176,71,217,.45)}
.marca h1{margin:0;font-size:28px;font-weight:900}
.marca p{margin:0;color:var(--muted);font-weight:600}

/* ---------- Patrón ---------- */
#patron{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#patron h2{margin:0;font-size:22px}
#patronSvg{width:280px;height:280px;touch-action:none;user-select:none}
.puntos-error{animation:sacude .35s}
@keyframes sacude{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- Bienvenida ---------- */
#bienvenida{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--grad);text-align:center}
#bienvenida span{font-size:18px;font-weight:700;opacity:.9}
#bienvenida b{font-size:38px;font-weight:900;line-height:1.1}

/* ---------- App ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#contenido{flex:1;overflow:auto;padding:calc(20px + var(--safe-t)) max(18px,env(safe-area-inset-right,0px)) calc(170px + var(--safe-b)) max(18px,env(safe-area-inset-left,0px))}
.vista{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.cabecera{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--card2);color:var(--lilac);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none}
.saludo{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.saludo small{font-size:13px;color:var(--muted);font-weight:600}
.saludo b{font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{border:0;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;background:var(--card);color:var(--soft);white-space:nowrap}
.sync.pend{background:rgba(255,181,71,.16);color:var(--amber)}
.sync.okk{background:var(--tealbg);color:var(--tealink)}
.titulo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.titulo h1{margin:0;font-size:24px;font-weight:900}
.filtro-neg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filtro-neg button{flex:none;border:0;border-radius:20px;padding:8px 13px;background:var(--card);color:var(--soft);font-weight:700;font-size:13px}
.filtro-neg button[aria-pressed="true"]{background:var(--ink);color:var(--bg2);font-weight:800}

.hero{border-radius:26px;background:var(--grad);padding:20px;display:flex;flex-direction:column;gap:14px;color:#fff}
.hero .fila{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .etq{font-size:14px;font-weight:700}
.hero .pill{font-size:12px;font-weight:700;background:rgba(14,11,26,.28);border-radius:20px;padding:5px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.hero .total{font-size:38px;font-weight:900;letter-spacing:-.5px;line-height:1.05}
.hero .sub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .sub div{background:rgba(14,11,26,.28);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hero .sub span{font-size:12px;font-weight:600}
.hero .sub b{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tarj{background:var(--card);border-radius:22px;padding:16px}
.tarj h2{margin:0 0 12px;font-size:16px;font-weight:800}
.dona{display:flex;align-items:center;gap:16px}
.dona svg{flex:none}
.leyenda{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;font-size:13px}
.leyenda div{display:flex;align-items:center;gap:8px}
.leyenda i{width:9px;height:9px;border-radius:3px;flex:none}
.leyenda span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leyenda b{font-weight:800}
.vacio{color:var(--muted);font-size:14px;text-align:center;padding:18px 8px;line-height:1.5}

.periodo{display:flex;flex-direction:column;gap:10px}
.nav-per{display:flex;align-items:center;justify-content:space-between}
.nav-per button{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}
.nav-per b{font-size:16px;font-weight:800}
.anillo{display:flex;justify-content:center}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.mini.cuatro{grid-template-columns:1fr 1fr}
.ojo-montos{flex:none;width:40px;height:40px;border-radius:13px;border:0;background:var(--sutil);color:var(--soft);display:flex;align-items:center;justify-content:center;margin-left:auto}
.ojo-montos[aria-pressed="true"]{color:var(--acento);background:rgba(124,77,255,.18)}
.ojo-montos+.sync{margin-left:0}
/* Lo de siempre */
.rapidos{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.rapidos button{border:1px solid rgba(124,77,255,.45);background:rgba(124,77,255,.14);color:var(--acento);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px}
.f-rapidos{margin-top:-4px}.f-rapidos button{font-size:17px;padding:11px 15px;border-radius:16px}
/* Comparación con el mes anterior */
.comp{display:flex;flex-direction:column;gap:12px}
.comp p{margin:0;font-size:15px;font-weight:700;color:var(--soft)}
.comp p b.menos{color:var(--teal2)}.comp p b.mas{color:var(--pink)}
.barras{display:flex;align-items:flex-end;gap:10px;height:110px}
.barras div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.barras i{display:block;width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:var(--card3);min-height:4px}
.barras div.actual i{background:var(--grad)}
.barras small{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:capitalize}
.barras div.actual small{color:var(--acento)}
.ver-app{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}.ver-app small{font-size:11.5px;color:var(--muted);font-weight:600}
.ver-nueva{display:flex;flex-direction:column;line-height:1.25}.ver-nueva small{font-size:11.5px;opacity:.85;font-weight:600}
.mini>*{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0;border:0;text-align:left;color:var(--ink)}
.mini span{font-size:11px;font-weight:700;color:var(--muted)}
.mini b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .efe{background:var(--tealbg)}
.mini .efe span{color:var(--tealink)}
.mini .efe small{font-size:11px;font-weight:700;color:var(--tealink)}

.lista{display:flex;flex-direction:column;gap:8px}
.mov{display:flex;align-items:center;gap:12px;background:transparent;border:0;padding:6px 8px;margin:0 -8px;border-radius:16px;text-align:left;color:var(--ink);width:calc(100% + 16px)}
.mov .ico{width:44px;height:44px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}
.mov .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mov .txt b{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .txt small{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .monto{font-weight:800;font-size:15px;white-space:nowrap}
.mov .monto.pos{color:var(--teal2)}
.esperando{font-size:10px;font-weight:800;color:var(--amber);background:rgba(255,181,71,.14);border-radius:6px;padding:1px 5px;margin-left:4px}

/* ---------- Barra ---------- */
nav.barra{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));height:72px;max-width:536px;margin:0 auto;background:var(--card);border-radius:24px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:5}
nav.barra button{border:0;border-radius:16px;background:transparent;width:60px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--dim)}
nav.barra button[aria-current="page"]{color:var(--lilac);font-weight:800}
nav.barra .mas{width:62px;height:62px;border-radius:50%;margin-top:-36px;background:var(--grad);color:#fff;box-shadow:0 10px 26px rgba(176,71,217,.5)}

/* ---------- Ventanas ---------- */
.fondo{position:fixed;inset:0;background:var(--velo);z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:calc(12px + var(--safe-t)) 10px calc(10px + var(--safe-b))}
.vidrio{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--vidrio);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--borde);border-radius:28px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:13px}
@media (prefers-reduced-motion:no-preference){.vidrio{animation:sube .22s ease-out}@keyframes sube{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}}
.v-cab{display:flex;align-items:center;gap:10px}
.v-cab .ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.v-cab b{font-size:19px;font-weight:800;flex:1}
.cerrar{width:40px;height:40px;border-radius:13px;border:0;background:var(--sutil);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.opcion{display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px;border:0;color:#fff;text-align:left;width:100%}
.opcion .oi{width:48px;height:48px;border-radius:15px;background:rgba(14,11,26,.25);display:flex;align-items:center;justify-content:center;flex:none}
.opcion span{display:flex;flex-direction:column;gap:3px;flex:1}
.opcion b{font-size:17px;font-weight:800}
.opcion small{font-size:13px;font-weight:600}
.caja{display:flex;flex-direction:column;gap:6px;background:var(--campo);border-radius:16px;padding:12px 14px}
.caja div{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--soft)}
.caja .t{color:var(--ink);font-size:15px;font-weight:800;align-items:center}
.caja .t b{font-size:20px}
.efe-nota{font-size:12px;font-weight:700;color:var(--tealink);background:rgba(31,77,71,.6);border-radius:12px;padding:8px 12px}
.efe-nota.mal{color:var(--amber);background:rgba(255,181,71,.14)}
.fijo{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--sutil);background:var(--campo2);border-radius:14px;padding:12px;font-size:16px;font-weight:700;color:var(--ink)}

/* Desplegable propio */
.dd{position:relative}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--borde);background:var(--campo);color:var(--ink);border-radius:14px;padding:12px;font-size:16px;font-weight:700;text-align:left}
.dd-lista{margin-top:6px;background:var(--card2);border:1px solid var(--borde);border-radius:16px;padding:6px;display:flex;flex-direction:column;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.dd-lista button{border:0;background:transparent;color:var(--ink);text-align:left;padding:10px;border-radius:10px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.dd-lista button[aria-selected="true"]{background:var(--violet);font-weight:800}
.combo{display:flex;border:1px solid var(--borde);background:var(--campo);border-radius:14px;overflow:hidden}
.combo input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);padding:12px;font-size:16px;font-weight:600}
.combo input:focus{outline:none}
.combo button{width:48px;border:0;border-left:1px solid var(--borde);background:rgba(124,77,255,.35);color:#fff;display:flex;align-items:center;justify-content:center}

.aviso{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + var(--safe-t));background:var(--ink);color:var(--bg2);padding:11px 16px;border-radius:14px;font-weight:800;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* Perfil */
.fila-p{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--sutil);font-size:14px}
.fila-p:first-of-type{border-top:0}
.fila-p span{color:var(--muted);font-weight:600}
.fila-p b{font-weight:800;text-align:right}
.usr{background:var(--card2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.usr .cab{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.usr .cab b{font-size:15px}
.usr .cab small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
.estado{font-size:11px;font-weight:800;border-radius:8px;padding:3px 8px;white-space:nowrap}
.estado.activo{background:var(--tealbg);color:var(--tealink)}
.estado.pendiente{background:rgba(255,181,71,.16);color:var(--amber)}
.estado.desactivado,.estado.bloq{background:rgba(255,107,129,.14);color:var(--errtxt)}
.acc{display:flex;gap:6px;flex-wrap:wrap}
.acc button{border:0;border-radius:12px;padding:9px 12px;font-weight:800;font-size:13px;background:var(--card3);color:var(--ink)}
.acc button.prim{background:var(--violet);color:#fff}

/* ================= Actualización 2 ================= */
/* Sin barras de desplazamiento */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
/* Sin "tirar para recargar" del navegador */
html,body{overscroll-behavior:none}
#contenido,.pantalla,.vidrio{overscroll-behavior:contain}
/* Sin seleccionar texto (y sin búsqueda de Google al mantener apretado) */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

/* Animación al tocar: se hunde, se tiñe de lila suave (nunca gris) y una luz donde está el dedo */
button{position:relative;overflow:hidden;transition:scale .14s ease;-webkit-tap-highlight-color:transparent}
button::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .2s ease;
  background:radial-gradient(circle at var(--x,50%) var(--y,50%),var(--toque1) 0,var(--toque2) 34px,rgba(124,77,255,0) 80px),
             radial-gradient(farthest-side,var(--toque3) 0,var(--toque4) 100%)}
button.toque{scale:.965}
button.toque::after{opacity:1;transition:opacity .04s}
button.toque-fuera::after{opacity:.5;transition:opacity .12s}
button:disabled::after{display:none}
#patronSvg button::after{display:none}

/* Fecha: botón + Hoy / Ayer */
.fecha-fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.fecha-fila .dd-btn{justify-content:flex-start;gap:10px}
.fecha-fila .dd-btn svg{color:var(--lilac);flex:none}
.fecha-fila .dd-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fecha-fila .segm{padding:3px}
.fecha-fila .segm button{flex:none;padding:8px 13px}

/* Calendario propio */
#cal{z-index:20;align-items:center}
.cal{max-width:380px;gap:12px}
.cal-sel{font-size:13px;font-weight:700;color:var(--muted)}
.cal-sel b{display:block;font-size:22px;color:var(--ink);margin-top:2px;font-weight:800}
.cal-cab{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-cab b{font-size:17px;font-weight:800}
.cal-cab button{width:44px;height:44px;border-radius:14px;border:0;background:var(--sutil);color:var(--ink);display:flex;align-items:center;justify-content:center}
.cal-sem,.cal-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-sem span{font-size:12px;font-weight:800;color:var(--muted);padding:4px 0}
.cal-dias button{aspect-ratio:1;border:0;border-radius:12px;background:transparent;color:var(--ink);font-size:15px;font-weight:700;padding:0}
.cal-dias button.hoy{box-shadow:inset 0 0 0 2px var(--violet2);color:var(--lilac)}
.cal-dias button[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:none}
.cal-pie{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cal-pie .btn{padding:12px 8px;font-size:15px}

/* Deslizar para actualizar */
#ptr{position:fixed;left:50%;top:calc(10px + var(--safe-t));transform:translate(-50%,-90px);z-index:8;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;opacity:0}
#ptr .c{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(176,71,217,.5)}
#ptr small{font-size:12px;font-weight:800;background:var(--card2);color:var(--lilac);padding:5px 11px;border-radius:12px;white-space:nowrap}
#ptr.vuelve{transition:transform .25s ease,opacity .25s ease}
#ptr .giro{display:flex}
#ptr.girando .c svg{animation:gira .75s linear infinite}
@keyframes gira{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* Versión nueva */
.novedad{display:flex;align-items:center;gap:10px;background:rgba(124,77,255,.18);border:1px solid rgba(155,107,255,.45);color:var(--lilac);border-radius:16px;padding:10px 14px;font-size:13px;font-weight:700;width:100%;max-width:380px;text-align:left}
.novedad svg{flex:none}
.novedad b{color:var(--ink);font-weight:800}

/* ================= Actualización 3 ================= */
/* Gráficos: anillo, resaltar una categoría */
.arco{transition:opacity .25s ease,stroke-width .25s ease;cursor:pointer}
svg.resaltando .arco{opacity:.22}
svg.resaltando .arco.activo{opacity:1;stroke-width:22}
.cc-grande,.cc-chico{transition:opacity .3s ease}
/* Chips de categoría: grandes, con monto y % */
.leg-it{border:0;background:transparent;color:var(--ink);font:inherit;display:flex;align-items:center;gap:8px;text-align:left;padding:0;min-width:0}
.leg-it i{width:10px;height:10px;border-radius:50%;flex:none}
.leg-it .n{font-weight:700}
.leg-it .m{font-weight:700;color:var(--soft)}
.leg-it b{font-weight:900}
.cats .leg-it,.tarj-cat.abierta .leg-it{background:var(--card2);border-radius:22px;padding:9px 14px;font-size:15px;gap:7px;flex:none;white-space:nowrap;max-width:100%}
.cats .leg-it .n,.tarj-cat.abierta .leg-it .n{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cats .leg-it[aria-pressed="true"],.tarj-cat.abierta .leg-it[aria-pressed="true"]{background:var(--ink);color:var(--bg2)}
.cats .leg-it[aria-pressed="true"] .m,.tarj-cat.abierta .leg-it[aria-pressed="true"] .m{color:var(--card3)}
.cats .leg-it .m::before,.tarj-cat.abierta .leg-it .m::before{content:'· '}
.cats .leg-it b::before,.tarj-cat.abierta .leg-it b::before{content:'· ';font-weight:700}
/* Tarjeta "Por categoría" de Inicio: chica / agrandada */
.tarj-cat{cursor:pointer}
.tarj-cat h2{display:flex;align-items:center;justify-content:space-between}
.tarj-cat .expandir{width:34px;height:34px;border-radius:11px;background:var(--card2);color:var(--lilac);display:flex;align-items:center;justify-content:center;transition:transform .8s ease}
.tarj-cat.abierta .expandir{transform:rotate(180deg)}
.cat-cuerpo{display:flex;align-items:center;gap:16px}
.cat-graf{flex:none;display:flex;justify-content:center}
.cat-graf svg{width:118px;height:118px;display:block}
.cat-ley{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;font-size:13px}
.tarj-cat:not(.abierta) .leg-it{width:100%}
.tarj-cat:not(.abierta) .leg-it .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tarj-cat:not(.abierta) .leg-it .m{display:none}
.tarj-cat .arco,.tarj-cat .base{stroke-width:28;transition:stroke-width .8s ease,opacity .25s ease}
.tarj-cat.abierta .cat-cuerpo{flex-direction:column;gap:16px}
.tarj-cat.abierta .cat-graf svg{width:220px;height:220px}
.tarj-cat.abierta .cat-ley{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px}
.tarj-cat.abierta .arco,.tarj-cat.abierta .base{stroke-width:15}
.tarj-cat.abierta svg.resaltando .arco.activo{stroke-width:22}
.tarj-cat:not(.abierta) .cc-grande{opacity:0}
.tarj-cat.abierta .cc-chico{opacity:0}
.tarj-cat.animando{transition:height .8s cubic-bezier(.33,.9,.3,1);overflow:hidden}
.tarj-cat.animando .cat-graf svg{transition:transform .8s cubic-bezier(.33,.9,.3,1)}
.tarj-cat.animando .leg-it{transition:transform .8s cubic-bezier(.33,.9,.3,1),opacity .55s ease .2s}
.ayuda-toca{font-size:12px;font-weight:700;color:var(--muted);text-align:center;margin-top:10px}
.tarj-cat.abierta .ayuda-toca{margin-top:14px}
/* Tarjetas tipo acordeón al llegar arriba o abajo */
.vista>*{will-change:auto}
.vista.estirando>*{transition:none!important}
.vista.volviendo>*{transition:transform .5s cubic-bezier(.25,1.45,.45,1)}
/* Interruptor (letra grande) */
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:var(--card);border-radius:22px;padding:16px;color:var(--ink);text-align:left}
.interruptor span{display:flex;flex-direction:column;gap:3px}
.interruptor b{font-size:16px;font-weight:800}
.interruptor small{font-size:12px;font-weight:600;color:var(--muted)}
.switch{width:52px;height:30px;border-radius:15px;background:var(--card3);position:relative;flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.interruptor[aria-checked="true"] .switch{background:var(--violet)}
.interruptor[aria-checked="true"] .switch::after{transform:translateX(22px)}
/* Letra grande: agranda todo un 15% */
.vista,.vidrio,.login-box,#patron>*{zoom:var(--zoom,1)}
nav.barra{zoom:var(--zoomnav,1)}
/* Apariencia */
.ap-ejemplo{background:var(--campo);border:1px solid var(--borde);border-radius:16px;padding:12px 14px}
.ap-ejemplo small{font-size:12px;font-weight:700;color:var(--muted)}
.ap-ejemplo p{margin:6px 0 0;font-size:17px;font-weight:600;line-height:1.45;color:var(--ink)}
.ap-tam{display:flex;align-items:center;gap:12px;background:var(--campo);border:1px solid var(--borde);border-radius:16px;padding:8px 14px}
.ap-tam .a1{font-size:14px;font-weight:800;color:var(--muted)}
.ap-tam .a2{font-size:26px;font-weight:800;color:var(--muted)}
.ap-tam input{flex:1;accent-color:var(--violet);height:34px;margin:0}
.ap-fuentes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ap-fuentes button{border:2px solid var(--borde);background:var(--campo);color:var(--ink);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
.ap-fuentes button b{font-size:24px;font-weight:700;line-height:1.1}
.ap-fuentes button small{font-size:12px;color:var(--muted);font-family:var(--font)}
.ap-fuentes button[aria-pressed="true"]{border-color:var(--violet);background:rgba(124,77,255,.16)}
.campo>b{color:var(--acento)}

/* ================= Actualización 4 ================= */
/* Mes tocable (Personal / Negocio) y calendario con meses y años */
.per-btn{border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:800;padding:9px 12px;border-radius:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.per-btn svg{color:var(--lilac)}
.nav-per .per-btn{width:auto;height:44px;background:transparent;padding:0 12px}
.cal-tit{border:0;background:var(--sutil);color:var(--ink);font-size:17px;font-weight:800;padding:9px 14px;border-radius:12px;display:flex;align-items:center;gap:6px}
.cal-tit svg{color:var(--lilac)}
.cal-cab .cal-tit{width:auto;height:44px;white-space:nowrap}
.cal-grilla{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cal-grilla button{border:0;border-radius:14px;background:var(--sutil);color:var(--ink);font-size:16px;font-weight:800;padding:16px 0}
.cal-grilla button.hoy{box-shadow:inset 0 0 0 2px var(--violet2);color:var(--lilac)}
.cal-grilla button[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:none}
/* Avatar tocable */
button.avatar{border:0;padding:0}
/* Últimos gastos: Consultar todos */
.h2-link{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ver-todos{border:0;background:transparent;color:var(--lilac);font-size:14px;font-weight:800;padding:6px 8px;border-radius:10px;display:flex;align-items:center;gap:2px}
/* Pantalla "Todos los movimientos" */
.titulo-todos{display:flex;align-items:center;gap:10px}
.titulo-todos h1{margin:0;font-size:22px;font-weight:900}
.volver{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.buscar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--borde);border-radius:16px;padding:0 14px;color:var(--muted)}
.buscar input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:600;padding:13px 0}
.buscar input:focus{outline:none}
.buscar:focus-within{border-color:var(--violet2);box-shadow:0 0 0 3px rgba(124,77,255,.3)}
.filtro-tipo{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filtro-tipo button{flex:none;border:1px solid var(--borde);border-radius:20px;padding:8px 13px;background:transparent;color:var(--soft);font-weight:700;font-size:13px}
.filtro-tipo button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:800}
.fecha-grupo{margin:0 0 6px;font-size:15px;font-weight:800;color:var(--soft)}
/* Detalle de un gasto */
.det-cab{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:4px 0 6px}
.det-cab span{font-size:16px;font-weight:700;color:var(--soft)}
.det-cab b{font-size:34px;font-weight:900;letter-spacing:-.5px}
.det-cab b.pos{color:var(--teal2)}
.det-filas{background:var(--campo);border-radius:18px;padding:4px 14px}
.det-filas .fila-p b{max-width:60%;overflow-wrap:anywhere}

/* ================= Actualización 5: ayudante ================= */
.robot{position:fixed;right:14px;bottom:var(--rb,calc(98px + var(--safe-b)));z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(176,71,217,.5),0 0 0 3px rgba(14,11,26,.9)}
@media (prefers-reduced-motion:no-preference){.robot{animation:saluda 2.4s ease-in-out 1s 2}@keyframes saluda{0%,100%{translate:0 0}20%{translate:0 -6px}40%{translate:0 0}}}
/* Anillo de luz que gira alrededor del ícono 🤖 */
.robot::before{content:'';position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,rgba(201,184,255,0) 0deg,rgba(201,184,255,0) 150deg,#C9B8FF 230deg,#E040A0 300deg,rgba(224,64,160,0) 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4.5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 4.5px),#000 calc(100% - 4px));filter:drop-shadow(0 0 5px rgba(224,64,160,.8));pointer-events:none}
#robot.robot{overflow:visible}
@media (prefers-reduced-motion:no-preference){.robot::before{animation:gira 2.4s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}}
.robot-globo{position:fixed;right:84px;bottom:calc(var(--rb,calc(98px + var(--safe-b))) + 4px);z-index:6;max-width:min(250px,calc(100vw - 110px));background:var(--globo);color:var(--sobre);border-radius:18px 18px 4px 18px;padding:11px 14px;font-size:calc(15px * var(--zoom,1));font-weight:700;line-height:1.35;box-shadow:0 12px 30px rgba(0,0,0,.45);cursor:pointer}
.robot-globo::after{content:'';position:absolute;right:-7px;bottom:10px;border:8px solid transparent;border-left-color:var(--globo);border-right:0}

@media (prefers-reduced-motion:no-preference){.robot-globo{animation:globoEntra .35s cubic-bezier(.2,1.3,.4,1)}@keyframes globoEntra{from{transform:translateX(16px) scale(.85);opacity:0}}.robot-globo.chau{transition:opacity .3s,transform .3s;opacity:0;transform:translateX(12px)}}
/* Charla con la IA */
.vidrio>:not(.ia-msgs){flex-shrink:0}
.vidrio.chat{height:100%;max-height:100%;overflow:hidden;padding-bottom:12px;background:var(--chatbg)}
.ia-msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px 2px 6px;overscroll-behavior:contain}
.ia-b{max-width:86%;padding:11px 14px;border-radius:18px;font-size:16px;line-height:1.45;word-wrap:break-word}
.ia-b.ia{align-self:flex-start;background:var(--card3);color:var(--ink);border-bottom-left-radius:6px}
.ia-b.yo{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px;font-weight:600}
.ia-b.error{background:rgba(255,92,122,.16);color:var(--errtxt)}
.ia-b.ia b{color:var(--ink)}
.ia-ver{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;padding:11px 12px;border:0;border-radius:14px;background:var(--grad);color:#fff;font-weight:800;font-size:15px}
.ia-carga{margin-top:10px;background:var(--campo);border:1px solid var(--borde);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.ia-carga.ok{border-color:var(--teal2)}
.ia-carga.mal{color:var(--errtxt);font-weight:700;font-size:14px}
.ia-carga-tit{font-weight:900;font-size:15px;margin-bottom:4px}
.ia-carga .fila-p{font-size:13.5px;padding:7px 0}
.ia-carga-av{margin-top:6px;font-size:13px;font-weight:700;color:var(--amber)}
.ia-carga-listo{margin-top:8px;font-weight:900;color:var(--teal2);text-align:center}
.ia-carga-bot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ia-carga-bot .ia-ver{margin:0}.ia-carga-bot .btn{padding:11px;font-size:15px}
.ia-ver:disabled{opacity:.45}
.ia-sug{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.ia-sug button{border:1px solid rgba(201,184,255,.35);background:rgba(124,77,255,.14);color:var(--lilac);border-radius:16px;padding:9px 13px;font-size:15px;font-weight:700;text-align:left}
.escribiendo{display:flex;gap:5px;padding:15px 16px}
.escribiendo i{width:8px;height:8px;border-radius:50%;background:var(--lilac);opacity:.4}
@media (prefers-reduced-motion:no-preference){.escribiendo i{animation:punto 1.1s infinite}.escribiendo i:nth-child(2){animation-delay:.18s}.escribiendo i:nth-child(3){animation-delay:.36s}@keyframes punto{30%{opacity:1;transform:translateY(-4px)}}}
.ia-escribir{display:flex;align-items:flex-end;gap:8px}
.ia-escribir textarea{flex:1;resize:none;min-height:50px;max-height:120px;border:1px solid var(--borde);background:var(--campo);color:var(--ink);border-radius:18px;padding:13px 14px;font:inherit;font-size:16px;line-height:1.4}
.ia-escribir textarea:focus{outline:none;border-color:var(--violet2);box-shadow:0 0 0 3px rgba(124,77,255,.3)}
.ia-foto{flex:none;width:50px;height:50px;border-radius:50%;border:1px solid var(--borde,var(--borde));background:var(--card2);color:var(--lilac);display:flex;align-items:center;justify-content:center}
.ia-adj{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:16px;padding:8px}
.ia-adj img{width:54px;height:54px;object-fit:cover;border-radius:10px;flex:none}
.ia-adj span{flex:1;font-size:13px;font-weight:700;color:var(--soft)}
.ia-img{display:block;max-width:100%;max-height:220px;border-radius:12px;margin-bottom:6px}
.ia-enviar{flex:none;width:50px;height:50px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center}
.ia-enviar:disabled{opacity:.45}
#guia{position:fixed;inset:0;z-index:25;pointer-events:none}
.guia-luz{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(8,6,16,.66);transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease;pointer-events:none}
.guia-luz::after{content:'';position:absolute;inset:-4px;border-radius:22px;border:3px solid var(--lilac)}
@media (prefers-reduced-motion:no-preference){.guia-luz::after{animation:latido 1.4s ease-in-out infinite}@keyframes latido{50%{inset:-9px;opacity:.35}}}
.guia-globo{position:fixed;pointer-events:auto;width:min(330px,calc(100vw - 24px));background:var(--globo);color:var(--sobre);border-radius:20px;padding:12px 14px 12px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px;transition:left .25s ease,top .25s ease}
.guia-globo::before{content:'';position:absolute;left:var(--ax,50%);width:16px;height:16px;background:var(--globo);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.guia-globo.abajo::before{top:-6px}
.guia-globo.arriba::before{bottom:-6px}
.guia-globo.centro::before{display:none}
.guia-top{display:flex;align-items:center;gap:8px}
.guia-top .guia-cara{width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.guia-top small{flex:1;font-size:12px;font-weight:800;color:#6A5F92}
.guia-x{width:34px;height:34px;border-radius:11px;border:0;background:#E4DDFA;color:#1A1530;display:flex;align-items:center;justify-content:center}

<script>
'use strict';
/* =========================================================
   Estado
   ========================================================= */
const API = window.BILLETERA_API || '';
// Fecha y hora de esta versión (se muestra una vez cuando alguien abre la app actualizada)
// Versión: MAYOR.MENOR.ARREGLO (arreglo → sube el último; algo nuevo → el del medio; cambio enorme → el primero)
const APP_SERIE = '1.10.0', APP_FECHA = '2026-10-31';
const APP_VERSION = APP_SERIE;
const COLORES = ['#9B6BFF', '#F05BB5', '#3FD6C6', '#FFB547', '#6FA8FF', '#FF8A5B', '#B5E36B', '#D7C8FF'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const LISTAS_BASE = {
  'Negocios': ['AEM - DigyStore', 'BazarFreddy', 'RinaMultiventas', 'FernandoDeals'],
  'Categorías personales': ['Casa (luz, gas, agua)', 'Comida', 'Salud', 'Transporte', 'Ropa', 'Educación', 'Salidas', 'Otros'],
  'Categorías no reversibles': ['Insumos', 'Sueldo', 'Interés/Gastos', 'Otros'],
  'Descripciones rápidas': ['Colectivo ida y vuelta', 'Chalana ida', 'Chalana vuelta', 'Pasero', 'Comida/bebidas', 'Baño', 'Bodega/baúl colectivo'],
  'Categorías gastos generales': ['Mercado Envíos FULL', 'Correo y envíos', 'Publicidad', 'Contadora', 'Monotributo / IIBB', 'Sueldo', 'Insumos (embalaje)', 'Otros']
};
const S = {
  token: '', yo: null, listas: LISTAS_BASE, personal: [], negocio: [], pendientes: 0, ultimaSync: 0,
  cola: [], vista: 'inicio', per: { tipo: 'mes', ref: hoy() }, viaje: '', filtro: '',
  sincronizando: false, form: null, rech: [], catAbierta: false, firmas: {}, resaltes: {}
};
const $ = id => document.getElementById(id);
const pesos = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 2 });
const fmtReal = n => pesos.format(Math.round((Number(n) || 0) * 100) / 100);
// Ojito: con los montos ocultos se ven "$ •••••", salvo mientras cargás o corregís algo
let OCULTO = false;
try { OCULTO = JSON.parse(localStorage.getItem('bd_ocultar') || 'false') === true; } catch (e) {}
const fmt = n => OCULTO && !(typeof S !== 'undefined' && (S.vista === 'flujo' || S.form)) ? '$ •••••' : fmtReal(n);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Guardado en el celular ---------- */
const LS = {
  get(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const kEstado = () => 'bd_estado_' + (S.yo ? S.yo.usuario : '');
const kCola = () => 'bd_cola_' + (S.yo ? S.yo.usuario : '');
const kRech = () => 'bd_rech_' + (S.yo ? S.yo.usuario : '');
function guardarEstado() {
  LS.set(kEstado(), { yo: S.yo, listas: S.listas, personal: S.personal, negocio: S.negocio, pendientes: S.pendientes, ultimaSync: S.ultimaSync });
}
function guardarCola() { LS.set(kCola(), S.cola); }
// Modo simple / completo: lo pendiente de subir manda; después lo de Google; si no, lo guardado en el celular
const kModoPend = () => 'bd_modo_pend_' + (S.yo ? S.yo.usuario : '');
const kModo = () => 'bd_modo_' + (S.yo ? S.yo.usuario : '');
function modoActual() { return S.yo ? (LS.get(kModoPend(), '') || S.yo.modo || LS.get(kModo(), '')) : ''; }
const esSimple = () => modoActual() === 'simple';
function aplicarModo() { document.body.classList.toggle('simple', esSimple()); if (typeof pintarRobot === 'function') pintarRobot(); }
function setModo(m) {
  LS.set(kModoPend(), m); LS.set(kModo(), m);
  if (S.yo) S.yo.modo = m;
  guardarEstado(); aplicarModo();
  S.flujo = null; irA('inicio'); sincronizar();
}
function guardarRech() { LS.set(kRech(), S.rech); }
const rechDe = id => S.rech.find(z => z.op.id === id);

/* ---------- Fechas ---------- */
function hoy() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function aFecha(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function aISO(d) { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); }
function fCorta(s) { const d = aFecha(s); return d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3); }
function ayer() { const d = aFecha(hoy()); d.setDate(d.getDate() - 1); return aISO(d); }
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
function fLarga(s) {
  if (!s) return 'Elegí la fecha';
  const d = aFecha(s), base = d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3) + ' ' + d.getFullYear();
  return s === hoy() ? 'Hoy · ' + base : s === ayer() ? 'Ayer · ' + base : base;
}
function rango(p) {
  const d = aFecha(p.ref);
  if (p.tipo === 'dia') return [p.ref, p.ref];
  if (p.tipo === 'semana') {
    const dia = (d.getDay() + 6) % 7;
    const ini = new Date(d); ini.setDate(d.getDate() - dia);
    const fin = new Date(ini); fin.setDate(ini.getDate() + 6);
    return [aISO(ini), aISO(fin)];
  }
  return [aISO(new Date(d.getFullYear(), d.getMonth(), 1)), aISO(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
}
function etiquetaPer(p) {
  const d = aFecha(p.ref);
  if (p.tipo === 'dia') return d.getDate() + ' de ' + MESES[d.getMonth()] + ' ' + d.getFullYear();
  if (p.tipo === 'semana') { const [a, b] = rango(p); return fCorta(a) + ' – ' + fCorta(b); }
  const m = MESES[d.getMonth()]; return m[0].toUpperCase() + m.slice(1) + ' ' + d.getFullYear();
}
function moverPer(p, paso) {
  const d = aFecha(p.ref);
  if (p.tipo === 'dia') d.setDate(d.getDate() + paso);
  else if (p.tipo === 'semana') d.setDate(d.getDate() + 7 * paso);
  else { d.setDate(1); d.setMonth(d.getMonth() + paso); }
  return { tipo: p.tipo, ref: aISO(d) };
}

/* ---------- Números ---------- */
function num(txt) {
  let s = String(txt == null ? '' : txt).replace(/[$\s%]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g, '');
  return Number(s);
}
const r2 = n => Math.round(n * 100) / 100;

   ========================================================= */
async function api(datos) {
  if (!API || API.indexOf('http') !== 0) throw Object.assign(new Error('Falta pegar el link de Apps Script en config.js.'), { config: true });
  let r;
  try {
    r = await fetch(API, { method: 'POST', body: JSON.stringify(datos) });
  } catch (e) { throw Object.assign(new Error('Sin conexión.'), { red: true }); }
  let j;
  try { j = await r.json(); } catch (e) { throw Object.assign(new Error('Sin conexión.'), { red: true }); }
  if (!j.ok) throw Object.assign(new Error(j.error || 'Algo salió mal.'), { sesionVencida: !!j.sesionVencida });
  return j;
}

/* =========================================================
   Cálculos (iguales a los del cerebro, para ver todo al instante sin internet)
   ========================================================= */
function calcNegocio(d, previo) {
  const f = Object.assign({}, previo || {}, {
    id: d.id, fecha: d.fecha, viaje: d.viaje || '', tipo: d.tipo, negocio: d.negocio, usuario: d.usuario,
    categoria: '', descripcion: '', unidades: '', costoUnit: '', monto: 0, pago: '', pctRecargo: '', recargo: 0,
    pctCambio: '', comision: 0, recibido: 0, gastoReal: 0, movEfectivo: 0
  });
  if (d.tipo === 'Inversión') {
    f.categoria = 'Productos'; f.descripcion = d.descripcion; f.unidades = d.unidades; f.monto = d.monto;
    f.costoUnit = r2(d.monto / d.unidades); f.pago = d.pago;
    if (d.pago === 'Transferencia' && d.pctRecargo !== '') { f.pctRecargo = d.pctRecargo; f.recargo = r2(d.monto * d.pctRecargo / 100); }
    f.gastoReal = d.monto; f.movEfectivo = d.pago === 'Efectivo' ? -d.monto : 0;
  } else if (d.tipo === 'No reversible') {
    f.categoria = d.categoria; f.descripcion = d.descripcion; f.monto = d.monto; f.pago = d.pago;
    f.gastoReal = d.monto; f.movEfectivo = d.pago === 'Efectivo' ? -d.monto : 0;
  } else if (d.tipo === 'Cambio') {
    f.categoria = 'Interés/Gastos'; f.descripcion = (d.nota || '').trim() || 'Cambio a efectivo'; f.monto = d.monto; f.pago = 'Transferencia';
    if (d.recibido !== undefined && d.recibido !== '') { f.recibido = d.recibido; f.comision = r2(d.monto - d.recibido); f.pctCambio = r2(f.comision / d.monto * 100); f.movEfectivo = f.recibido; }
    else {
      f.pctCambio = d.pctCambio; f.comision = r2(d.monto * d.pctCambio / 100);
      // Comisión en efectivo: te dan todo y pagás la comisión con billetes que ya tenías. El efectivo neto queda igual.
      if (d.pagoComision === 'Efectivo') { f.pago = 'Efectivo'; f.recibido = d.monto; f.movEfectivo = r2(d.monto - f.comision); }
      else { f.recibido = r2(d.monto - f.comision); f.movEfectivo = f.recibido; }
    }
    f.gastoReal = f.comision;
  } else if (d.tipo === 'Gasto general') {
    f.viaje = ''; f.categoria = d.categoria; f.descripcion = d.descripcion || ''; f.monto = d.monto; f.pago = d.pago;
    f.gastoReal = d.monto; f.movEfectivo = d.pago === 'Efectivo' ? -d.monto : 0;
  } else if (d.tipo === 'Devolución') {
    f.categoria = 'Devolución'; f.descripcion = (d.nota || '').trim() || 'Devolución al negocio';
    f.monto = d.monto; f.pago = d.pago === 'Transferencia' ? 'Transferencia' : 'Efectivo'; f.movEfectivo = f.pago === 'Efectivo' ? d.monto : 0;
  } else if (d.tipo === 'Ajuste') {
    f.categoria = 'Ajuste de efectivo'; f.descripcion = d.inicial ? 'Efectivo inicial' : 'Ajuste de efectivo';
    f.monto = d.monto; f.pago = 'Efectivo'; f.movEfectivo = r2(d.monto - efectivoDe(d.negocio, d.id));
  }
  return f;
}
function efectivoDe(negocio, sinId) {
  return r2(S.negocio.filter(f => f.negocio === negocio && f.id !== sinId).reduce((s, f) => s + (Number(f.movEfectivo) || 0), 0));
}
// Gasto que cuenta para totales y gráficos de una fila de Negocio
function partesNegocio(f) {
  const out = [];
  if (f.tipo === 'Inversión') { out.push(['Productos', Number(f.monto) || 0, 'rec']); if (Number(f.recargo)) out.push(['Interés/Gastos', Number(f.recargo), 'no']); }
  else if (f.tipo === 'No reversible') out.push([f.categoria, Number(f.gastoReal) || 0, 'no']);
  else if (f.tipo === 'Gasto general') out.push([f.categoria, Number(f.gastoReal) || 0, 'gen']);
  else if (f.tipo === 'Cambio') out.push(['Interés/Gastos', Number(f.comision) || 0, 'no']);
  return out;
}
// Lo que se debe al negocio: gastos personales "a devolver" menos lo ya devuelto
function deudaDe(neg) {
  const usado = S.personal.filter(f => f.negocio === neg && f.devolver === 'sí').reduce((s, f) => s + (Number(f.monto) || 0), 0);
  const devuelto = S.negocio.filter(f => f.negocio === neg && f.tipo === 'Devolución').reduce((s, f) => s + (Number(f.monto) || 0), 0);
  return r2(Math.max(0, usado - devuelto));
}
const totalNegocio = f => partesNegocio(f).reduce((s, p) => s + p[1], 0);

/* =========================================================
   Cola de cambios (funciona sin internet)
   ========================================================= */
function nuevoId() { return (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).slice(0, 14); }

function encolar(op) {
  op.opId = nuevoId();
  if (rechDe(op.id)) { S.rech = S.rech.filter(z => z.op.id !== op.id); guardarRech(); }
  S.cola.push(op); guardarCola();
  aplicarLocal(op); guardarEstado();
  render();
  sincronizar();
}
function aplicarLocal(op) {
  const lista = op.hoja === 'negocio' ? S.negocio : S.personal;
  const i = lista.findIndex(f => f.id === op.id);
  if (op.tipo === 'borrar') { if (i >= 0) lista.splice(i, 1); return; }
  const previo = i >= 0 ? lista[i] : null;
  const base = { id: op.id, usuario: previo ? previo.usuario : S.yo.usuario,
    negocio: previo ? previo.negocio : (op.datos.negocio || S.yo.negocio), cargado: previo ? previo.cargado : new Date().toISOString() };
  let fila;
  if (op.hoja === 'negocio') fila = calcNegocio(Object.assign({}, op.datos, base), previo);
  else fila = Object.assign({}, previo || {}, op.datos, base);
  if (i >= 0) lista[i] = fila; else lista.push(fila);
}
const enCola = id => S.cola.some(o => o.id === id);

let timerSync = null;
async function sincronizar() {
  if (!S.token || S.sincronizando) return false;
  if (!navigator.onLine) { pintarSync(); return false; }
  S.sincronizando = true; pintarSync();
  const enviadas = S.cola.slice();
  let bien = false;
  try {
    const modoPend = LS.get(kModoPend(), '');
    const modoAntes = modoActual();
    const r = await api({ accion: 'sync', token: S.token, ops: enviadas, modo: modoPend || undefined });
    if (modoPend && r.yo && r.yo.modo === modoPend) LS.del(kModoPend()); // queda pendiente hasta que Google lo guarde
    if (r.yo && r.yo.modo) LS.set(kModo(), r.yo.modo);
    const procesadas = new Set((r.resultados || []).map(x => x.opId));
    const fallas = (r.resultados || []).filter(x => !x.ok);
    S.cola = S.cola.filter(o => !procesadas.has(o.opId)); guardarCola();
    // Lo que Google rechazó NO se pierde: queda en el celular, marcado en rojo, para corregirlo o borrarlo.
    let rechazados = 0;
    fallas.forEach(x => {
      const op = enviadas.find(o => o.opId === x.opId);
      if (!op || op.tipo !== 'guardar') return;
      S.rech = S.rech.filter(z => z.op.id !== op.id);
      S.rech.push({ op, error: x.error || 'Algo salió mal.' });
      rechazados++;
    });
    guardarRech();
    S.yo = r.yo; S.listas = Object.assign({}, LISTAS_BASE, r.listas); S.personal = r.personal; S.negocio = r.negocio;
    S.pendientes = r.pendientes || 0; S.ultimaSync = Date.now();
    if (modoActual() !== modoAntes) { aplicarModo(); if (!$('app').hidden) { S.flujo = null; S.vista = 'inicio'; } }
    S.rech.forEach(z => aplicarLocal(z.op));
    S.cola.forEach(aplicarLocal);
    guardarEstado();
    if (rechazados) avisar(rechazados === 1 ? 'Un gasto no se pudo subir: quedó marcado en rojo para corregirlo.' : rechazados + ' gastos no se pudieron subir: quedaron marcados en rojo.');
    bien = true;
  } catch (e) {
    if (e.sesionVencida) { cerrarSesionLocal(e.message); }
    else if (e.config) avisar(e.message);
  } finally {
    S.sincronizando = false;
    if (S.token) { render(); }
  }
  // Si se cargó algo mientras subía, se sube enseguida; si algo falló, se reintenta en 15 segundos
  if (S.cola.length && navigator.onLine) { clearTimeout(timerSync); timerSync = setTimeout(sincronizar, S.cola.some(o => !enviadas.includes(o)) ? 300 : 15000); }
  return bien;
}
window.addEventListener('online', () => sincronizar());
window.addEventListener('offline', () => pintarSync());

/* ---------- Patrón ---------- */
const PUNTOS = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => ({ x: 50 + (i % 3) * 100, y: 50 + Math.floor(i / 3) * 100 }));
const P = { modo: '', primero: '', fallos: 0, trazo: [], dibujando: false, pos: null };
async function sha(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function iniciarPatron(modo) {
  P.modo = modo; P.primero = ''; P.fallos = 0; P.trazo = [];
  mostrar('patron');
  $('patAvatar').textContent = iniciales(S.yo && S.yo.nombre);
  $('patOlvide').hidden = modo !== 'abrir';
  textoPatron();
  pintarPatron();
}
function textoPatron(extra) {
  const t = { crear: ['Creá tu patrón', 'Uní al menos 4 puntos. Lo vas a usar cada vez que abras la app.'],
    confirmar: ['Repetí el patrón', 'Dibujalo de nuevo para confirmar.'],
    abrir: ['Dibujá tu patrón', 'Hola, ' + primerNombre(S.yo && S.yo.nombre) + '.'] }[P.modo];
  $('patTitulo').textContent = t[0];
  $('patAyuda').textContent = extra || t[1];
}
function pintarPatron(error) {
  const svg = $('patronSvg');
  const col = error ? 'var(--red)' : 'var(--c3)';
  let h = '';
  if (P.trazo.length) {
    const pts = P.trazo.map(i => PUNTOS[i].x + ',' + PUNTOS[i].y);
    if (P.dibujando && P.pos) pts.push(P.pos.x + ',' + P.pos.y);
    h += `<polyline points="${pts.join(' ')}" fill="none" style="stroke:${col}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
  }
  PUNTOS.forEach((p, i) => {
    const on = P.trazo.includes(i);
    h += `<circle cx="${p.x}" cy="${p.y}" r="30" fill="${on ? 'rgba(124,77,255,.25)' : 'transparent'}"/>`;
    h += `<circle cx="${p.x}" cy="${p.y}" r="${on ? 13 : 9}" style="fill:${on ? col : 'var(--patpunto)'}"/>`;
  });
  svg.innerHTML = h;
  svg.classList.toggle('puntos-error', !!error);
}
function posPatron(ev) {
  const r = $('patronSvg').getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * 300, y: (ev.clientY - r.top) / r.height * 300 };
}
function tocarPunto(pos) {
  PUNTOS.forEach((p, i) => {
    if (!P.trazo.includes(i) && Math.hypot(p.x - pos.x, p.y - pos.y) < 34) P.trazo.push(i);
  });
}
$('patronSvg').addEventListener('pointerdown', ev => {
  ev.preventDefault(); $('patronSvg').setPointerCapture(ev.pointerId);
  P.dibujando = true; P.trazo = []; P.pos = posPatron(ev); tocarPunto(P.pos); pintarPatron();
});
$('patronSvg').addEventListener('pointermove', ev => {
  if (!P.dibujando) return; P.pos = posPatron(ev); tocarPunto(P.pos); pintarPatron();
});
const finPatron = async () => {
  if (!P.dibujando) return;
  P.dibujando = false; P.pos = null;
  const codigo = P.trazo.join('');
  if (P.trazo.length < 4) { textoPatron('Uní al menos 4 puntos.'); pintarPatron(true); return setTimeout(() => { P.trazo = []; pintarPatron(); }, 700); }
  const clave = 'bd_patron_' + S.yo.usuario;
  if (P.modo === 'crear') { P.primero = codigo; P.modo = 'confirmar'; P.trazo = []; textoPatron(); pintarPatron(); return; }
  if (P.modo === 'confirmar') {
    if (codigo !== P.primero) { P.modo = 'crear'; textoPatron('No coincidieron. Empezá de nuevo.'); pintarPatron(true); return setTimeout(() => { P.trazo = []; pintarPatron(); }, 700); }
    LS.set(clave, await sha(S.yo.usuario + ':' + codigo));
    return bienvenida();
  }

    <span class="ico" style="color:${col}">${svg(icoDe(f, hojaN), 21)}</span>
    <span class="txt"><b>${esc(titulo)}${pend}</b><small>${fCorta(f.fecha)} · ${esc(detalle)}${esc(quien)}</small></span>
    <span class="monto${pos ? ' pos' : ''}">${monto}</span></button>`;
}
const notaCambio = f => (f.descripcion && f.descripcion !== 'Cambio a efectivo') ? f.descripcion : '';
const ordenar = l => [...l].sort((a, b) => (b.fecha + (b.cargado || '')).localeCompare(a.fecha + (a.cargado || '')));

/* ---------- Inicio ---------- */
function vInicio() {
  const mes = rango({ tipo: 'mes', ref: hoy() });
  const per = datosFiltrados(S.personal).filter(f => enRango(f, mes));
  const neg = datosFiltrados(S.negocio).filter(f => enRango(f, mes));
  const tPer = per.reduce((s, f) => s + (Number(f.monto) || 0), 0);
  const tNeg = neg.reduce((s, f) => s + totalNegocio(f), 0);
  const items = topN(agrupar([...per.map(f => [f.categoria, Number(f.monto) || 0]), ...neg.flatMap(partesNegocio).map(p => [p[0], p[1]])]), 5);
  const total = tPer + tNeg;
  const ultimos = ordenar([...per.map(f => [f, false]), ...neg.map(f => [f, true])].map(x => Object.assign({ _n: x[1] }, x[0]))).slice(0, 5);
  const etiquetaNeg = S.yo.admin ? (S.filtro || 'Todos los negocios') : S.yo.negocio;
  return `
  <div class="cabecera">
    <button type="button" class="avatar" data-ir2="perfil" aria-label="Ir a mi perfil">${esc(iniciales(S.yo.nombre))}</button>
    <div class="saludo"><small>Hola,</small><b>${esc(S.yo.nombre)}</b></div>
    <button type="button" class="ojo-montos" data-acc="ocultarMontos" aria-label="${OCULTO ? 'Mostrar los montos' : 'Ocultar los montos'}" aria-pressed="${OCULTO}">${svg(OCULTO ? 'ojoNo' : 'ojo', 20, 2)}</button>
    ${chipSync()}
  </div>
  ${filtroNegocios()}
  <section class="hero">
    <div class="fila"><span class="etq">Gastado en ${MESES[aFecha(hoy()).getMonth()]}</span><span class="pill">${esc(etiquetaNeg)}</span></div>
    <span class="total">${fmt(total)}</span>
    <div class="sub"><div><span>Compras y negocio</span><b>${fmt(tNeg)}</b></div><div><span>Gasto personal</span><b>${fmt(tPer)}</b></div></div>
  </section>
  ${tarjetasDeuda()}
  ${tarjComparacion()}
  ${total ? `<section class="tarj tarj-cat${S.catAbierta ? ' abierta' : ''}" id="tarjCat" aria-label="Por categoría. Tocá para ${S.catAbierta ? 'achicar' : 'agrandar'}">
    <h2>Por categoría <span class="expandir" aria-hidden="true">${svg('expandir', 20, 2.6)}</span></h2>
    <div class="cat-cuerpo">
      <div class="cat-graf">${anillo('inicio', items, total, { tam: 220, grosor: 15, grosorMax: 28, arriba: etiquetaPer({ tipo: 'mes', ref: hoy() }), valor: fmt(total), contar: total, abajo: movs(per.length + neg.length), chico: ['Este mes', items.length + ' categ.'] })}</div>
      <div class="cat-ley">${items.map((it, i) => legIt('inicio', it, i, total)).join('')}</div>
    </div>
    <div class="ayuda-toca">${S.catAbierta ? 'Tocá un color para ver su monto · Tocá la tarjeta para achicar' : 'Tocá para agrandar'}</div>
  </section>` : `<section class="tarj"><h2>Por categoría</h2><div class="vacio">Todavía no hay gastos este mes.<br>Tocá el <b>+</b> para cargar el primero.</div></section>`}
  <section class="tarj">
    <h2 class="h2-link">Últimos gastos ${ultimos.length ? `<button type="button" class="ver-todos" data-ir2="todos">Consultar todos ${svg('der', 16, 2.6)}</button>` : ''}</h2>
    <div class="lista">${ultimos.length ? ultimos.map(f => filaMov(f, f._n)).join('') : '<div class="vacio">Acá vas a ver lo último que se cargó.</div>'}</div>
  </section>`;
}

function tarjetasDeuda() {
  const negs = S.yo.admin ? (S.filtro ? [S.filtro] : (S.listas['Negocios'] || [])) : [S.yo.negocio];
  return negs.map(n => [n, deudaDe(n)]).filter(x => x[1] > 0).map(([n, d]) => `<div class="deuda"><span><small>${S.yo.admin && n !== S.yo.negocio ? esc(n) + ' le debe al negocio' : 'Le debés al negocio'}</small><b>${fmt(d)}</b></span><button type="button" data-devolver="${esc(n)}">Devolver</button></div>`).join('');
}
function formDevolucion(neg, fila, pre) {
  const deuda = deudaDe(neg) + (fila ? Number(fila.monto) || 0 : 0);
  S.form = { hoja: 'devolucion', id: fila ? fila.id : nuevoId(), editando: !!fila, negocio: neg, monto: fila ? String(fila.monto) : String(deudaDe(neg) || ''), nota: fila && fila.descripcion !== 'Devolución al negocio' ? fila.descripcion : '', fecha: fila ? fila.fecha : hoy(), pago: fila && fila.pago === 'Transferencia' ? 'Transferencia' : 'Efectivo', confirmarBorrar: false };
  if (pre) Object.assign(S.form, pre);
  abrirModal(`${cab(fila ? 'Editar devolución' : 'Devolver al negocio', 'var(--teal)', 'billetera')}
    <p class="ayuda" style="margin:0;font-size:14px">${neg !== S.yo.negocio ? esc(neg) + ' le debe' : 'Le debés'} al negocio <b>${fmt(deuda)}</b>. Si devolviste una parte, cambiá el monto.</p>
    <div class="campo"><label for="fMonto">¿Cuánto devolviste?</label>${plataHTML('fMonto', S.form.monto, 'data-campo="monto"')}</div>
    <label class="campo" for="fNota">Nota (opcional)<input id="fNota" data-campo="nota" value="${esc(S.form.nota)}" maxlength="80" placeholder="Agregá un detalle si querés"></label>
    <div class="campo">¿Cómo la devolviste?<div class="segm">${[['Efectivo', 'En efectivo', 'entra al efectivo'], ['Transferencia', 'Transferencia', 'vuelve a Mercado Pago']].map(([v, t, sub]) => `<button type="button" data-set="pago" data-val="${v}" aria-pressed="${S.form.pago === v}">${t}<small>${sub}</small></button>`).join('')}</div></div>
    <div class="ayuda" id="devAyuda">${ayudaDevolucion(S.form.pago)}</div>
    <div class="error" id="fError" hidden></div>
    <button class="btn" type="button" data-acc="guardarDevolucion" style="background:linear-gradient(135deg,#1F9E95,#7C4DFF);color:#fff">Guardar devolución</button>
    ${fila ? botonBorrar() : ''}`);
}
// Cuando no hay nada anotado para devolver: en vez de frenar, ofrece cargar lo que se usó
function sinDeuda(neg) {
  const otro = S.yo.admin && neg !== S.yo.negocio;
  const simple = esSimple();
  abrirModal(`${cab('Devolver al negocio', 'var(--teal)', 'billetera')}
    <p style="margin:0;font-size:17px;font-weight:700;line-height:1.4;color:var(--ink)">${otro ? esc(neg) + ' no tiene' : 'No tenés'} nada anotado para devolver.</p>
    <p class="ayuda" style="margin:0;font-size:15px;line-height:1.5">¿${otro ? 'Usó' : 'Usaste'} plata del negocio y no se cargó? Primero hay que cargar esa plata usada${simple ? '. En el mismo paso podés marcar si ya la devolviste, toda o una parte.' : ' (queda como gasto personal "a devolver"), y después se devuelve.'}</p>
    <button class="btn btn-grad" type="button" data-acc="${simple ? 'cargarUsado' : 'usarNegocio'}">Cargarlo ahora</button>
    <button class="btn btn-ghost" type="button" data-acc="cerrar">Ahora no</button>`);
}
const ayudaDevolucion = pago => pago === 'Transferencia' ? 'Baja lo que debés. El <b>efectivo</b> del negocio no cambia, porque la plata volvió a Mercado Pago.' : 'Baja lo que debés y la plata entra al <b>efectivo del negocio</b>.';
function formDevolucionBorrar() { const b = document.querySelector('#modalIn [data-acc=borrar]'); if (b) b.outerHTML = botonBorrar(); }
function guardarDevolucion() {
  const f = S.form, monto = num(f.monto);
  if (!(monto > 0)) return errorForm('Poné cuánto devolviste.');
  encolar({ tipo: 'guardar', hoja: 'negocio', id: f.id, datos: { negocio: f.negocio, tipo: 'Devolución', fecha: f.fecha, viaje: '', monto, nota: (f.nota || '').trim(), pago: f.pago === 'Transferencia' ? 'Transferencia' : 'Efectivo' } });
  cerrarModal(); avisar(f.editando ? 'Cambios guardados' : 'Devolución guardada');
}

/* ---------- Personal / Negocio ---------- */
function viajesDe(negocio) {
  const m = {};
  S.negocio.filter(f => f.viaje && (!negocio || f.negocio === negocio)).forEach(f => { if (!m[f.viaje] || m[f.viaje] < f.fecha) m[f.viaje] = f.fecha; });
  return Object.entries(m).sort((a, b) => b[1].localeCompare(a[1])).map(x => x[0]);
}
function vSeccion(cual) {
  const esN = cual === 'negocio';
  const r = rango(S.per);
  let filas = datosFiltrados(esN ? S.negocio : S.personal);
  const porViaje = esN && S.viaje;
  filas = porViaje ? filas.filter(f => f.viaje === S.viaje) : filas.filter(f => enRango(f, r));
  let items, total, mini;
  if (esN) {
    const partes = filas.flatMap(partesNegocio);
    items = agrupar(partes.map(p => [p[0], p[1]]));
    const rec = partes.filter(p => p[2] === 'rec').reduce((s, p) => s + p[1], 0);
    const no = partes.filter(p => p[2] === 'no').reduce((s, p) => s + p[1], 0);
    const gen = partes.filter(p => p[2] === 'gen').reduce((s, p) => s + p[1], 0);
    total = rec + no + gen;
    const negEf = S.yo.admin ? S.filtro : S.yo.negocio;
    const ef = negEf ? efectivoDe(negEf) : (S.listas['Negocios'] || []).reduce((s, n) => s + efectivoDe(n), 0);
    mini = `<div class="mini cuatro"><div><span>Recuperable</span><b>${fmt(rec)}</b></div><div><span>No reversible (viajes)</span><b>${fmt(no)}</b></div>
      <div class="gen"><span>Gastos generales</span><b>${fmt(gen)}</b></div>
      <button type="button" class="efe" data-acc="ajustar"><span>Efectivo disponible</span><b>${fmt(ef)}</b><small>${negEf ? 'Tocá para ajustar' : 'Todos los negocios'}</small></button></div>`;
  } else {
    items = agrupar(filas.map(f => [f.categoria, Number(f.monto) || 0]));
    total = filas.reduce((s, f) => s + (Number(f.monto) || 0), 0);
    const delNeg = filas.filter(f => f.origen !== 'Personal').reduce((s, f) => s + (Number(f.monto) || 0), 0);
    mini = `<div class="mini"><div><span>Con plata del negocio</span><b>${fmt(delNeg)}</b></div><div><span>Con plata propia</span><b>${fmt(total - delNeg)}</b></div></div>`;
  }
  const viajes = esN ? viajesDe(S.yo.admin ? S.filtro : S.yo.negocio) : [];

  return `
  <div class="titulo"><h1>${esN ? 'Compras y negocio' : 'Gasto personal'}</h1>${chipSync()}</div>
  ${filtroNegocios()}
  <div class="periodo">
    ${porViaje ? '' : `<div class="segm" role="group" aria-label="Período">${[['mes', 'Mes'], ['semana', 'Semana'], ['dia', 'Día']].map(([v, t]) =>
      `<button type="button" data-per="${v}" aria-pressed="${S.per.tipo === v}">${t}</button>`).join('')}</div>
    <div class="nav-per"><button type="button" data-mover="-1" aria-label="Anterior">${svg('izq', 20, 2.4)}</button><button type="button" class="per-btn" data-acc="elegirPeriodo" aria-label="Elegir ${S.per.tipo === 'mes' ? 'mes' : 'fecha'}: ${esc(etiquetaPer(S.per))}">${esc(etiquetaPer(S.per))}${svg('abajo', 16, 2.6)}</button><button type="button" data-mover="1" aria-label="Siguiente">${svg('der', 20, 2.4)}</button></div>`}
    ${esN && viajes.length ? ddHTML('ddVerViaje', 'Ver por viaje', [['', 'Por fecha (' + etiquetaPer(S.per) + ')'], ...viajes.map(v => [v, v])], S.viaje, v => { S.viaje = v; render(); }) : ''}
  </div>
  <div class="anillo">${anillo(cual, items, total, { tam: 220, grosor: 15, arriba: porViaje ? 'Este viaje' : etiquetaPer(S.per), valor: fmt(total), contar: total, abajo: movs(filas.length) })}</div>
  ${items.length ? `<div class="cats">${items.map((it, i) => legIt(cual, it, i, total)).join('')}</div>` : ''}
  ${mini}
  <section class="tarj"><h2>Movimientos</h2><div class="lista">${filas.length ? ordenar(filas).map(f => filaMov(f, esN)).join('') :
    `<div class="vacio">No hay movimientos ${porViaje ? 'en este viaje' : 'en este período'}.</div>`}</div></section>`;
}

/* ---------- Perfil ---------- */
let usuariosAdmin = null;
function opcionesExport() {
  if (S.expViaje) return viajesDe('').map(v => [v, v]);
  const meses = [...new Set([...S.personal, ...S.negocio].map(f => String(f.fecha).slice(0, 7)))].sort().reverse();
  if (!meses.includes(hoy().slice(0, 7))) meses.unshift(hoy().slice(0, 7));
  return meses.map(m => [m, etiquetaPer({ tipo: 'mes', ref: m + '-01' })]);
}
function valorExport() {
  const op = opcionesExport();
  return op.some(o => o[0] === S.expVal) ? S.expVal : (op[0] ? op[0][0] : '');
}
function vPerfil() {
  const y = S.yo;
  const meses = [...new Set([...S.personal, ...S.negocio].map(f => String(f.fecha).slice(0, 7)))].sort().reverse();
  if (!meses.includes(hoy().slice(0, 7))) meses.unshift(hoy().slice(0, 7));
  const viajes = viajesDe('');
  const opExp = opcionesExport();
  const ult = S.ultimaSync ? new Date(S.ultimaSync).toLocaleString('es-AR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'nunca';
  return `
  ${esSimple() ? `<div class="titulo-todos"><button type="button" class="volver" data-acc="volverInicio" aria-label="Volver">${svg('izq', 20, 2.4)}</button><h1>Mi perfil</h1></div>` : `<div class="titulo"><h1>Perfil</h1>${chipSync()}</div>`}
  <section class="tarj">
    <div class="cabecera" style="margin-bottom:8px"><div class="avatar">${esc(iniciales(y.nombre))}</div><div class="saludo"><b>${esc(y.nombre)}</b><small>${esc(y.negocio)}${y.admin ? ' · Admin' : ''}</small></div></div>
    <div class="fila-p"><span>Usuario</span><b>${esc(y.usuario)}</b></div>
    <div class="fila-p"><span>Última vez subido</span><b>${esc(ult)}</b></div>
    <div class="fila-p"><span>Gastos sin subir</span><b>${S.cola.length}</b></div>
    ${S.rech.length ? `<div class="fila-p"><span>Con error (en rojo)</span><b style="color:var(--errtxt)">${S.rech.length}</b></div>` : ''}
    <div class="fila-p"><span>Versión de la app</span><span class="ver-app"><b>${esc(APP_SERIE)}</b><small>${esc(fechaVersion())}</small></span></div>
  </section>
  <button class="btn btn-sec" type="button" id="btnSyncGrande" data-acc="sync" ${S.sincronizando ? 'disabled' : ''}>${svg('nube', 18, 2.2)}${S.sincronizando ? 'Subiendo…' : 'Subir y actualizar ahora'}</button>

  <button class="interruptor" type="button" role="switch" data-acc="modoOnOff" aria-checked="${esSimple()}"><span><b>Modo simple</b><small>Todo más grande y una pregunta por pantalla</small></span><span class="switch" aria-hidden="true"></span></button>
  ${esSimple() ? '' : `<section class="tarj" style="display:flex;flex-direction:column;gap:12px">
    <h2 style="margin:0">Descargar resumen</h2>
    <p class="ayuda" style="margin:0">En Excel, con las mismas columnas que tus planillas, o en PDF, listo para guardar o compartir.</p>
    <div class="segm" role="group"><button type="button" data-exp="mes" aria-pressed="${!S.expViaje}">Por mes</button><button type="button" data-exp="viaje" aria-pressed="${!!S.expViaje}" ${viajes.length ? '' : 'disabled'}>Por viaje</button></div>
    ${ddHTML('ddExp', S.expViaje ? 'Viaje' : 'Mes', opExp, valorExport(), v => { S.expVal = v; render(); })}
    ${y.admin ? ddHTML('ddExpNeg', 'Negocio', [['', 'Todos los negocios'], ...(S.listas['Negocios'] || []).map(n => [n, n])], S.expNeg || '', v => { S.expNeg = v; render(); }) : ''}
    <button class="btn btn-grad" type="button" data-acc="exportar">Descargar Excel</button>
    <button class="btn btn-sec" type="button" data-acc="verPDF">${svg('recibo', 18, 2.2)} Descargar resumen PDF</button>
  </section>`}

  ${y.admin ? `<section class="tarj" style="display:flex;flex-direction:column;gap:10px">
    <h2 style="margin:0">Cuentas de la familia ${S.pendientes ? `<span class="estado pendiente">${S.pendientes} pendiente${S.pendientes > 1 ? 's' : ''}</span>` : ''}</h2>
    <div id="usuariosAdmin">${usuariosAdmin ? htmlUsuarios() : `<button class="btn btn-sec" type="button" data-acc="verUsuarios">Ver cuentas</button>`}</div>
  </section>` : ''}

  ${esSimple() ? '' : `<button class="interruptor" type="button" role="switch" data-acc="ayudanteOnOff" aria-checked="${LS.get('bd_ayudante', true) !== false}"><span><b>Mostrar ayudante 🤖</b><small>El robotito que te guía paso a paso</small></span><span class="switch" aria-hidden="true"></span></button>`}
  <button class="interruptor" type="button" data-acc="apariencia"><span><b>Apariencia</b><small>Tamaño y tipo de letra · Modo claro u oscuro</small></span>${svg('der', 20, 2.2)}</button>
  <button class="btn btn-sec" type="button" data-acc="cambiarPatron">Cambiar mi patrón</button>
  <button class="btn btn-ghost" type="button" data-acc="salir">Cerrar sesión</button>`;
}
function htmlUsuarios() {
  return usuariosAdmin.map(u => {
    const est = u.bloqueado ? ['bloq', 'Bloqueada'] : [u.estado, { activo: 'Activa', pendiente: 'Pendiente', desactivado: 'Desactivada' }[u.estado] || u.estado];
    const yo = u.usuario === S.yo.usuario;
    return `<div class="usr"><div class="cab"><div><b>${esc(u.nombre)}</b><small>${esc(u.usuario)} · ${esc(u.negocio)}${u.rol === 'admin' ? ' · Admin' : ''}</small></div><span class="estado ${est[0]}">${esc(est[1])}</span></div>
      <div class="acc">
        ${u.estado === 'pendiente' ? `<button type="button" class="prim" data-adm="aprobar:${esc(u.usuario)}">Aprobar</button>` : ''}
        ${u.estado === 'desactivado' ? `<button type="button" class="prim" data-adm="aprobar:${esc(u.usuario)}">Activar</button>` : ''}
        ${u.bloqueado ? `<button type="button" class="prim" data-adm="desbloquear:${esc(u.usuario)}">Desbloquear</button>` : ''}
        ${!yo && u.estado !== 'desactivado' ? `<button type="button" data-adm="rechazar:${esc(u.usuario)}">${u.estado === 'pendiente' ? 'Rechazar' : 'Desactivar'}</button>` : ''}
        <button type="button" data-adm="clave:${esc(u.usuario)}">Nueva contraseña</button>
        ${u.estado === 'activo' ? `<button type="button" data-adm="modo:${esc(u.usuario)}:${u.modo === 'simple' ? 'completo' : 'simple'}">${u.modo === 'simple' ? 'Pasar a modo completo' : 'Pasar a modo simple'}</button>` : ''}
      </div>
      <small style="color:var(--muted);font-weight:700;font-size:12px">Modo: ${u.modo === 'simple' ? 'Simple' : u.modo === 'completo' ? 'Completo' : 'todavía no eligió'}</small></div>`;
  }).join('');
}

/* =========================================================
   Ventanas (formularios)
   ========================================================= */
function abrirModal(html, clase) { $('modalIn').className = 'vidrio' + (clase ? ' ' + clase : ''); $('modalIn').innerHTML = html; if (!clase) { $('modal').style.height = ''; $('modal').style.top = ''; } if ($('modal').hidden) { $('modal').hidden = false; histRevisar(); } }
function limpiarModal() { S.form = null; S.formGuardado = null; S.volverA = null; }
function cerrarModal(desdeAtras) {
  const estaba = !$('modal').hidden;
  $('modal').hidden = true; $('modalIn').innerHTML = ''; $('modalIn').className = 'vidrio'; $('modal').style.height = ''; $('modal').style.top = ''; limpiarModal();
  if (typeof IA !== 'undefined') IA.cargando = false;
  if (estaba && !desdeAtras) histRevisar();
}
$('modal').addEventListener('click', e => { if (e.target === $('modal')) cerrarModal(); });
const cab = (titulo, color, icono) => `<div class="v-cab"><span class="ic" style="background:${color}">${svg(icono, 20)}</span><b>${esc(titulo)}</b><button class="cerrar" type="button" data-acc="cerrar" aria-label="Cerrar">${svg('x', 18, 2.2)}</button></div>`;

function elegirTipo() {
  const neg = S.filtro || S.yo.negocio, deuda = deudaDe(neg);
  const op = (nuevo, icono, titulo, sub, fondo) => `<button class="opcion" type="button" data-nuevo="${nuevo}" style="background:${fondo}"><span class="oi">${svg(icono, 24)}</span><span><b>${titulo}</b><small>${sub}</small></span>${svg('der', 20, 2.2)}</button>`;
  abrirModal(`${cab('¿Qué querés cargar?', 'var(--card3)', 'recibo')}
    <div class="ay-sec">Negocio</div>
    ${op('viaje', 'caja', 'Viajes', 'Compras y gastos del viaje', 'linear-gradient(135deg,#7C4DFF,#9E4BE6)')}
    ${op('general', 'recibo', 'Gastos generales', 'Gastos del negocio fuera de viajes', 'linear-gradient(135deg,#B8661F,#D9862B)')}
    ${op('cambio', 'cambio', 'Cambio a efectivo', 'Transferencia por efectivo', 'linear-gradient(135deg,#1F9E95,#2B7F9E)')}

    ${f.editando || grupo !== 'viaje' ? '' : `<div class="segm" role="group" aria-label="Tipo">${tabs.map(([v, t, s]) => `<button type="button" data-set="tipo" data-val="${v}" aria-pressed="${f.tipo === v}">${t}<small>${s}</small></button>`).join('')}</div>`}
