<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Billetera Digital</title>
<meta name="theme-color" content="#0E0B1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Billetera Digital">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800;900&display=swap">
<script src="config.js"></script>
<style>
/* Billetera Digital — oscuro, violeta/fucsia, tarjetas sólidas, ventanas de carga semitransparentes */
:root{
  --bg:#0E0B1A; --bg2:#120E22; --card:#1A1530; --card2:#241D3F; --card3:#2E2550;
  --ink:#F4F1FF; --muted:#A49CC4; --soft:#C9C0E6; --dim:#7F76A3;
  --violet:#7C4DFF; --violet2:#9B6BFF; --lilac:#D7C8FF; --fuchsia:#E040A0; --pink:#F05BB5;
  --teal:#1F9E95; --teal2:#3FD6C6; --tealbg:#1F4D47; --tealink:#BDF5EE;
  --amber:#FFB547; --red:#FF6B81;
  --grad:linear-gradient(135deg,#7C4DFF 0%,#B347D9 55%,#E040A0 100%);
  --font:'Urbanist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --campo:rgba(11,9,22,.5); --campo2:rgba(11,9,22,.3); --borde:rgba(255,255,255,.13); --sutil:rgba(255,255,255,.07);
  --errtxt:#FFB3BF; --vidrio:rgba(34,27,60,.72); --chatbg:rgba(26,21,48,.96); --velo:rgba(8,6,16,.55); --login1:#2A1650;
  --sobre:#1A1530; --globo:var(--ink); --acento:var(--lilac); --naranja:#F0A04B;
  --toque1:rgba(196,170,255,.40); --toque2:rgba(155,107,255,.20); --toque3:rgba(124,77,255,.06); --toque4:rgba(155,107,255,.22); --c3:#B79CFF; --patpunto:#4A4170;
  color-scheme:dark;
}
/* ---------- Modo claro: fondo claro teñido de lila ---------- */
html.claro .s-efe b{color:var(--tealink)}
html.claro .opcion.chica{color:var(--ink)}
html.claro .opcion.chica .oi{background:var(--card2);color:var(--lilac)}
html.claro .robot-globo,html.claro .guia-globo{border:1px solid var(--borde);box-shadow:0 12px 30px rgba(60,30,140,.22)}
html.claro .vidrio{box-shadow:0 18px 50px rgba(60,30,140,.18)}
html.claro{
  --bg:#F5F1FF; --bg2:#EEE7FF; --card:#FFFFFF; --card2:#F0EAFF; --card3:#E6DCFF;
  --ink:#1F1739; --muted:#6A5F90; --soft:#4B4170; --dim:#9289B5;
  --violet:#7C4DFF; --violet2:#7C4DFF; --lilac:#5B2FD6; --fuchsia:#D6338F; --pink:#C42A82;
  --teal:#1F9E95; --teal2:#0F8278; --tealbg:#D3F2EE; --tealink:#0B6058;
  --amber:#A86300; --red:#D2304D;
  --campo:#FFFFFF; --campo2:rgba(255,255,255,.75); --borde:rgba(70,40,150,.16); --sutil:rgba(70,40,150,.07);
  --errtxt:#B8173F; --vidrio:rgba(255,255,255,.9); --chatbg:#FBF9FF; --velo:rgba(45,25,100,.32); --login1:#E2D5FF;
  --sobre:#1F1739; --globo:#FFFFFF; --acento:#5B2FD6; --naranja:#B5651D;
  --toque1:rgba(124,77,255,.26); --toque2:rgba(124,77,255,.13); --toque3:rgba(124,77,255,.05); --toque4:rgba(124,77,255,.16); --c3:#7C4DFF; --patpunto:#CFC3F0;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.pantalla{position:fixed;inset:0;overflow:auto;padding:calc(24px + var(--safe-t)) max(18px,env(safe-area-inset-right,0px)) calc(24px + var(--safe-b)) max(18px,env(safe-area-inset-left,0px))}

/* ---------- Campos ---------- */
.campo{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--soft);min-width:0}
.campo input,.campo select,.input{width:100%;border:1px solid var(--borde);background:var(--campo);color:var(--ink);border-radius:14px;padding:12px;font-size:16px;font-weight:600}
.clave{position:relative}
.clave input{padding-right:54px}
.ojo{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--soft);display:flex;align-items:center;justify-content:center}
.ojo[aria-pressed="true"]{color:var(--lilac);background:rgba(124,77,255,.18)}
.campo input:focus,.input:focus{outline:none;border-color:var(--violet2);box-shadow:0 0 0 3px rgba(124,77,255,.3)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos>*{min-width:0}
.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-grad{background:var(--grad);color:#fff}
.btn-sec{background:var(--card3);color:var(--ink)}
.btn-rojo{background:#D92D3F;color:#fff}
.btn-ghost{background:transparent;color:var(--soft);font-weight:700;font-size:14px;padding:10px}
.btn:disabled{opacity:.55;cursor:default}
.error{background:rgba(255,107,129,.14);color:var(--errtxt);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.ok{background:rgba(63,214,198,.14);color:var(--tealink);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.ayuda{font-size:12px;font-weight:600;color:var(--soft);line-height:1.4}
.segm{display:flex;background:var(--campo);border-radius:16px;padding:4px;gap:4px}
.segm button{flex:1 1 0;border:0;background:transparent;border-radius:12px;padding:10px 4px;font-weight:700;font-size:14px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:1px}
.segm button small{font-size:10px;font-weight:600}
.segm button[aria-pressed="true"]{background:var(--violet);color:#fff;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--borde);background:var(--campo2);border-radius:14px;padding:10px 12px;font-weight:700;font-size:13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg2);border-color:var(--ink);font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* ---------- Login ---------- */
#login{display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 70% at 50% 0%,var(--login1) 0%,var(--bg) 60%)}
.login-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.marca{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px;text-align:center}
.marca img{width:84px;height:84px;border-radius:24px;box-shadow:0 14px 40px rgba(176,71,217,.45)}
.marca h1{margin:0;font-size:28px;font-weight:900}
.marca p{margin:0;color:var(--muted);font-weight:600}

/* ---------- Patrón ---------- */
#patron{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#patron h2{margin:0;font-size:22px}
#patronSvg{width:280px;height:280px;touch-action:none;user-select:none}
.puntos-error{animation:sacude .35s}
@keyframes sacude{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- Bienvenida ---------- */
#bienvenida{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--grad);text-align:center}
#bienvenida span{font-size:18px;font-weight:700;opacity:.9}
#bienvenida b{font-size:38px;font-weight:900;line-height:1.1}

/* ---------- App ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#contenido{flex:1;overflow:auto;padding:calc(20px + var(--safe-t)) max(18px,env(safe-area-inset-right,0px)) calc(170px + var(--safe-b)) max(18px,env(safe-area-inset-left,0px))}
.vista{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.cabecera{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--card2);color:var(--lilac);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none}
.saludo{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.saludo small{font-size:13px;color:var(--muted);font-weight:600}
.saludo b{font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{border:0;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;background:var(--card);color:var(--soft);white-space:nowrap}
.sync.pend{background:rgba(255,181,71,.16);color:var(--amber)}
.sync.okk{background:var(--tealbg);color:var(--tealink)}
.titulo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.titulo h1{margin:0;font-size:24px;font-weight:900}
.filtro-neg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filtro-neg button{flex:none;border:0;border-radius:20px;padding:8px 13px;background:var(--card);color:var(--soft);font-weight:700;font-size:13px}
.filtro-neg button[aria-pressed="true"]{background:var(--ink);color:var(--bg2);font-weight:800}

.hero{border-radius:26px;background:var(--grad);padding:20px;display:flex;flex-direction:column;gap:14px;color:#fff}
.hero .fila{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .etq{font-size:14px;font-weight:700}
.hero .pill{font-size:12px;font-weight:700;background:rgba(14,11,26,.28);border-radius:20px;padding:5px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.hero .total{font-size:38px;font-weight:900;letter-spacing:-.5px;line-height:1.05}
.hero .sub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .sub div{background:rgba(14,11,26,.28);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hero .sub span{font-size:12px;font-weight:600}
.hero .sub b{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tarj{background:var(--card);border-radius:22px;padding:16px}
.tarj h2{margin:0 0 12px;font-size:16px;font-weight:800}
.dona{display:flex;align-items:center;gap:16px}
.dona svg{flex:none}
.leyenda{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;font-size:13px}
.leyenda div{display:flex;align-items:center;gap:8px}
.leyenda i{width:9px;height:9px;border-radius:3px;flex:none}
.leyenda span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leyenda b{font-weight:800}
.vacio{color:var(--muted);font-size:14px;text-align:center;padding:18px 8px;line-height:1.5}

.periodo{display:flex;flex-direction:column;gap:10px}
.nav-per{display:flex;align-items:center;justify-content:space-between}
.nav-per button{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}
.nav-per b{font-size:16px;font-weight:800}
.anillo{display:flex;justify-content:center}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.mini.cuatro{grid-template-columns:1fr 1fr}
.total-fila{display:flex;align-items:center;gap:16px;min-width:0}
.ojo-montos{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center}
.s-efe .total-fila{flex-direction:row;gap:12px}
.s-efe .ojo-montos{width:36px;height:36px;background:var(--borde);color:inherit}
.s-efe .s-contar{flex:none;border:0;font-size:14px;font-weight:800;background:var(--borde);color:inherit;padding:10px 14px;border-radius:12px;white-space:nowrap}
/* Lo de siempre */
.rapidos{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.rapidos button{border:1px solid rgba(124,77,255,.45);background:rgba(124,77,255,.14);color:var(--acento);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px}
.f-rapidos{margin-top:-4px}.f-rapidos button{font-size:17px;padding:11px 15px;border-radius:16px}
/* Comparación con el mes anterior */
.comp{display:flex;flex-direction:column;gap:12px}
.comp p{margin:0;font-size:15px;font-weight:700;color:var(--soft)}
.comp p b.menos{color:var(--teal2)}.comp p b.mas{color:var(--pink)}
.barras{display:flex;align-items:flex-end;gap:10px;height:110px}
.barras div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.barras i{display:block;width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:var(--card3);min-height:4px}
.barras div.actual i{background:var(--grad)}
.barras small{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:capitalize}
.barras div.actual small{color:var(--acento)}
/* 2.0.0 · Inicio: barra hacia Análisis, meses deslizables y día por día */
.hero-barra{gap:10px}
.hero-ir{border:0;background:none;color:inherit;padding:0;font:inherit;text-align:left;min-width:0;cursor:pointer}
.hero-flecha{flex:none;margin-left:auto;width:40px;height:44px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.comp{cursor:pointer}
.comp h2{display:flex;align-items:center;justify-content:space-between;margin:0}
.comp .expandir{width:34px;height:34px;border-radius:11px;background:var(--card2);color:var(--lilac);display:flex;align-items:center;justify-content:center;transition:transform .8s ease}
.comp.abierta .expandir{transform:rotate(180deg)}
.carril-meses,.carril-dias{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:auto}
.carril-meses::-webkit-scrollbar,.carril-dias::-webkit-scrollbar{display:none}
.carril-meses{height:138px;margin:0 -8px}
.mes-b{flex:0 0 calc(100% / 6);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;border:0;background:none;padding:0 6px;scroll-snap-align:start;color:inherit;font:inherit;cursor:pointer}
.mes-b i{display:block;width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:var(--card3);min-height:4px;transition:height .3s}
.mes-b.actual i{background:var(--grad)}
.mes-b small{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:capitalize;line-height:14px}
.mes-b.actual small{color:var(--acento)}
.mes-b em{font-style:normal;font-size:10px;font-weight:800;color:var(--dim);height:12px;line-height:12px}
.dias-res{background:var(--card2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;cursor:auto}
.dr-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dr-top span{font-size:14px;font-weight:700;color:var(--soft)}
.dr-top b{font-size:19px;font-weight:900;white-space:nowrap}
.dr-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dr-tiles div{background:var(--card);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.dr-tiles small{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.dr-tiles b{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.pt.n{background:var(--violet2)}.pt.p{background:var(--pink)}
.dr-ef,.dd-f.ef{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}
.dr-ef span,.dd-f.ef span{color:var(--tealink);font-weight:700}
.dr-ef b,.dd-f.ef b{color:var(--teal2);font-weight:800}
.carril-dias{margin:0 -16px;border-top:1px solid var(--sutil);border-bottom:1px solid var(--sutil)}
.dia-c{flex:0 0 calc(100% / 7);height:208px;box-sizing:border-box;scroll-snap-align:start;padding:10px 0;border:0;border-left:1px solid var(--sutil);background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;font:inherit;cursor:pointer}
.dia-c.sel{background:rgba(124,77,255,.16)}
.dia-c small{font-size:13px;font-weight:800;color:var(--muted);height:18px}
.dia-c b{width:30px;height:30px;margin-top:4px;border-radius:50%;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center}
.dia-c b.hoy{background:var(--ink);color:var(--bg)}
.dia-m{margin-top:auto;margin-bottom:5px;font-size:11px;font-weight:800;white-space:nowrap}
.dia-m.cero{color:var(--dim)}
.dia-b{display:flex;flex-direction:column;width:16px;border-radius:8px;overflow:hidden}
.dia-b i{display:block;background:var(--pink)}
.dia-b i.n{background:var(--violet2)}
.dia-0{display:block;width:16px;height:4px;border-radius:4px;background:var(--card3)}
.dia-det{border:1px solid var(--borde);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;cursor:auto}
.dd-tit{font-size:15px;font-weight:800}
.dd-f{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dd-f span{display:flex;align-items:center;gap:8px;color:var(--soft);font-weight:600}
.dd-f b{font-weight:800}
.dd-f.ef{padding-top:8px;border-top:1px solid var(--sutil)}
.recuerdo{display:flex;align-items:center;gap:12px;border:1px solid var(--borde);background:var(--card);border-radius:18px;padding:12px 10px 12px 14px}
.recuerdo .ic{font-size:22px;flex:none}
.recuerdo > span:not(.ic){display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.recuerdo b{font-size:15px}.recuerdo small{font-size:13.5px;color:var(--muted);font-weight:600}
.recuerdo .cerrar{flex:none}
/* 2.0.0 · Análisis y pantalla de categoría */
.ana-mes{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.ana-tot{display:flex;flex-direction:column;gap:2px;min-width:0}
.ana-tot > span:first-child{color:var(--muted);font-size:14px;font-weight:700}
.ana-tot b{font-size:30px;font-weight:900;white-space:nowrap}
.ana-tot small{font-size:13.5px;font-weight:600;color:var(--muted)}
.ana-flechas{display:flex;gap:8px;flex:none}
.ana-flechas button{width:40px;height:40px;border-radius:12px;border:0;background:var(--card2);color:var(--lilac);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ana-flechas button:disabled{opacity:.4;cursor:default}
.ana-svg{--trace:#4FD8FF;--gris:#3A3152;width:calc(100% + 16px);margin:0 -8px;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html.claro .ana-svg{--trace:#138CD6;--gris:#DAD4E6}
.ana-svg .seg{cursor:pointer;stroke-width:5;stroke-linejoin:round;transition:fill .25s,stroke .25s;outline:none}
.ana-svg .ico{font-size:17px;pointer-events:none;dominant-baseline:central;text-anchor:middle;transition:opacity .25s}
.ana-svg .c-lab{font-size:12px;fill:var(--muted);font-weight:700;text-anchor:middle;letter-spacing:.05em;text-transform:uppercase}
.ana-svg .c-val{font-weight:900;fill:var(--ink);text-anchor:middle;font-variant-numeric:tabular-nums}
.ana-svg .c-grupo{cursor:pointer;outline:none}
.ana-svg .c-grupo.apagado .c-val{fill:var(--muted)}
.ana-svg .c-linea{stroke:var(--borde)}
.ana-svg .t-name{font-size:14px;fill:var(--muted);font-weight:700}
.ana-svg .t-amt{font-size:17px;fill:var(--ink);font-weight:900;font-variant-numeric:tabular-nums}
.ana-pista{text-align:center;color:var(--muted);font-size:13.5px;font-weight:600;margin:-6px 0 0;min-height:18px}
.ana-ver{align-self:center;border:0;border-radius:14px;padding:11px 16px;font-weight:800;font-size:14px;font-family:var(--font);color:#fff;background:var(--grad);cursor:pointer}
.ana-lista{display:flex;flex-direction:column;gap:4px}
.ana-lista h3{margin:10px 2px 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ana-fila{display:grid;grid-template-columns:42px 1fr auto 16px;gap:10px;align-items:center;padding:8px 6px;border-radius:14px;border:0;background:transparent;color:var(--ink);font-family:var(--font);text-align:left;cursor:pointer;transition:opacity .25s,background .2s}
.ana-fila:hover,.ana-fila.sel{background:var(--card2)}
.ana-fila.apagada{opacity:.4}
.ana-fila .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px}
.ana-fila .n{font-weight:800;font-size:15px;min-width:0}
.ana-fila .n small{display:block;font-weight:600;color:var(--muted);font-size:12.5px}
.ana-fila .m{font-weight:800;font-size:15px;white-space:nowrap}
.ana-fila svg{color:var(--muted)}
.cat-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none}
.titulo-todos h1 small{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
.cat-monto{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cat-monto em{font-style:normal;font-size:13px;font-weight:800;border-radius:999px;padding:3px 9px}
.cat-monto em.mas{color:var(--amber);background:rgba(255,181,71,.16)}
.cat-monto em.menos{color:var(--teal2);background:rgba(63,214,198,.14)}
.cat-barras{display:flex;flex:none;height:100%;position:relative}
.cat-barras .prom{position:absolute;left:0;right:0;border-top:2px dashed var(--acento);opacity:.6;pointer-events:none}
.prom-ley{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--soft)}
.prom-ley span{width:18px;border-top:2px dashed var(--acento)}
.sec-t{margin:6px 2px 0;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sub-fila{background:var(--card);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.sub-fila > div:first-child{grid-column:1 / -1;display:flex;justify-content:space-between;gap:8px;font-size:15px}
.sub-bar{height:6px;border-radius:99px;background:var(--card3);overflow:hidden}
.sub-bar i{display:block;height:6px;border-radius:99px}
.sub-fila small{font-size:13px;font-weight:700;color:var(--muted)}
/* 2.0.0 · Apariencia, colores, desbloqueo y dispositivos */
html[data-color=azul]{--violet:#3D6BFF;--violet2:#5B86FF;--fuchsia:#2FB3E0;--pink:#5BC8F0;--lilac:#C8D6FF;--acento:#C8D6FF;--c3:#9DB6FF;--grad:linear-gradient(135deg,#3D6BFF 0%,#3A8FE0 55%,#2FB3E0 100%)}
html[data-color=verde]{--violet:#1F9E75;--violet2:#2FBF8E;--fuchsia:#7BC74D;--pink:#9BD86A;--lilac:#BFF2DD;--acento:#BFF2DD;--c3:#7FDDB8;--grad:linear-gradient(135deg,#1F9E75 0%,#3DAE6B 55%,#7BC74D 100%)}
html[data-color=naranja]{--violet:#E0702A;--violet2:#F08A45;--fuchsia:#E0405A;--pink:#F06B7E;--lilac:#FFD9BF;--acento:#FFD9BF;--c3:#FFB98A;--grad:linear-gradient(135deg,#E0702A 0%,#E8573F 55%,#E0405A 100%)}
html[data-color=rosa]{--violet:#D6338F;--violet2:#E85AA8;--fuchsia:#8E4BE0;--pink:#B57CF0;--lilac:#FFC8E6;--acento:#FFC8E6;--c3:#F5A3D2;--grad:linear-gradient(135deg,#D6338F 0%,#B347D9 55%,#8E4BE0 100%)}
html.claro[data-color=azul]{--lilac:#1F45C2;--acento:#1F45C2;--c3:#3D6BFF}
html.claro[data-color=verde]{--lilac:#126B4E;--acento:#126B4E;--c3:#1F9E75}
html.claro[data-color=naranja]{--lilac:#A84A0E;--acento:#A84A0E;--c3:#E0702A}
html.claro[data-color=rosa]{--lilac:#A01E6A;--acento:#A01E6A;--c3:#D6338F}
html.ahorro *,html.ahorro *::before,html.ahorro *::after{animation:none!important;transition:none!important}
.ap-colores{display:flex;gap:10px;flex-wrap:wrap}
.ap-colores button{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;padding:2px}
.ap-colores i{display:block;width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px var(--borde)}
.ap-colores button[aria-pressed="true"] i{border-color:var(--card);box-shadow:0 0 0 3px var(--ink)}
.ap-colores small{font-size:12px;font-weight:700;color:var(--muted)}
.segm4 button{font-size:13px}
.ap-horas{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--soft)}
.ap-horas select{margin-left:6px;border-radius:10px;border:1px solid var(--borde);background:var(--campo);color:var(--ink);padding:8px;font:inherit}
.disp-f{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--sutil)}
.disp-f .oi{font-size:22px}
.disp-f > span:nth-child(2){flex:1;display:flex;flex-direction:column;min-width:0}
.disp-f small{font-size:12.5px;color:var(--muted);font-weight:600}
.disp-f em{font-style:normal;font-size:12px;font-weight:800;color:var(--teal2)}
.disp-f button{border:0;border-radius:12px;padding:9px 12px;background:var(--card3);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
#pinPant{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#pinPant[hidden]{display:none}
.pin-puntos{display:flex;gap:16px;margin:8px 0}
.pin-puntos i{width:18px;height:18px;border-radius:50%;border:2px solid var(--c3)}
.pin-puntos i.on{background:var(--c3)}
.pin-puntos i.mal{border-color:var(--red)}.pin-puntos i.mal.on{background:var(--red)}
.pin-teclas{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pin-teclas button{width:76px;height:76px;border-radius:50%;border:0;background:var(--card2);color:var(--ink);font:inherit;font-size:30px;font-weight:800;cursor:pointer}
.pin-teclas button:active{background:var(--card3)}
/* 2.0.2 · Modo simple: el ayudante de cuerpo entero fuera de Inicio, señalando su globito */
.cam.ayu-parado{left:auto;top:auto;right:12px;bottom:calc(14px + var(--safe-b) + var(--kb,0px));transform:none;pointer-events:auto;cursor:pointer;z-index:7;transition:bottom .2s ease}
.cam.ayu-parado.aparece{animation:ayuAparece .4s cubic-bezier(.2,1.3,.4,1)}
.cam.ayu-parado.al-icono{animation:ayuAlIcono .28s ease-in forwards}
#robot.vuelve{animation:icoVuelve .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes ayuAparece{from{transform:translateY(26px) scale(.45);opacity:0}to{transform:none;opacity:1}}
@keyframes ayuAlIcono{to{transform:translateY(22px) scale(.4);opacity:0}}
@keyframes icoVuelve{from{transform:scale(.35);opacity:0}to{transform:none;opacity:1}}
body.con-cuerpo .robot-globo{right:calc(14px + var(--ayw,70px));bottom:calc(14px + var(--safe-b) + var(--kb,0px) + 40px);max-width:min(300px,calc(100vw - 104px))}
.robot-globo .g-acc .g-stop{background:transparent!important;color:var(--muted)!important;text-decoration:underline;padding-left:4px;padding-right:4px}
/* Inicio simple: la barra queda abajo, al lado del ícono, y sube mientras está el mensaje del ayudante */
body.simple.ini-simple #contenido{padding-bottom:0}
.s-pregunta{transition:transform .35s ease}
body.ini-simple #contenido > .vista{transition:transform .35s ease}
body.globo-ini .s-pregunta{transform:translateY(calc(-1 * var(--sube1,0px)))}
body.globo-ini.ini-simple #contenido > .vista{transform:translateY(calc(-1 * var(--sube2,0px)))}
/* 2.0.1 · Ayudante con cuerpo completo (un solo cuerpo: brazos y piernas se mueven desde sus articulaciones) */
.cam{position:fixed;left:0;top:0;z-index:26;pointer-events:none;will-change:transform;transition:opacity .25s}
.cam[hidden]{display:none}
.cam .cam-sombra{position:absolute;left:14%;right:14%;bottom:-5px;height:10px;border-radius:50%;background:rgba(20,10,50,.28)}
html.claro .cam .cam-sombra{background:rgba(60,30,140,.2)}
.cam svg{display:block;overflow:visible}
.cam.voltea svg{transform:scaleX(-1)}
.cam .pie1,.cam .pie2{transform-box:fill-box;transform-origin:50% 0}
.cam.camina .cam-cuerpo{animation:camBob .22s ease-in-out infinite alternate}
.cam.camina .pie1{animation:camPierna .22s ease-in-out infinite alternate}
.cam.camina .pie2{animation:camPierna .22s ease-in-out infinite alternate-reverse}
.cam .brazoI{transition:transform .45s ease}
.cam.senala .brazoI{transform:rotate(var(--brazoS))}
.cam.senala .dedo{animation:camDedo .5s ease-in-out .45s infinite alternate}
.cam .av-flota{animation:none!important}
@keyframes camBob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes camPierna{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes camDedo{from{transform:rotate(0deg)}to{transform:rotate(-7deg)}}
#guia.con-cam .guia-cara{display:none}
/* 2.0.1 · Apariencia: ejemplo en vivo y "¿Salir sin guardar?" */
.ap-prev{position:relative;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#0E0B1A;color:#F4F1FF;border:1px solid var(--borde)}
.ap-prev.prev-claro{background:#F5F1FF;color:#1F1739}
.ap-prev small{font-size:.8em;font-weight:700;opacity:.75}
.ap-prev p{margin:0;font-weight:600;padding-right:52px}
.ap-hero{border-radius:14px;padding:12px 14px;color:#fff;display:flex;flex-direction:column;gap:2px}
.ap-hero span{font-size:.85em;font-weight:700}.ap-hero b{font-size:1.6em;font-weight:900}
.ap-prev .ap-prev-av{position:absolute;right:12px;bottom:10px}
.segm2x2{display:grid;grid-template-columns:1fr 1fr}
.segm2x2 button{min-height:46px}
.ap-salir{position:fixed;inset:0;z-index:400;background:var(--velo);display:flex;align-items:center;justify-content:center;padding:20px}
.ap-salir-in{background:var(--card);color:var(--ink);border-radius:22px;padding:20px;max-width:360px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.ap-salir-in b{font-size:20px;font-weight:800}.ap-salir-in p{margin:0;color:var(--soft);font-weight:600}
.ap-salir-fila{display:flex;gap:10px}.ap-salir-fila .btn{flex:1;padding-left:8px;padding-right:8px}
/* 2.0.0 · Ayudante (avatares, gestos y globitos) */
.av{display:inline-grid;place-items:center;position:relative;flex:none;line-height:0}
.av svg{width:100%;height:100%;overflow:visible}
.robot .av{width:30px;height:30px;color:#fff}
.robot.claro-av{background:#F4EEFF;padding:0}
.robot.claro-av .av{width:44px;height:44px}
.av .av-ojo{transform-box:fill-box;transform-origin:center;animation:avParp 4s infinite}
.av .av-oi{transform-box:fill-box;transform-origin:50% 100%;animation:avOreja 5s infinite}
.av .av-od{transform-box:fill-box;transform-origin:50% 100%;animation:avOrejaD 5s infinite .1s}
.av .av-flota{animation:avFlota 3s ease-in-out infinite}
.av .av-luz{animation:avLuz 1.6s ease-in-out infinite}
.av .av-mon{transform-box:fill-box;transform-origin:center;animation:avMon 4s infinite}
@keyframes avParp{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes avOreja{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(5deg)}}
@keyframes avOrejaD{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(8deg)}90%{transform:rotate(-5deg)}}
@keyframes avFlota{50%{transform:translateY(-3px)}}
@keyframes avLuz{50%{opacity:.35}}
@keyframes avMon{0%,70%,100%{transform:rotateY(0)}85%{transform:rotateY(180deg)}}
.av[data-pose=saluda] svg{animation:avSaluda 1.1s ease-in-out 2}
.av[data-pose=senala] svg{animation:avSenala 1.1s ease-in-out infinite}
.av[data-pose=piensa] svg{animation:avPiensa 2s ease-in-out infinite}
.av[data-pose=festeja] svg{animation:avFesteja .8s ease-out 2}
.av[data-pose=pulgar] svg{animation:avPulgar .9s ease-out}
@keyframes avBadge{from{transform:scale(0)}}
@keyframes avSaluda{0%,100%{rotate:0deg}25%{rotate:-12deg}75%{rotate:12deg}}
@keyframes avSenala{50%{translate:4px 0}}
@keyframes avPiensa{50%{rotate:-8deg;translate:0 -2px}}
@keyframes avFesteja{30%{translate:0 -10px;scale:1.08}60%{translate:0 0}}
@keyframes avPulgar{40%{scale:1.15}}
.guia-cara .av{width:20px;height:20px;color:#fff}
.guia-cara.claro-av{background:#F4EEFF}.guia-cara.claro-av .av{width:26px;height:26px}
.robot-globo .g-fila{display:flex;align-items:flex-start;gap:10px}
.robot-globo .g-fila p{margin:0}
.robot-globo .g-av{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;padding:6px;box-sizing:border-box}
.robot-globo .g-av.av-pixel,.robot-globo .g-av.av-asesor,.robot-globo .g-av.av-conejo,.robot-globo .g-av.av-moneda{background:#F4EEFF;padding:2px}
.robot-globo.explica{max-width:min(320px,calc(100vw - 100px));cursor:default}
.robot-globo .g-acc{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.robot-globo .g-acc button{border:0;border-radius:12px;padding:9px 12px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;background:var(--card3);color:var(--ink)}
.robot-globo .g-acc button + button{background:var(--grad);color:#fff}
.robot,.robot-globo{transition:bottom .2s ease}
.ia-fila{display:flex;align-items:flex-end;gap:8px;max-width:100%}
.ia-fila .ia-b{min-width:0}
.ia-cara{width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;padding:5px;box-sizing:border-box;margin-bottom:2px}
.ia-cara.claro-av{background:#F4EEFF;padding:1px}
.ia-cab-av .av{width:20px;height:20px;color:#fff}
.ia-cab-av.claro-av{background:#F4EEFF!important}.ia-cab-av.claro-av .av{width:30px;height:30px}
.s-pregunta{display:flex;flex-direction:column;gap:12px;margin-top:auto}
/* 2.0.1: las preguntas, una arriba de la otra (la más usada abajo), cada una unida con una línea a la barra */
.s-chips{position:relative;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:9px;padding-left:40px}
.s-chips::before{content:'';position:absolute;left:17px;top:22px;bottom:-14px;width:2px;border-radius:2px;background:var(--violet2);opacity:.75}
.s-chips::after{content:'';position:absolute;left:13px;bottom:-19px;width:10px;height:10px;border-radius:50%;background:var(--violet)}
.s-q{position:relative;display:flex;max-width:100%}
.s-q::before{content:'';position:absolute;left:-23px;top:50%;width:23px;height:2px;margin-top:-1px;background:var(--violet2);opacity:.75}
.s-q::after{content:'';position:absolute;left:-27px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--violet)}
.s-chips button{flex:none;max-width:100%;border:1.5px solid var(--borde);background:var(--card);color:var(--ink);border-radius:999px;padding:11px 15px;font:inherit;font-size:15px;font-weight:700;text-align:left;cursor:pointer}
.s-barra{display:flex;align-items:center;gap:12px;width:calc(100% - 62px);min-height:60px;box-sizing:border-box;border:2px solid var(--violet2);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px 8px 18px;font:inherit;font-size:20px;font-weight:800;text-align:left;cursor:pointer}
.s-barra > span{flex:1}
.s-barra svg{color:var(--lilac);flex:none}
.vista:has(> .s-pregunta){min-height:100%;box-sizing:border-box}
body.simple .vista:has(> .s-pregunta){padding-bottom:calc(16px + var(--safe-b))}
.s-av{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;padding:8px;box-sizing:border-box}
.s-av.claro-av{background:#F4EEFF;padding:2px}
.ap-avs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ap-avs button{display:flex;align-items:center;gap:10px;border:2px solid var(--borde);background:var(--card);color:var(--ink);border-radius:16px;padding:10px;font:inherit;text-align:left;cursor:pointer;min-width:0}
.ap-avs button[aria-pressed="true"]{border-color:var(--violet2);background:rgba(124,77,255,.18)}
.ap-avs button span:not(.av){display:flex;flex-direction:column;min-width:0}
.ap-avs b{font-size:14px;font-weight:800}.ap-avs small{font-size:12px;font-weight:600;color:var(--muted)}
.ap-av{width:42px;height:42px;border-radius:50%;background:var(--grad);color:#fff;padding:8px;box-sizing:border-box}
.ap-av.claro-av{background:#F4EEFF;padding:2px}
@media (prefers-reduced-motion: reduce){.av *,.av svg,.av::after{animation:none!important}}
/* 2.0.0 · Deudas y buscador */
.deudas{display:flex;flex-direction:column;gap:10px}
.deu-f{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:16px;padding:12px 14px;background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.35)}
.deu-f span{display:flex;flex-direction:column;gap:2px;min-width:0}
.deu-f small{font-size:13px;font-weight:700;color:var(--amber)}
.deu-f b{font-size:20px;font-weight:900}
.deu-f button{border:0;border-radius:12px;padding:10px 14px;background:var(--amber);color:#2A1A00;font-weight:900;font-size:14px;flex:none;cursor:pointer}
.deu-f.tedeben{background:rgba(63,214,198,.12);border-color:rgba(63,214,198,.4)}
.deu-f.tedeben small{color:var(--tealink)}
html.claro .deu-f button{background:#C46A00;color:#fff}
.cabecera{position:sticky;top:calc(-20px - var(--safe-t));z-index:6;margin:calc(-20px - var(--safe-t)) -18px 0;padding:calc(20px + var(--safe-t)) 18px 8px;background:var(--bg);--pb:0}
.cabecera.compacta{box-shadow:0 8px 18px -12px rgba(0,0,0,.5)}
/* 2.0.1: --pb va de 0 a 1 mientras bajás: la lupa se estira de a poco, siguiendo al dedo */
.cabecera .avatar{max-width:calc((1 - var(--pb)) * 46px);opacity:calc(1 - var(--pb) * 1.6);margin-right:calc(var(--pb) * -12px);overflow:hidden}
.cabecera .saludo{max-width:calc((1 - var(--pb)) * 400px);opacity:calc(1 - var(--pb) * 1.6);margin-right:calc(var(--pb) * -12px);overflow:hidden}
.lupa-ini{flex:var(--pb) 1 auto;height:44px;min-width:44px;border-radius:14px;border:1px solid var(--borde);background:var(--card);color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 11px;font:inherit;font-weight:700;font-size:15px;overflow:hidden;white-space:nowrap;cursor:pointer}
.lupa-ini svg{flex:none;color:var(--lilac)}
.lupa-ini span{max-width:calc(var(--pb) * 240px);opacity:calc(var(--pb) * 2 - 1);color:var(--muted)}
.bus-cab{display:flex;align-items:center;gap:10px}
.bus-bar{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:50px;border-radius:16px;border:2px solid var(--violet2);background:var(--campo);padding:0 14px;color:var(--lilac)}
.bus-bar input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;font-weight:700;outline:none}
.bus-sug{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.bus-sug::-webkit-scrollbar{display:none}
.bus-guia{flex:none;width:156px;min-height:118px;border-radius:18px;border:1px solid var(--borde);background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;text-align:left;font:inherit;cursor:pointer}
.bus-guia .oi{width:34px;height:34px;border-radius:11px;background:var(--card3);display:grid;place-items:center;font-size:18px}
.bus-guia b{font-size:15px;font-weight:800;line-height:1.2}
.bus-guia small{font-size:12.5px;font-weight:600;color:var(--muted)}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.ia-card{border:0;padding:2px;border-radius:20px;background:conic-gradient(from var(--ang),#7C4DFF,#E040A0,#3FD6C6,#FFB547,#7C4DFF);animation:iaGiro 3.2s linear infinite;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
@keyframes iaGiro{to{--ang:360deg}}
.ia-in{display:flex;align-items:center;gap:12px;border-radius:18px;background:var(--card);padding:14px 14px 14px 16px}
.ia-in .oi{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-size:19px;flex:none}
.ia-in > span:nth-child(2){display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.ia-in b{font-size:16px;font-weight:800}.ia-in small{font-size:13px;font-weight:600;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.ia-card{animation:none}}
.ver-app{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}.ver-app small{font-size:11.5px;color:var(--muted);font-weight:600}
.ver-nueva{display:flex;flex-direction:column;line-height:1.25}.ver-nueva small{font-size:11.5px;opacity:.85;font-weight:600}
.mini>*{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0;border:0;text-align:left;color:var(--ink)}
.mini span{font-size:11px;font-weight:700;color:var(--muted)}
.mini b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .efe{background:var(--tealbg)}
.mini .efe span{color:var(--tealink)}
.mini .efe small{font-size:11px;font-weight:700;color:var(--tealink)}

.lista{display:flex;flex-direction:column;gap:8px}
.mov{display:flex;align-items:center;gap:12px;background:transparent;border:0;padding:6px 8px;margin:0 -8px;border-radius:16px;text-align:left;color:var(--ink);width:calc(100% + 16px)}
.mov .ico{width:44px;height:44px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}
.mov .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mov .txt b{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .txt small{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .monto{font-weight:800;font-size:15px;white-space:nowrap}
.mov .monto.pos{color:var(--teal2)}
.esperando{font-size:10px;font-weight:800;color:var(--amber);background:rgba(255,181,71,.14);border-radius:6px;padding:1px 5px;margin-left:4px}

/* ---------- Barra ---------- */
nav.barra{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));height:72px;max-width:536px;margin:0 auto;background:var(--card);border-radius:24px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:5}
nav.barra button{border:0;border-radius:16px;background:transparent;width:60px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--dim)}
nav.barra button[aria-current="page"]{color:var(--lilac);font-weight:800}
nav.barra .mas{width:62px;height:62px;border-radius:50%;margin-top:-36px;background:var(--grad);color:#fff;box-shadow:0 10px 26px rgba(176,71,217,.5)}

/* ---------- Ventanas ---------- */
.fondo{position:fixed;inset:0;background:var(--velo);z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:calc(12px + var(--safe-t)) 10px calc(10px + var(--safe-b))}
.vidrio{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--vidrio);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--borde);border-radius:28px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:13px}
@media (prefers-reduced-motion:no-preference){.vidrio{animation:sube .22s ease-out}@keyframes sube{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}}
.v-cab{display:flex;align-items:center;gap:10px}
.v-cab .ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.v-cab b{font-size:19px;font-weight:800;flex:1}
.cerrar{width:40px;height:40px;border-radius:13px;border:0;background:var(--sutil);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.opcion{display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px;border:0;color:#fff;text-align:left;width:100%}
.opcion .oi{width:48px;height:48px;border-radius:15px;background:rgba(14,11,26,.25);display:flex;align-items:center;justify-content:center;flex:none}
.opcion span{display:flex;flex-direction:column;gap:3px;flex:1}
.opcion b{font-size:17px;font-weight:800}
.opcion small{font-size:13px;font-weight:600}
.caja{display:flex;flex-direction:column;gap:6px;background:var(--campo);border-radius:16px;padding:12px 14px}
.caja div{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--soft)}
.caja .t{color:var(--ink);font-size:15px;font-weight:800;align-items:center}
.caja .t b{font-size:20px}
.efe-nota{font-size:12px;font-weight:700;color:var(--tealink);background:rgba(31,77,71,.6);border-radius:12px;padding:8px 12px}
.efe-nota.mal{color:var(--amber);background:rgba(255,181,71,.14)}
.fijo{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--sutil);background:var(--campo2);border-radius:14px;padding:12px;font-size:16px;font-weight:700;color:var(--ink)}

/* Desplegable propio */
.dd{position:relative}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--borde);background:var(--campo);color:var(--ink);border-radius:14px;padding:12px;font-size:16px;font-weight:700;text-align:left}
.dd-lista{margin-top:6px;background:var(--card2);border:1px solid var(--borde);border-radius:16px;padding:6px;display:flex;flex-direction:column;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.dd-lista button{border:0;background:transparent;color:var(--ink);text-align:left;padding:10px;border-radius:10px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.dd-lista button[aria-selected="true"]{background:var(--violet);font-weight:800}
.combo{display:flex;border:1px solid var(--borde);background:var(--campo);border-radius:14px;overflow:hidden}
.combo input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);padding:12px;font-size:16px;font-weight:600}
.combo input:focus{outline:none}
.combo button{width:48px;border:0;border-left:1px solid var(--borde);background:rgba(124,77,255,.35);color:#fff;display:flex;align-items:center;justify-content:center}

.aviso{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + var(--safe-t));background:var(--ink);color:var(--bg2);padding:11px 16px;border-radius:14px;font-weight:800;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* Perfil */
.fila-p{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--sutil);font-size:14px}
.fila-p:first-of-type{border-top:0}
.fila-p span{color:var(--muted);font-weight:600}
.fila-p b{font-weight:800;text-align:right}
.usr{background:var(--card2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.usr .cab{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.usr .cab b{font-size:15px}
.usr .cab small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
.estado{font-size:11px;font-weight:800;border-radius:8px;padding:3px 8px;white-space:nowrap}
.estado.activo{background:var(--tealbg);color:var(--tealink)}
.estado.pendiente{background:rgba(255,181,71,.16);color:var(--amber)}
.estado.desactivado,.estado.bloq{background:rgba(255,107,129,.14);color:var(--errtxt)}
.acc{display:flex;gap:6px;flex-wrap:wrap}
.acc button{border:0;border-radius:12px;padding:9px 12px;font-weight:800;font-size:13px;background:var(--card3);color:var(--ink)}
.acc button.prim{background:var(--violet);color:#fff}

/* ================= Actualización 2 ================= */
/* Sin barras de desplazamiento */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
/* Sin "tirar para recargar" del navegador */
html,body{overscroll-behavior:none}
#contenido,.pantalla,.vidrio{overscroll-behavior:contain}
/* Sin seleccionar texto (y sin búsqueda de Google al mantener apretado) */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

/* Animación al tocar: se hunde, se tiñe de lila suave (nunca gris) y una luz donde está el dedo */
button{position:relative;overflow:hidden;transition:scale .14s ease;-webkit-tap-highlight-color:transparent}
button::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .2s ease;
  background:radial-gradient(circle at var(--x,50%) var(--y,50%),var(--toque1) 0,var(--toque2) 34px,rgba(124,77,255,0) 80px),
             radial-gradient(farthest-side,var(--toque3) 0,var(--toque4) 100%)}
button.toque{scale:.965}
button.toque::after{opacity:1;transition:opacity .04s}
button.toque-fuera::after{opacity:.5;transition:opacity .12s}
button:disabled::after{display:none}
#patronSvg button::after{display:none}

/* Fecha: botón + Hoy / Ayer */
.fecha-fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.fecha-fila .dd-btn{justify-content:flex-start;gap:10px}
.fecha-fila .dd-btn svg{color:var(--lilac);flex:none}
.fecha-fila .dd-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fecha-fila .segm{padding:3px}
.fecha-fila .segm button{flex:none;padding:8px 13px}

/* Calendario propio */
#cal{z-index:20;align-items:center}
.cal{max-width:380px;gap:12px}
.cal-sel{font-size:13px;font-weight:700;color:var(--muted)}
.cal-sel b{display:block;font-size:22px;color:var(--ink);margin-top:2px;font-weight:800}
.cal-cab{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-cab b{font-size:17px;font-weight:800}
.cal-cab button{width:44px;height:44px;border-radius:14px;border:0;background:var(--sutil);color:var(--ink);display:flex;align-items:center;justify-content:center}
.cal-sem,.cal-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-sem span{font-size:12px;font-weight:800;color:var(--muted);padding:4px 0}
.cal-dias button{aspect-ratio:1;border:0;border-radius:12px;background:transparent;color:var(--ink);font-size:15px;font-weight:700;padding:0}
.cal-dias button.hoy{box-shadow:inset 0 0 0 2px var(--violet2);color:var(--lilac)}
.cal-dias button[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:none}
.cal-pie{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cal-pie .btn{padding:12px 8px;font-size:15px}

/* Deslizar para actualizar */
#ptr{position:fixed;left:50%;top:calc(10px + var(--safe-t));transform:translate(-50%,-90px);z-index:8;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;opacity:0}
#ptr .c{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(176,71,217,.5)}
#ptr small{font-size:12px;font-weight:800;background:var(--card2);color:var(--lilac);padding:5px 11px;border-radius:12px;white-space:nowrap}
#ptr.vuelve{transition:transform .25s ease,opacity .25s ease}
#ptr .giro{display:flex}
#ptr.girando .c svg{animation:gira .75s linear infinite}
@keyframes gira{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* Versión nueva */
.novedad{display:flex;align-items:center;gap:10px;background:rgba(124,77,255,.18);border:1px solid rgba(155,107,255,.45);color:var(--lilac);border-radius:16px;padding:10px 14px;font-size:13px;font-weight:700;width:100%;max-width:380px;text-align:left}
.novedad svg{flex:none}
.novedad b{color:var(--ink);font-weight:800}

/* ================= Actualización 3 ================= */
/* Gráficos: anillo, resaltar una categoría */
.arco{transition:opacity .25s ease,stroke-width .25s ease;cursor:pointer}
svg.resaltando .arco{opacity:.22}
svg.resaltando .arco.activo{opacity:1;stroke-width:22}
.cc-grande,.cc-chico{transition:opacity .3s ease}
/* Chips de categoría: grandes, con monto y % */
.leg-it{border:0;background:transparent;color:var(--ink);font:inherit;display:flex;align-items:center;gap:8px;text-align:left;padding:0;min-width:0}
.leg-it i{width:10px;height:10px;border-radius:50%;flex:none}
.leg-it .n{font-weight:700}
.leg-it .m{font-weight:700;color:var(--soft)}
.leg-it b{font-weight:900}
.cats .leg-it,.tarj-cat.abierta .leg-it{background:var(--card2);border-radius:22px;padding:9px 14px;font-size:15px;gap:7px;flex:none;white-space:nowrap;max-width:100%}
.cats .leg-it .n,.tarj-cat.abierta .leg-it .n{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cats .leg-it[aria-pressed="true"],.tarj-cat.abierta .leg-it[aria-pressed="true"]{background:var(--ink);color:var(--bg2)}
.cats .leg-it[aria-pressed="true"] .m,.tarj-cat.abierta .leg-it[aria-pressed="true"] .m{color:var(--card3)}
.cats .leg-it .m::before,.tarj-cat.abierta .leg-it .m::before{content:'· '}
.cats .leg-it b::before,.tarj-cat.abierta .leg-it b::before{content:'· ';font-weight:700}
/* Tarjeta "Por categoría" de Inicio: chica / agrandada */
.tarj-cat{cursor:pointer}
.tarj-cat h2{display:flex;align-items:center;justify-content:space-between}
.tarj-cat .expandir{width:34px;height:34px;border-radius:11px;background:var(--card2);color:var(--lilac);display:flex;align-items:center;justify-content:center;transition:transform .8s ease}
.tarj-cat.abierta .expandir{transform:rotate(180deg)}
.cat-cuerpo{display:flex;align-items:center;gap:16px}
.cat-graf{flex:none;display:flex;justify-content:center}
.cat-graf svg{width:118px;height:118px;display:block}
.cat-ley{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;font-size:13px}
.tarj-cat:not(.abierta) .leg-it{width:100%}
.tarj-cat:not(.abierta) .leg-it .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tarj-cat:not(.abierta) .leg-it .m{display:none}
.tarj-cat .arco,.tarj-cat .base{stroke-width:28;transition:stroke-width .8s ease,opacity .25s ease}
.tarj-cat.abierta .cat-cuerpo{flex-direction:column;gap:16px}
.tarj-cat.abierta .cat-graf svg{width:220px;height:220px}
.tarj-cat.abierta .cat-ley{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px}
.tarj-cat.abierta .arco,.tarj-cat.abierta .base{stroke-width:15}
.tarj-cat.abierta svg.resaltando .arco.activo{stroke-width:22}
.tarj-cat:not(.abierta) .cc-grande{opacity:0}
.tarj-cat.abierta .cc-chico{opacity:0}
.tarj-cat.animando{transition:height .8s cubic-bezier(.33,.9,.3,1);overflow:hidden}
.tarj-cat.animando .cat-graf svg{transition:transform .8s cubic-bezier(.33,.9,.3,1)}
.tarj-cat.animando .leg-it{transition:transform .8s cubic-bezier(.33,.9,.3,1),opacity .55s ease .2s}
.ayuda-toca{font-size:12px;font-weight:700;color:var(--muted);text-align:center;margin-top:10px}
.tarj-cat.abierta .ayuda-toca{margin-top:14px}
/* Tarjetas tipo acordeón al llegar arriba o abajo */
.vista>*{will-change:auto}
.vista.estirando>*{transition:none!important}
.vista.volviendo>*{transition:transform .5s cubic-bezier(.25,1.45,.45,1)}
/* Interruptor (letra grande) */
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:var(--card);border-radius:22px;padding:16px;color:var(--ink);text-align:left}
.interruptor span{display:flex;flex-direction:column;gap:3px}
.interruptor b{font-size:16px;font-weight:800}
.interruptor small{font-size:12px;font-weight:600;color:var(--muted)}
.switch{width:52px;height:30px;border-radius:15px;background:var(--card3);position:relative;flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.interruptor[aria-checked="true"] .switch{background:var(--violet)}
.interruptor[aria-checked="true"] .switch::after{transform:translateX(22px)}
/* Letra grande: agranda todo un 15% */
.vista,.vidrio,.login-box,#patron>*{zoom:var(--zoom,1)}
nav.barra{zoom:var(--zoomnav,1)}
/* Apariencia */
.ap-ejemplo{background:var(--campo);border:1px solid var(--borde);border-radius:16px;padding:12px 14px}
.ap-ejemplo small{font-size:12px;font-weight:700;color:var(--muted)}
.ap-ejemplo p{margin:6px 0 0;font-size:17px;font-weight:600;line-height:1.45;color:var(--ink)}
.ap-tam{display:flex;align-items:center;gap:12px;background:var(--campo);border:1px solid var(--borde);border-radius:16px;padding:8px 14px}
.ap-tam .a1{font-size:14px;font-weight:800;color:var(--muted)}
.ap-tam .a2{font-size:26px;font-weight:800;color:var(--muted)}
.ap-tam input{flex:1;accent-color:var(--violet);height:34px;margin:0}
.ap-fuentes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ap-fuentes button{border:2px solid var(--borde);background:var(--campo);color:var(--ink);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
.ap-fuentes button b{font-size:24px;font-weight:700;line-height:1.1}
.ap-fuentes button small{font-size:12px;color:var(--muted);font-family:var(--font)}
.ap-fuentes button[aria-pressed="true"]{border-color:var(--violet);background:rgba(124,77,255,.16)}
.campo>b{color:var(--acento)}

/* ================= Actualización 4 ================= */
/* Mes tocable (Personal / Negocio) y calendario con meses y años */
.per-btn{border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:800;padding:9px 12px;border-radius:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.per-btn svg{color:var(--lilac)}
.nav-per .per-btn{width:auto;height:44px;background:transparent;padding:0 12px}
.cal-tit{border:0;background:var(--sutil);color:var(--ink);font-size:17px;font-weight:800;padding:9px 14px;border-radius:12px;display:flex;align-items:center;gap:6px}
.cal-tit svg{color:var(--lilac)}
.cal-cab .cal-tit{width:auto;height:44px;white-space:nowrap}
.cal-grilla{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cal-grilla button{border:0;border-radius:14px;background:var(--sutil);color:var(--ink);font-size:16px;font-weight:800;padding:16px 0}
.cal-grilla button.hoy{box-shadow:inset 0 0 0 2px var(--violet2);color:var(--lilac)}
.cal-grilla button[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:none}
/* Avatar tocable */
button.avatar{border:0;padding:0}
/* Últimos gastos: Consultar todos */
.h2-link{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ver-todos{border:0;background:transparent;color:var(--lilac);font-size:14px;font-weight:800;padding:6px 8px;border-radius:10px;display:flex;align-items:center;gap:2px}
/* Pantalla "Todos los movimientos" */
.titulo-todos{display:flex;align-items:center;gap:10px}
.titulo-todos h1{margin:0;font-size:22px;font-weight:900}
.volver{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.buscar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--borde);border-radius:16px;padding:0 14px;color:var(--muted)}
.buscar input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:600;padding:13px 0}
.buscar input:focus{outline:none}
.buscar:focus-within{border-color:var(--violet2);box-shadow:0 0 0 3px rgba(124,77,255,.3)}
.filtro-tipo{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filtro-tipo button{flex:none;border:1px solid var(--borde);border-radius:20px;padding:8px 13px;background:transparent;color:var(--soft);font-weight:700;font-size:13px}
.filtro-tipo button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:800}
.fecha-grupo{margin:0 0 6px;font-size:15px;font-weight:800;color:var(--soft)}
/* Detalle de un gasto */

function nuevoId() { return (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).slice(0, 14); }

function encolar(op) {
  op.opId = nuevoId();

  S.cola.push(op); guardarCola();

function encolarVarios(ops) {

function aplicarLocal(op) {

  const ajena = S.ajenos.some(f => f.id === op.id) || (!S.yo.admin && op.tipo === 'guardar' && op.datos && op.datos.negocio && op.datos.negocio !== S.yo.negocio && !S.negocio.some(f => f.id === op.id));

  const previo = i >= 0 ? lista[i] : null;
  const base = { id: op.id, usuario: previo ? previo.usuario : S.yo.usuario,
    negocio: previo ? previo.negocio : (op.datos.negocio || S.yo.negocio), cargado: previo ? previo.cargado : new Date().toISOString() };

let timerSync = null;
async function sincronizar() {
  if (!S.token || S.sincronizando) return false;
  if (!navigator.onLine) { pintarSync(); return false; }
  S.sincronizando = true; pintarSync();
  const enviadas = S.cola.slice();
  let bien = false;
  try {
    const modoPend = LS.get(kModoPend(), '');
    const modoAntes = modoActual();
    const prefsPend = S.yo && S.yo.usuario ? LS.get(kPrefsPend(), {}) : {};
    const r = await api({ accion: 'sync', token: S.token, ops: enviadas, modo: modoPend || undefined, prefs: Object.keys(prefsPend).length ? prefsPend : undefined });
    if (r.yo && r.yo.prefs) {
      // Solo se dan por guardadas las preferencias que se mandaron; si mientras tanto elegiste otra, queda pendiente y gana
      const ahora = LS.get(kPrefsPend(), {});
      Object.keys(prefsPend).forEach(k => { if (ahora[k] === prefsPend[k]) delete ahora[k]; });
      LS.set(kPrefsPend(), ahora);
      LS.set('bd_prefs_' + r.yo.usuario, Object.assign({}, r.yo.prefs, ahora));
    }
    if (modoPend && r.yo && r.yo.modo === modoPend) LS.del(kModoPend()); // queda pendiente hasta que Google lo guarde
    if (r.yo && r.yo.modo) LS.set(kModo(), r.yo.modo);
    const procesadas = new Set((r.resultados || []).map(x => x.opId));
    const fallas = (r.resultados || []).filter(x => !x.ok);
    S.cola = S.cola.filter(o => !procesadas.has(o.opId)); guardarCola();
    // Lo que Google rechazó NO se pierde: queda en el celular, marcado en rojo, para corregirlo o borrarlo.
    let rechazados = 0;
    fallas.forEach(x => {
      const op = enviadas.find(o => o.opId === x.opId);
      if (!op || op.tipo !== 'guardar') return;
      S.rech = S.rech.filter(z => z.op.id !== op.id);
      S.rech.push({ op, error: x.error || 'Algo salió mal.' });
      rechazados++;
    });
    guardarRech();
    S.yo = r.yo; S.listas = Object.assign({}, LISTAS_BASE, r.listas); S.personal = r.personal; S.negocio = r.negocio; S.ajenos = r.ajenos || [];
    S.pendientes = r.pendientes || 0; S.catNuevas = r.catNuevas || []; S.ultimaSync = Date.now();
    if (typeof pintarRobot === 'function' && $('robot')) pintarRobot();
    if (typeof aplicarApariencia === 'function') aplicarApariencia();
    if (modoActual() !== modoAntes) { aplicarModo(); if (!$('app').hidden) { S.flujo = null; S.vista = 'inicio'; } }
    S.rech.forEach(z => aplicarLocal(z.op));
    S.cola.forEach(aplicarLocal);
    guardarEstado();
    if (rechazados) avisar(rechazados === 1 ? 'Un gasto no se pudo subir: quedó marcado en rojo para corregirlo.' : rechazados + ' gastos no se pudieron subir: quedaron marcados en rojo.');
    bien = true;

const PUNTOS = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => ({ x: 50 + (i % 3) * 100, y: 50 + Math.floor(i / 3) * 100 }));
const P = { modo: '', primero: '', fallos: 0, trazo: [], dibujando: false, pos: null };
async function sha(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function iniciarPatron(modo) {
  P.modo = modo; P.primero = ''; P.fallos = 0; P.trazo = [];
  mostrar('patron');
  $('patAvatar').textContent = iniciales(S.yo && S.yo.nombre);
  $('patOlvide').hidden = modo !== 'abrir';
  textoPatron();
  pintarPatron();
}
function textoPatron(extra) {
  const t = { crear: ['Creá tu patrón', 'Uní al menos 4 puntos. Lo vas a usar cada vez que abras la app.'],
    confirmar: ['Repetí el patrón', 'Dibujalo de nuevo para confirmar.'],
    abrir: ['Dibujá tu patrón', 'Hola, ' + primerNombre(S.yo && S.yo.nombre) + '.'] }[P.modo];
  $('patTitulo').textContent = t[0];
  $('patAyuda').textContent = extra || t[1];
}
function pintarPatron(error) {
  const svg = $('patronSvg');
  const col = error ? 'var(--red)' : 'var(--c3)';
  let h = '';
  if (P.trazo.length) {
    const pts = P.trazo.map(i => PUNTOS[i].x + ',' + PUNTOS[i].y);
    if (P.dibujando && P.pos) pts.push(P.pos.x + ',' + P.pos.y);
    h += `<polyline points="${pts.join(' ')}" fill="none" style="stroke:${col}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
  }
  PUNTOS.forEach((p, i) => {
    const on = P.trazo.includes(i);
    h += `<circle cx="${p.x}" cy="${p.y}" r="30" fill="${on ? 'rgba(124,77,255,.25)' : 'transparent'}"/>`;
    h += `<circle cx="${p.x}" cy="${p.y}" r="${on ? 13 : 9}" style="fill:${on ? col : 'var(--patpunto)'}"/>`;
  });
  svg.innerHTML = h;
  svg.classList.toggle('puntos-error', !!error);
}
function posPatron(ev) {
  const r = $('patronSvg').getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * 300, y: (ev.clientY - r.top) / r.height * 300 };
}
function tocarPunto(pos) {
  PUNTOS.forEach((p, i) => {
    if (!P.trazo.includes(i) && Math.hypot(p.x - pos.x, p.y - pos.y) < 34) P.trazo.push(i);
  });
}
$('patronSvg').addEventListener('pointerdown', ev => {
  ev.preventDefault(); $('patronSvg').setPointerCapture(ev.pointerId);
  P.dibujando = true; P.trazo = []; P.pos = posPatron(ev); tocarPunto(P.pos); pintarPatron();
});
$('patronSvg').addEventListener('pointermove', ev => {
  if (!P.dibujando) return; P.pos = posPatron(ev); tocarPunto(P.pos); pintarPatron();
});
const finPatron = async () => {
  if (!P.dibujando) return;
  P.dibujando = false; P.pos = null;
  const codigo = P.trazo.join('');
  if (P.trazo.length < 4) { textoPatron('Uní al menos 4 puntos.'); pintarPatron(true); return setTimeout(() => { P.trazo = []; pintarPatron(); }, 700); }
  const clave = 'bd_patron_' + S.yo.usuario;
  if (P.modo === 'crear') { P.primero = codigo; P.modo = 'confirmar'; P.trazo = []; textoPatron(); pintarPatron(); return; }
  if (P.modo === 'confirmar') {
    if (codigo !== P.primero) { P.modo = 'crear'; textoPatron('No coincidieron. Empezá de nuevo.'); pintarPatron(true); return setTimeout(() => { P.trazo = []; pintarPatron(); }, 700); }
    LS.set(clave, await sha(S.yo.usuario + ':' + codigo));
    return bienvenida();
  }
  if (await sha(S.yo.usuario + ':' + codigo) === LS.get(clave, '')) { P.fallos = 0; return bienvenida(); }
  P.fallos++;
  pintarPatron(true);
  if (P.fallos >= 3) return setTimeout(() => cerrarSesionLocal('Te equivocaste 3 veces de patrón. Entrá con tu usuario y contraseña.'), 600);
  textoPatron('Patrón incorrecto. Te ' + (3 - P.fallos === 1 ? 'queda 1 intento.' : 'quedan ' + (3 - P.fallos) + ' intentos.'));
  setTimeout(() => { P.trazo = []; pintarPatron(); }, 700);
};
$('patronSvg').addEventListener('pointerup', finPatron);

async function accionCat(que, i, btn) {
  const c = (S.catNuevas || [])[i]; if (!c) return;

  if (que === 'no') { S.catConf = ''; return render(); }
  if (!navigator.onLine) return avisar('Para esto hace falta internet.');
  const nuevo = que === 'guardar' ? String(($('catEdIn') || {}).value || '').trim() : '';
  if (que === 'guardar' && !nuevo) return avisar('Escribí el nombre.');
  const listo = cargando(btn, '…');
  try {
    await api({ accion: 'categoria', token: S.token, que: que === 'guardar' ? 'renombrar' : que, lista: c.lista, nombre: c.nombre, nuevo });
    S.catEdit = ''; S.catConf = '';

}

const L_PER = 'Categorías personales', L_GEN = 'Categorías gastos generales';

const enListaCat = (l, c) => listaCat(l).find(x => x.toLowerCase() === String(c || '').trim().toLowerCase());
function catFinal(lista, cat, nueva) {
  if (cat !== 'Otros' || !lleno(nueva)) return cat;
  let n = String(nueva).trim().replace(/\s+/g, ' ').slice(0, 40);

function separarCat(lista, cat) { return !cat || enListaCat(lista, cat) ? { categoria: cat || '', catNueva: '' } : { categoria: 'Otros', catNueva: cat }; }
function catNuevaHTML(f) {

async function sugerirCat(btn) {
  const f = S.form; if (!f) return;
  leerCampos();
  const texto = String(f.catNueva || '').trim();
  if (!texto) return errorForm('Escribí primero qué fue (por ejemplo: Farmacia) y después tocá Sugerir.');
  if (!navigator.onLine) return errorForm('Para sugerir hace falta internet. Podés escribir el nombre vos.');
  const lista = f.hoja === 'personal' ? L_PER : L_GEN;
  const listo = cargando(btn, '…');
  try {
    const pedido = `Categorías que ya existen: ${listaCat(lista).filter(c => c !== 'Otros').join(', ')}.\nUn gasto fue: "${texto}".\nRespondé SOLO con el nombre de una categoría general, en español, de 1 a 3 palabras, sin punto ni comillas. Si encaja en una que ya existe, usá exactamente ese nombre. Si no, proponé una nueva y general (por ejemplo, "Farmacia" → "Salud").`;
    const r = await api({ accion: 'ia', token: S.token, mensajes: [{ rol: 'yo', txt: pedido }], manual: 'Tarea: sugerir el nombre de una categoría de gasto.', contexto: '' });
    let n = String(r.respuesta || '').split('\n')[0].replace(/["'«»“”.*_`]/g, '').trim().slice(0, 40);

}

/* =========================================================

function cargarXLSX() {
  return new Promise((ok, mal) => {
    if (window.ExcelJS) return ok();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    s.onload = ok; s.onerror = () => mal(new Error('Para descargar el Excel la primera vez necesitás internet.'));
    document.head.appendChild(s);
  });
}

/* =========================================================
   Animación al tocar: se hunde, se oscurecen los bordes y
   una luz sigue al dedo. Si sacás el dedo del botón, no se toca.
   ========================================================= */
let toque = null, cancelado = null;
// La luz sigue al dedo todo el tiempo. Si el dedo sale del botón, la luz queda en el borde más cercano (más suave)
// y el botón deja de estar "hundido": al soltar afuera, no se toca.
function moverToque(x, y) {
  const b = toque.b, r = b.getBoundingClientRect();
  const dentro = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  toque.dentro = dentro;
  b.style.setProperty('--x', (Math.min(Math.max(x, r.left), r.right) - r.left) + 'px');
  b.style.setProperty('--y', (Math.min(Math.max(y, r.top), r.bottom) - r.top) + 'px');
  b.classList.toggle('toque', dentro && !toque.scroll);
  b.classList.toggle('toque-fuera', !dentro || !!toque.scroll);
}
function soltarToque(cancelar) {
  if (!toque) return;
  const b = toque.b, falta = Math.max(0, 140 - (Date.now() - toque.t));
  if (cancelar) cancelado = { b, t: Date.now() };
  toque = null;
  const fin = () => b.classList.remove('toque', 'toque-fuera');
  if (cancelar) fin(); else setTimeout(fin, falta);

// Un gesto (deslizar la pantalla, tirar para actualizar) anula el toque pero la luz sigue al dedo hasta soltar
function anularToque() { if (toque) { toque.scroll = true; toque.b.classList.remove('toque'); toque.b.classList.add('toque-fuera'); } }
document.addEventListener('pointerdown', e => {
  cancelado = null;
  const b = e.target.closest && e.target.closest('button');
  if (!b || b.disabled) return;
  toque = { b, t: Date.now(), id: e.pointerId, tipo: e.pointerType, dentro: true, scroll: false };
  moverToque(e.clientX, e.clientY);
}, true);
// Mouse / lápiz
document.addEventListener('pointermove', e => { if (toque && toque.tipo !== 'touch' && e.pointerId === toque.id) moverToque(e.clientX, e.clientY); }, true);
document.addEventListener('pointerup', e => { if (!toque || toque.tipo === 'touch' || e.pointerId !== toque.id) return; moverToque(e.clientX, e.clientY); soltarToque(!toque.dentro); }, true);
// Dedo: el celular sigue mandando el movimiento aunque la pantalla se deslice
document.addEventListener('pointercancel', e => { if (!toque) return; if (toque.tipo === 'touch') anularToque(); else soltarToque(true); }, true);
document.addEventListener('touchmove', e => { if (toque && toque.tipo === 'touch' && e.touches[0]) moverToque(e.touches[0].clientX, e.touches[0].clientY); }, { capture: true, passive: true });
const finDedo = e => {
  if (!toque || toque.tipo !== 'touch') return;
  const t = e.changedTouches && e.changedTouches[0];
  if (t) moverToque(t.clientX, t.clientY);
  soltarToque(!toque.dentro || toque.scroll);

document.addEventListener('touchend', finDedo, { capture: true, passive: true });
document.addEventListener('touchcancel', finDedo, { capture: true, passive: true });
document.addEventListener('click', e => {
  if (cancelado && Date.now() - cancelado.t < 1000 && cancelado.b.contains(e.target)) { e.preventDefault(); e.stopImmediatePropagation(); }
  cancelado = null;
}, true);

/* =========================================================
   Deslizar hacia abajo para actualizar (sin recargar la app)
   ========================================================= */
const PTR = { y0: null, dist: 0, activo: false, ocupado: false };
const UMBRAL = 72;
function ptrPintar(dist, texto) {
  const el = $('ptr');
  el.classList.remove('vuelve');
  el.style.opacity = Math.min(1, dist / 40);
  el.style.transform = `translate(-50%, ${dist - 60}px)`;
  el.querySelector('.giro').style.transform = `rotate(${Math.round(dist * 3.3)}deg)`;
  el.querySelector('small').textContent = texto || (dist >= UMBRAL ? 'Soltá para actualizar' : 'Deslizá para actualizar');
}
function ptrOcultar() {
  const el = $('ptr');
  el.classList.add('vuelve'); el.classList.remove('girando');
  el.style.opacity = 0; el.style.transform = 'translate(-50%,-90px)';
}
const esperar = ms => new Promise(r => setTimeout(r, ms));
async function ptrActualizar() {
  PTR.ocupado = true;
  const el = $('ptr');
  el.classList.add('vuelve'); ptrPintar(UMBRAL, navigator.onLine ? 'Actualizando…' : 'Sin internet'); el.classList.add('vuelve');
  if (navigator.onLine) {
    el.classList.add('girando');
    const t0 = Date.now();
    let bien = await sincronizar();
    while (S.sincronizando) { await esperar(150); bien = true; }
    await esperar(Math.max(0, 1000 - (Date.now() - t0))); // que se vea girar al menos un segundo
    el.classList.remove('girando');
    el.querySelector('small').textContent = bien ? (S.cola.length ? 'Quedan gastos sin subir' : 'Todo actualizado ✓') : 'No se pudo conectar';
  }
  await esperar(900);
  ptrOcultar(); PTR.ocupado = false;

/* Acordeón: al llegar arriba o abajo, se abre un poco el espacio entre las tarjetas de ese lado */
function estirar(dist, lado) {
  const vista = document.querySelector('#contenido .vista'); if (!vista) return;
  const hijos = [...vista.children], n = hijos.length;
  vista.classList.remove('volviendo'); vista.classList.add('estirando');
  hijos.forEach((h, k) => {
    const off = lado === 'arriba' ? dist * 0.45 * (1 - Math.pow(0.55, k + 1)) : -dist * 0.45 * (1 - Math.pow(0.55, n - k));
    h.style.transform = `translateY(${off.toFixed(1)}px)`;
  });
}
function soltarEstirar() {
  const vista = document.querySelector('#contenido .vista'); if (!vista) return;
  vista.classList.remove('estirando'); vista.classList.add('volviendo');
  [...vista.children].forEach(h => { h.style.transform = ''; });
  setTimeout(() => vista.classList.remove('volviendo'), 550);
}
(function () {
  const cont = $('contenido');
  const G = { y0: null, lado: '', activo: false, dist: 0 };
  cont.addEventListener('touchstart', e => {
    G.activo = false; G.dist = 0; G.lado = '';
    if (e.touches.length !== 1) { G.y0 = null; return; }
    G.y0 = e.touches[0].clientY;
    G.arriba = cont.scrollTop <= 0;
    G.abajo = cont.scrollTop + cont.clientHeight >= cont.scrollHeight - 2;
  }, { passive: true });
  cont.addEventListener('touchmove', e => {
    if (G.y0 === null) return;
    const dy = e.touches[0].clientY - G.y0;
    const lado = dy > 0 && G.arriba && cont.scrollTop <= 0 ? 'arriba' : dy < 0 && G.abajo && cont.scrollTop + cont.clientHeight >= cont.scrollHeight - 2 ? 'abajo' : '';
    if (!lado) { if (G.activo) { soltarEstirar(); if (G.lado === 'arriba') ptrOcultar(); } G.activo = false; return; }
    if (!G.activo && Math.abs(dy) > 12) { G.activo = true; G.lado = lado; anularToque(); }
    if (!G.activo) return;
    G.dist = Math.min(Math.abs(dy) * 0.5, 110);
    estirar(G.dist, lado);
    if (lado === 'arriba' && !PTR.ocupado) ptrPintar(G.dist);
  }, { passive: true });
  const fin = () => {
    G.y0 = null;
    if (!G.activo) return;
    G.activo = false; soltarEstirar();
    if (G.lado === 'arriba' && !PTR.ocupado) { if (G.dist >= UMBRAL) ptrActualizar(); else ptrOcultar(); }
  };
  cont.addEventListener('touchend', fin);
  cont.addEventListener('touchcancel', fin);
})();

/* =========================================================
   Botón "atrás" del celular: cierra lo que está abierto
   (calendario, ventana, o vuelve a Inicio) en vez de salir de la app
   ========================================================= */
// Mientras haya algo abierto, se deja UNA "marca" en el historial. Atrás la consume y cierra lo de arriba.
const HIST = { guarda: false, ignorar: 0, t: null };
const algoAbierto = () => !$('cal').hidden || !$('modal').hidden || (!$('app').hidden && S.vista !== 'inicio');
function histRevisar() {
  clearTimeout(HIST.t);
  HIST.t = setTimeout(() => {
    const hace = algoAbierto();
    try {
      if (hace && !HIST.guarda) { history.pushState({ billetera: 1 }, ''); HIST.guarda = true; }
      else if (!hace && HIST.guarda) { HIST.guarda = false; HIST.ignorar++; history.back(); }
    } catch (e) {}
  }, 80);
}
window.addEventListener('popstate', () => {
  if (HIST.ignorar > 0) { HIST.ignorar--; return; }
  HIST.guarda = false;
  if (!$('cal').hidden) cerrarCal(true);
  else if (!$('modal').hidden) cerrarModal(true);
  else if (!$('app').hidden && S.vista === 'flujo' && S.flujo && S.flujo.i > 0) { S.flujo.i--; render(); }
  else if (!$('app').hidden && S.vista === 'flujo' && S.flujo && S.flujo.menu) { S.menu = S.flujo.menu; S.flujo = null; irA('menu', true); }
  else if (!$('app').hidden && S.vista !== 'inicio') { if (S.vista === 'flujo') S.flujo = null; irA('inicio', true); }
  histRevisar();
});

function guardarFlujo() {

    if (saleEfectivo > ef) return avisoEfectivoSimple(saleEfectivo, ef);

  if (fl.volver) { const v = fl.volver; v.i = pasosFl(v).length - 1; S.flujo = v; $('contenido').scrollTop = 0; return render(); }
  S.flujo = null; irA('inicio');
}

function refrescarDetalle() {
  const d = S.detalle; if (!d) return;
  const fila = d.h === 'negocio' ? filaPorId(d.id) : S.personal.find(f => f.id === d.id); if (!fila) return;
