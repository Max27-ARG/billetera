// "Corregir" en el modo simple: vuelve a las mismas preguntas, con lo que ya estaba cargado
function corregirSimple() {
  const det = S.detalle; if (!det) return;
  const f = det.h === 'negocio' ? filaPorId(det.id) : S.personal.find(x => x.id === det.id); if (!f) return;
  if (det.h === 'negocio' && !puedeCambiar(f)) return avisar('Esto lo cargó ' + f.usuario + ': solo esa persona o el admin lo pueden cambiar.');
  const base = { editId: f.id, fechaOrig: f.fecha, viajeOrig: f.viaje, pedirInicial: false, sinControl: false };
  const s = v => String(v == null ? '' : v);
  if (det.h === 'personal') return iniciarFlujo(f.origen === 'Personal' ? 'personal' : 'usar', Object.assign(base, { d: { fecha: f.fecha, ...separarCat(L_PER, f.categoria), monto: s(f.monto), pago: f.pago, devolver: f.devolver === 'sí' ? 'sí' : '', descripcion: f.descripcion || '' } }));
  if (f.tipo === 'Inversión') return iniciarFlujo('compra', Object.assign(base, { d: { fecha: f.fecha, descripcion: f.descripcion, unidades: s(f.unidades), monto: s(f.monto), pago: f.pago, efeParte: s(f.efeParte), extra: Number(f.recargo) ? 'Sí' : 'No', recPesos: Number(f.recargo) ? s(f.recargo) : '' } }));
  if (f.tipo === 'No reversible') { const enLista = (S.listas['Descripciones rápidas'] || []).includes(f.descripcion); return iniciarFlujo('viaje', Object.assign(base, { d: { fecha: f.fecha, plataDe: 'Negocio', que: enLista ? f.descripcion : 'Otra cosa', otro: enLista ? '' : (f.descripcion || f.categoria), monto: s(f.monto), pago: f.pago } })); }
  if (f.tipo === 'Cambio' && f.grupo) {
    const filas = grupoFilas(f.grupo).filter(x => x.tipo === 'Cambio'), otra = filas.find(x => x.id !== f.id);
    // Con más de dos negocios se corrige en la ventana completa
    if (filas.length !== 2 || !otra) return formNegocio(f);
    const redC = redondeoDeNota(notaCambio(f));
    return iniciarFlujo('cambio', Object.assign(base, { negocio: f.negocio, grupo: f.grupo, d: { fecha: f.fecha, conOtro: 'Sí', otro: otra.negocio, monto: s(f.monto), montoOtro: s(otra.monto), recibido: s(r2(Number(f.recibido) + Number(otra.recibido))), quien: 'mano', miParte: s(f.comision), lugar: f.viaje ? 'Bermejo' : 'Otro', nota: redC ? redC.resto : notaCambio(f), redondeo: redC ? s(redC.dado) : '' } }));
  }
  if (f.tipo === 'Cambio') {
    const red = redondeoDeNota(notaCambio(f)), com = Number(f.comision) || 0;
    const como = !(com > 0) ? '' : f.pago === 'Efectivo' ? 'billetes' : f.pago === 'Combinado' ? 'parte' : 'mas';
    const d = { fecha: f.fecha, conOtro: 'No', recibido: s(f.recibido), comPesos: s(com), como, billetes: f.pago === 'Combinado' ? s(f.efeParte) : '', lugar: f.viaje ? 'Bermejo' : 'Otro', nota: red ? red.resto : notaCambio(f), redondeo: red ? s(red.dado) : '' };
    if (Math.abs(transfCalc(d) - Number(f.monto)) > 0.004) d.montoMan = s(f.monto); // lo transferido no coincide con el cálculo: queda escrito
    return iniciarFlujo('cambio', Object.assign(base, { d }));
  }
  if (f.tipo === 'Préstamo' || f.tipo === 'Devolución préstamo') {
    // Desde el lado del que lo cargó; si no, la ventana completa
    const propio = (f.tipo === 'Préstamo' ? 'Prestado' : 'Devuelto') === f.categoria;
    if (!propio) return f.tipo === 'Préstamo' ? formPrestamo(f) : formDevPrestamo(null, null, f);
    const nota = textoPrest(f).auto ? '' : f.descripcion;
    if (f.tipo === 'Préstamo') return iniciarFlujo('prestar', Object.assign(base, { negocio: f.negocio, grupo: f.grupo, d: { fecha: f.fecha, otro: f.contraparte, monto: s(f.monto), pago: f.pago, nota } }));
    return iniciarFlujo('devprest', Object.assign(base, { negocio: f.negocio, otro: f.contraparte, grupo: f.grupo, orig: s(f.monto), nota, d: { fecha: f.fecha, monto: s(f.monto), pago: f.pago } }));
  }
  if (f.tipo === 'Gasto general') { const sc = separarCat(L_GEN, f.categoria); return iniciarFlujo('general', Object.assign(base, { d: { fecha: f.fecha, categoria: sc.categoria, catNueva: sc.catNueva, monto: s(f.monto), pago: f.pago, descripcion: f.descripcion || '' } })); }
  if (f.tipo === 'Devolución') return iniciarFlujo('devolver', Object.assign(base, { orig: s(f.monto), nota: f.descripcion !== 'Devolución al negocio' ? f.descripcion : '', d: { fecha: f.fecha, monto: s(f.monto), pagoDev: f.pago === 'Transferencia' ? 'Transferencia' : 'Efectivo' } }));
}

function saludoRobot() {
  const k = 'bd_guia_hola_' + S.yo.usuario;
  // La primera vez en el modo completo: bienvenida con recorrido. Las demás veces: el globito.
  if (!esSimple() && LS.get('bd_ayudante', true) !== false && !LS.get(k, false)) {
    LS.set(k, true);
    return setTimeout(() => {
      if (!$('modal').hidden || $('app').hidden) return;
      abrirModal(`<div class="v-cab"><span class="ic" style="background:var(--grad)">${svg('robot', 22)}</span><b>¡Hola, ${esc(primerNombre(S.yo.nombre))}! 👋</b><button class="cerrar" type="button" data-acc="cerrar" aria-label="Cerrar">${svg('x', 18, 2.2)}</button></div>

        <button class="btn btn-grad" type="button" data-acc="guia" data-guia="recorrido">Sí, ver el recorrido</button>
        <button class="btn btn-ghost" type="button" data-acc="cerrar">Ahora no</button>`);
    }, 700);
  }
  globitoRobot();
}
function iniciarGuia(nombre) {
  const g = GUIAS[nombre]; if (!g) return;
  if (g.antes) g.antes();
  const falta = g.requiere && g.requiere();
  if (falta) return falta === true ? undefined : avisar(falta);
  const usos = LS.get('bd_guia_usos_' + nombre, 0);
  let pasos = g.pasos;
  if (g.camino) {
    if (usos >= 3 && g.atajo) g.atajo(); // ya lo hizo 3 veces: directo al formulario
    else { cerrarModal(); pasos = g.camino.concat(g.pasos); }
  }
  Object.assign(GUIA, { activa: true, nombre, pasos, i: -1, n: 0, largo: !!g.largo });
  camEntrar();
  $('guia').hidden = false; pintarRobot();
  { const c = $('guia').querySelector('.guia-cara'); c.innerHTML = avatarHTML('', 'senala'); c.classList.toggle('claro-av', avId() !== 'robot'); }
  $('guiaX').innerHTML = svg('x', 16, 2.4);
  siguientePaso();
  cancelAnimationFrame(GUIA.raf);
  const bucle = () => { if (!GUIA.activa) return; ubicarGuia(); GUIA.raf = requestAnimationFrame(bucle); };
  GUIA.raf = requestAnimationFrame(bucle);
}
function terminarGuia(mensaje, exito) {
  if (!GUIA.activa) return;
  const nombre = GUIA.nombre;
  GUIA.activa = false; cancelAnimationFrame(GUIA.raf);
  $('guia').hidden = true; pintarRobot(); camSalir();
  if (exito && GUIAS[nombre].tarea) LS.set('bd_guia_usos_' + nombre, LS.get('bd_guia_usos_' + nombre, 0) + 1);

/* ---------- "Lo de siempre": los últimos montos que usaste para lo mismo ---------- */
function montosPrevios(hoja, prueba, negocio) {
  const l = (hoja === 'personal' ? S.personal : S.negocio).filter(f => f.negocio === negocio && prueba(f))
    .sort((a, b) => (String(b.fecha) + (b.cargado || '')).localeCompare(String(a.fecha) + (a.cargado || '')));
  const out = [];
  for (const f of l) { const m = r2(Number(f.monto) || 0); if (m > 0 && !out.includes(m)) out.push(m); if (out.length >= 3) break; }
  return out;
}
function rapidosHTML(montos, grande) {
  if (!montos.length) return '';
  return `<div class="rapidos${grande ? ' f-rapidos' : ''}"><span>Lo de siempre:</span>${montos.map(m => `<button type="button" data-rapido="${m}">${fmtReal(m)}</button>`).join('')}</div>`;
}
function rapidosFlujo(fl, p) {
  if (p.k !== 'monto' || fl.editId) return [];
  const d = fl.d, n = fl.negocio;
  if (fl.tipo === 'viaje') { const q = d.que === 'Otra cosa' ? (d.otro || '') : d.que; return q ? montosPrevios('negocio', f => f.tipo === 'No reversible' && f.descripcion === q, n) : []; }

}
function rapidosForm(f) {

  if (f.hoja === 'personal' && f.categoria) return montosPrevios('personal', x => x.origen === f.origen && x.categoria === f.categoria, f.negocio);

}

document.addEventListener('input', ev => {
  if (ev.target.id !== 'apTam' || !AP) return;
  AP.d.tam = Number(ev.target.value);
  const l = $('apTamTxt'); if (l) l.textContent = TAMANOS[AP.d.tam][1];
  if ($('apPrev')) $('apPrev').outerHTML = htmlApEjemplo(AP.d);
});

/* =========================================================
   Teclado del celular
   - La tecla "→" pasa al campo siguiente; en el último, esconde el teclado.
   - Al esconder el teclado con "⌄", Android a veces escribe la tecla que pasa por debajo
     del dedo mientras baja (el "7 fantasma"). La app ignora cualquier tecla en ese instante.
   ========================================================= */
const TEC = { maxAlto: 0, abierto: false, cerrado: 0, ult: null };
function camposDe(cont) {
  return [...cont.querySelectorAll('input:not([type=hidden]):not([type=file]):not([disabled]):not([readonly])')].filter(e => e.getClientRects().length);
}
document.addEventListener('focusin', ev => {
  const el = ev.target;
  if (!el.matches || !el.matches('#modalIn input')) return;
  const lista = camposDe($('modalIn'));
  el.setAttribute('enterkeyhint', lista.indexOf(el) < lista.length - 1 ? 'next' : 'done');
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || ev.isComposing) return;
  const el = ev.target;
  if (!el.matches) return;
  if (el.id === 'buscarTodos') { ev.preventDefault(); return el.blur(); }
  if (!el.matches('#modalIn input') || el.id === 'fIn') return;
  ev.preventDefault();
  const lista = camposDe($('modalIn')), i = lista.indexOf(el);
  if (i >= 0 && i < lista.length - 1) { lista[i + 1].focus(); if (lista[i + 1].classList.contains('plata-in')) { const L = lista[i + 1].value.length; try { lista[i + 1].setSelectionRange(L, L); } catch (e) {} } }
  else el.blur();
});
// Antes de cada tecla: si el teclado se acaba de esconder, se ignora; si no, se guarda cómo estaba el campo
document.addEventListener('beforeinput', ev => {
  const el = ev.target;
  if (!el.matches || !el.matches('input,textarea')) return;
  const ahora = performance.now();
  // Mientras el teclado baja (o recién bajó) no entra ninguna tecla: es la "tecla fantasma"
  if (ahora - TEC.cerrado < 600 || (TEC.bajando && ahora - TEC.bajando < 700)) { ev.preventDefault(); return; }
  TEC.ult = { el, valor: el.value, t: ahora };
}, true);
function tecladoSeCerro() {
  const ahora = performance.now();
  TEC.cerrado = ahora;
  const el = document.activeElement;
  if (!el || !el.matches || !el.matches('input,textarea')) { TEC.bajando = 0; return; }
  // 2.0.1: solo se deshace una tecla que llegó MIENTRAS el teclado bajaba (la fantasma).
  // La última tecla que escribiste antes de esconderlo es tuya y se respeta, aunque lo escondas enseguida,
  // pases a otra casilla o salgas de la app.
  const desde = TEC.bajando || (ahora - 200);
  if (TEC.ult && TEC.ult.el === el && TEC.ult.t >= desde - 30 && el.value !== TEC.ult.valor && !document.hidden && Date.now() - plataOculta > 1500) {
    el.value = TEC.ult.valor;
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
  TEC.ult = null; TEC.bajando = 0;
  el.blur();
}
if (window.visualViewport) {
  const medir = () => {
    const h = visualViewport.height;
    // El teclado empieza a bajar: la pantalla visible crece
    if (TEC.abierto && TEC.hPrev && h > TEC.hPrev + 30 && !TEC.bajando) TEC.bajando = performance.now();
    if (TEC.hPrev && h < TEC.hPrev - 30) TEC.bajando = 0;
    TEC.hPrev = h;
    if (h > TEC.maxAlto) TEC.maxAlto = h;
    const abierto = h < TEC.maxAlto - 150;
    if (TEC.abierto && !abierto) tecladoSeCerro();
    TEC.abierto = abierto;
  };
  visualViewport.addEventListener('resize', medir);
  window.addEventListener('orientationchange', () => { TEC.maxAlto = 0; TEC.abierto = false; });
  medir();
}

  · Compra (Inversión): producto, unidades, costo total y **Pago**: **Efectivo**, **Transferencia** o **Combinado** (se escribe lo pagado **En efectivo** y la parte **Por transferencia** se calcula sola). Con transferencia o combinado: **Recargo por transferir** en **$** o en **%** (se cobra sobre lo transferido).
  · Cambio: **Lugar** (**Bermejo**, ya marcado, o **Otro lugar**; en Bermejo queda dentro del viaje del día, en otro lugar sin viaje), **Compartido con otros negocios** (interruptor), monto transferido, "¿Cómo pagaste la comisión?" (**Con billetes** / **Transferí de más** / **Una parte**), y según eso: **¿Cuánto efectivo te dieron?** con **Comisión %** al lado (escribe en el que quiera y el otro se completa solo), **¿Cuánto pagaste de comisión?** con su % si fue con billetes, o, con "Una parte", **¿Cuánto efectivo te dieron?** y **¿Cuánto de la comisión pagaste con billetes?**. Abajo, **¿Te dieron un monto redondeado?** para anotar si le dieron de más y dio vuelto con su efectivo. Nota opcional.
  · **Cambio compartido**: prendé **Compartido con otros negocios**, poné cuánto transfirió cada negocio (**+ Sumar otro negocio**), "¿Cuánto efectivo les dieron en total?" (o el % de comisión: el otro se completa solo) y "¿Quién paga la comisión?": **Según lo transferido** (cada uno según lo que puso), **Uno solo** (se elige cuál) o **A mano** (se escribe cuánto paga cada uno; tiene que sumar la comisión). Abajo muestra "Así queda cada negocio". Al guardar, cada negocio ve su cambio en su cuenta sin cargar nada.
  · **Préstamo a otro negocio**: a qué negocio de la familia, fecha, cuánto, cómo se lo diste (**Efectivo** / **Transferencia**) y nota. No es gasto. El que presta ve "🤝 <negocio> te debe" y el que recibe "🤝 Le debés a <negocio>" con **Devolver** (todo o una parte, en efectivo o por transferencia). Cuando llega a $ 0 la tarjeta desaparece.
  · Gasto personal: de dónde salió la plata (**Negocio** o **Personal**), categoría, fecha (Hoy, Ayer o calendario), monto, detalle opcional, efectivo o transferencia. Si la plata es del negocio, **Lo voy a devolver** deja anotada la deuda. Al elegir **Otros**, aparece **¿Qué fue?** (opcional) con el botón **✨ Sugerir**, que propone un nombre general de categoría. Lo mismo en Gastos generales.
  · **Categorías nuevas**: lo que alguien escribe en **¿Qué fue?** se guarda como categoría nueva. Si lo escribe el admin, se suma a la lista de todos. Si lo escribe otra persona, queda pendiente: el admin la ve en **Inicio** (aviso) y en **Perfil → Categorías nuevas**, y puede **Aprobar**, **Cambiar nombre** o **Rechazar** (esos gastos pasan a Otros). Quien la escribió la ve en **Perfil → Mis categorías nuevas** y la puede **Cambiar nombre** o **Borrar**.
  · Devolución: fecha (Hoy, Ayer o calendario; si la devolvió otro día, elegir esa fecha), cuánto, cómo (**En efectivo** / **Transferencia**) y nota opcional.
- **Negocio**: Mes / Semana / Día, cuatro tarjetas: **Recuperable**, **No reversible (viajes)**, **Gastos generales** y **Efectivo disponible** (elegirlo permite ajustarlo), y los movimientos. Se puede ver por viaje.
- **Personal**: los gastos personales, mes por mes (elegí el mes para ver otro).
- **Perfil**: datos de la cuenta, **Versión de la app**, **Subir y actualizar ahora**, **Modo simple**, **Descargar resumen** (Excel o **PDF**, por mes o por viaje), **Categorías nuevas** (si hay pendientes), **Cuentas de la familia** (solo el admin), **Mostrar ayudante 🤖**, **Sonido de monedas**, **Apariencia** (letra, color, modo claro u oscuro, ayudante, ahorro de energía), **Desbloqueo** (Patrón, PIN o Huella, y **Cambiar mi patrón**), **Dispositivos conectados**, **Cerrar sesión**.
- Para corregir: abrir el movimiento → lápiz ✏️ → cambiar → **Guardar cambios**. Para borrar: **Borrar este gasto**, abajo de todo.

CONCEPTOS
- **Inversión / Recuperable**: mercadería comprada para vender. La plata vuelve cuando se vende. Puede tener un recargo de la tienda si se pagó por transferencia.
- **No reversible**: gastos que no vuelven: pasero, colectivo, chalana, baño, bodega, comida del viaje, la comisión del cambio. Categorías: Insumos (pasajes, pasero), Sueldo (comida y bebida del viaje), Interés/Gastos (comisiones, recargos), Otros.
- **Cambio a efectivo**: se transfiere (por ejemplo a un cambista en Bermejo, o a un conocido) y te dan efectivo. Con conocidos muchas veces no hay comisión (0%). La comisión es un gasto no reversible. Desde la 2.0.0 el % es sobre el EFECTIVO que te dan, como lo calcula la familia: pedís 900.000, el cambista cobra 1,5% → 13.500. Se paga transfiriendo de más (913.500), con billetes que ya tenías (transferís 900.000) o una parte de cada forma (transferís 903.500 y pagás 10.000 con billetes). Si escribís el monto, la app saca sola el % con varios decimales (1.000 de 70.000 = 1,4286%). Los cambios cargados antes de la 2.0.0 tienen el % calculado sobre lo transferido. En los dos modos se pregunta en el mismo orden: primero **¿Cuánto efectivo te dieron?**, después la comisión ($ o %), **¿Cómo pagaste la comisión?** y, si fue una parte, cuánto con billetes. Lo transferido se calcula solo. Si se transfirió otro monto ("¿Transferiste otro monto?" en el simple, o cambiando **Transferiste** en el completo), la comisión acordada no cambia y lo que la transferencia no cubrió se pagó con billetes: efectivo 900.000 al 1,5% = 13.500; si transferiste 908.000, la transferencia cubrió 8.000 y los billetes son 5.500. Si la transferencia cubre toda la comisión o más, no hubo billetes. No deja guardar si te dieron más de lo que transferiste.
- **Cambio compartido**: cuando varios negocios de la familia cambian juntos con el mismo cambista. Cada negocio queda con lo que transfirió, su parte de la comisión y su efectivo.
- **Préstamo entre negocios**: un negocio de la familia le da plata a otro. No es gasto ni venta: solo queda anotado lo que se debe. En efectivo, baja el efectivo del que presta y sube el del que recibe; por transferencia, el efectivo no cambia.
- **Pago combinado**: una compra pagada una parte en efectivo y otra por transferencia, en una sola carga. Del efectivo del negocio baja solo la parte en efectivo. En un cambio, con la comisión con billetes dan todo lo transferido y la comisión se paga con billetes; transferida de más, dan menos; con una parte de cada forma, el efectivo sube lo que te dieron menos lo pagado con billetes. En todos los casos el efectivo del negocio sube lo transferido menos la comisión.
- **Efectivo del negocio / Efectivo disponible**: la plata del negocio que la persona tiene en la mano. Sube con los cambios y las devoluciones en efectivo; baja con lo que se paga en efectivo. Si no coincide con lo que cuenta: **Contar** (simple) o elegir **Efectivo disponible** (completo), escribir lo que tiene y la app corrige la diferencia ("Ajuste de efectivo"). Si al pagar no alcanza el efectivo, la app avisa.
- **Viaje**: cada ida a Bermejo se anota como "Bermejo" + la fecha (ida y vuelta en el día).
- **Plata del negocio usada para algo personal**: se carga con **Usé plata del negocio**. Si se va a devolver, queda "Le debés al negocio". Al devolver, baja la deuda: **en efectivo** suma al efectivo del negocio; **por transferencia** vuelve a Mercado Pago y el efectivo no cambia.
- Si alguien quiere devolver y la app dice que no tiene nada anotado, es porque la plata usada no se cargó con **Usé plata del negocio** (o ya devolvió todo). La app ofrece **Cargarlo ahora**.
- **Excel y PDF**: se descargan desde Perfil (modo completo), por mes o por viaje, y quedan en las Descargas del celular. El Excel viene prolijo: títulos con color, montos con $ y puntos de miles, fechas 31/10/2026, fila de TOTAL en cada hoja y títulos fijos al bajar. Hojas: Resumen, Inversiones (con En efectivo / Por transferencia), No reversibles, Gastos generales, Cambios (con "Compartido con"), Personal, Devoluciones y Préstamos. El PDF trae totales, comparación con el mes anterior, categorías y movimientos.
- **Gastos generales**: gastos del negocio que no son de un viaje (Mercado Envíos FULL, correo y envíos, Facturación MercadoLibre, contadora, monotributo / IIBB, sueldo, insumos de embalaje, otros). **Facturación MercadoLibre** es el "Pago de factura" mensual de MercadoLibre que figura en Mercado Pago (incluye publicidad, Mi página, percepciones y otros cargos que no se descuentan de cada venta). Antes se llamaba "Publicidad". No reversible (viajes) son solo los gastos de los viajes.
- **Ojito** (arriba, al lado del saludo): oculta todos los montos como "$ •••••" y queda así hasta que se vuelva a tocar. Mientras se carga algo, los montos se ven.
- **Lo de siempre**: al cargar algo que ya se cargó antes, abajo del monto aparecen los últimos montos usados para eso; un toque y queda puesto.
- **Accesos directos**: dejando apretado el ícono de la app en el celular aparecen Cambié plata, Compré mercadería, Gastos del viaje y Gasté con mi plata (si la app está instalada en la pantalla de inicio).
- **Versión**: en Perfil → Versión de la app se ve el número (por ejemplo 1.11.1) y la fecha.`;

// Etiqueta de la IA → guía (modo completo) o paso a paso / pantalla (modo simple)
const IA_ACC = {
  cambio: { guia: 'cambio', flujo: 'cambio' }, compra: { guia: 'compra', flujo: 'compra' }, pasero: { guia: 'noreversible', flujo: 'viaje' },
  personal: { guia: 'personal', flujo: 'personal' }, usar: { guia: 'usar', flujo: 'usar' }, devolver: { guia: 'devolver', flujo: 'devolver' }, general: { guia: 'general', flujo: 'general' },
  contar: { guia: 'contar', flujo: 'contar' }, efectivo: { guia: 'efectivo' }, corregir: { guia: 'corregir', vista: 'lista' },
  cuanto: { guia: 'cuanto', vista: 'lista' }, todos: { guia: 'todos', vista: 'lista' }, excel: { guia: 'excel' }, tipos: { guia: 'tipos' },
  ajustes: { guia: 'ajustes', vista: 'perfil' }, recorrido: { guia: 'recorrido' },
  compartido: { guia: 'compartido', flujo: 'cambio' }, prestamo: { guia: 'prestamo', flujo: 'prestar' }, devprest: { guia: 'devprest', vista: 'inicio' }
};
const IA = { msgs: [], cargando: false, img: '', imgUrl: '' };

// Lo que la IA sabe de la persona: lo mismo que ve en la app
function contextoIA() {
  const y = S.yo, L = [];
  const negs = y.admin ? (S.listas['Negocios'] || []) : [y.negocio];
  L.push('Hoy es ' + new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + '.');
  L.push(`Persona: ${y.nombre} (usuario ${y.usuario}). Su negocio: ${y.negocio}. ${y.admin ? 'Es el ADMIN: ve los datos de todos los negocios.' : 'Ve lo que cargó en la app.'}`);
  L.push('Modo de la app que usa ahora: ' + (esSimple() ? 'SIMPLE' : 'COMPLETO') + '.');
  L.push('Vos sos el ayudante de la app. ' + (avId() === 'robot' ? 'Sos el asistente (el Robotito); el ícono del ayudante es 🤖.' : 'Te llamás Rabbit, "tu asesor de confianza"; el ícono del ayudante es 🐰 (Rabbit). Cuando hables del ícono, decí "el ícono de Rabbit".'));
  L.push(`Movimientos sin subir todavía: ${S.cola.length}. Con error (en rojo): ${S.rech.length}.`);
  L.push('\nLISTAS DE LA APP (usá estos nombres exactos al cargar):');
  L.push('- Categorías personales: ' + (S.listas['Categorías personales'] || []).join(' | '));
  L.push('- Categorías de gastos generales: ' + (S.listas['Categorías gastos generales'] || LISTAS_BASE['Categorías gastos generales']).join(' | '));
  L.push('- Gastos del viaje (descripciones rápidas): ' + (S.listas['Descripciones rápidas'] || []).join(' | '));
  L.push('\nEFECTIVO Y DEUDA (ahora mismo):');
  negs.forEach(n => {
    const pr = Object.entries(prestamosDe(n)).filter(([, s]) => Math.abs(s) > 0.004).map(([o, s]) => s > 0 ? `${o} le debe ${fmtReal(s)}` : `le debe a ${o} ${fmtReal(-s)}`);
    L.push(`- ${n}: efectivo del negocio ${fmtReal(efectivoDe(n))} · le deben al negocio (plata usada sin devolver) ${fmtReal(deudaDe(n))} · préstamos entre negocios: ${pr.length ? pr.join(', ') : 'ninguno pendiente'}`);
  });
  const suma = (arr, fk, fv) => { const m = {}; arr.forEach(f => { const k = fk(f); m[k] = (m[k] || 0) + (Number(fv(f)) || 0); }); return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${fmtReal(v)}`).join(', '); };
  const tot = (arr, fv) => fmtReal(arr.reduce((s, f) => s + (Number(fv(f)) || 0), 0));
  const meses = [...new Set(S.personal.concat(S.negocio).map(f => String(f.fecha).slice(0, 7)))].filter(Boolean).sort().reverse().slice(0, 12);
  L.push('\nRESÚMENES POR MES (más nuevo primero):');
  meses.forEach(m => {
    L.push(`* ${MESES[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}`);
    negs.forEach(n => {
      const P = S.personal.filter(f => f.negocio === n && String(f.fecha).startsWith(m));
      const N = S.negocio.filter(f => f.negocio === n && String(f.fecha).startsWith(m));
      if (!P.length && !N.length) return;
      const pre = negs.length > 1 ? `  [${n}] ` : '  ';
      if (P.length) {
        L.push(`${pre}Gastos personales: total ${tot(P, f => f.monto)} (${P.length} gastos). Por categoría: ${suma(P, f => f.categoria, f => f.monto)}.`);
        const PN = P.filter(f => f.origen === 'Negocio (MercadoLibre)');
        if (PN.length) L.push(`${pre}  De esos, pagados con plata del negocio: ${tot(PN, f => f.monto)}; marcados para devolver: ${tot(PN.filter(f => f.devolver === 'sí'), f => f.monto)}.`);
      }
      const t = tp => N.filter(f => f.tipo === tp);
      if (t('Inversión').length) L.push(`${pre}Compras de mercadería (recuperable): ${tot(t('Inversión'), f => f.monto)} en ${t('Inversión').length} compras.`);
      const no = N.flatMap(partesNegocio).filter(p => p[2] === 'no');
      if (no.length) L.push(`${pre}No reversible: total ${fmtReal(no.reduce((s, p) => s + p[1], 0))}. Por categoría: ${suma(no, p => p[0], p => p[1])}.`);
      if (t('Gasto general').length) L.push(`${pre}Gastos generales (fuera de viajes): ${tot(t('Gasto general'), f => f.gastoReal)}. Por categoría: ${suma(t('Gasto general'), f => f.categoria, f => f.gastoReal)}.`);
      if (t('Cambio').length) L.push(`${pre}Cambios a efectivo: ${t('Cambio').length}, transferido ${tot(t('Cambio'), f => f.monto)}, comisiones ${tot(t('Cambio'), f => f.comision)}.`);
      if (t('Devolución').length) L.push(`${pre}Devoluciones al negocio: ${tot(t('Devolución'), f => f.monto)} (en efectivo ${tot(t('Devolución').filter(f => f.pago !== 'Transferencia'), f => f.monto)}, por transferencia ${tot(t('Devolución').filter(f => f.pago === 'Transferencia'), f => f.monto)}).`);
      const pr = N.filter(esPrest);
      if (pr.length) L.push(`${pre}Préstamos entre negocios (no son gastos): ${pr.map(f => textoPrest(f).titulo + ' ' + fmtReal(f.monto)).join('; ')}.`);
    });
  });
  const orden = (a, b) => String(b.fecha).localeCompare(String(a.fecha));
  // Movimientos con detalle: solo los últimos 3 meses (para que la IA responda rápido). Los resúmenes de arriba cubren todo el año.
  const d3 = new Date(); d3.setMonth(d3.getMonth() - 3); const desde = aISO(d3);
  const recientes = arr => arr.filter(f => String(f.fecha) >= desde).sort(orden).slice(0, 150);
  L.push('\nMOVIMIENTOS PERSONALES DE LOS ÚLTIMOS 3 MESES (más nuevo primero; lo anterior está solo en los resúmenes): fecha | negocio | cargó | categoría | detalle | plata de | pago | monto | a devolver');
  recientes(S.personal).forEach(f => L.push([f.fecha, f.negocio, f.usuario || '', f.categoria, f.descripcion || '-', f.origen === 'Personal' ? 'propia' : 'del negocio', f.pago, fmtReal(f.monto), f.devolver === 'sí' ? 'sí' : 'no'].join(' | ')));
  L.push('\nMOVIMIENTOS DEL NEGOCIO DE LOS ÚLTIMOS 3 MESES (más nuevo primero): fecha | negocio | cargó | viaje | tipo | categoría | detalle | monto | pago | extra | efectivo +/-');
  recientes(S.negocio).forEach(f => {
    let extra = '';
    if (f.tipo === 'Inversión') extra = `${f.unidades} unidades a ${fmtReal(f.costoUnit)}` + (f.pago === 'Combinado' ? `, pago combinado: ${fmtReal(f.efeParte)} en efectivo y ${fmtReal(r2(f.monto - f.efeParte))} por transferencia` : '') + (Number(f.recargo) ? `, recargo ${fmtReal(f.recargo)}` : '');
    else if (f.tipo === 'Cambio') extra = `${f.grupo ? 'compartido con ' + f.contraparte + ', ' : ''}${pct(f.pctCambio)}, comisión ${fmtReal(f.comision)} ${f.pago === 'Efectivo' ? 'pagada en efectivo' : f.pago === 'Combinado' ? 'pagada en parte con billetes (' + fmtReal(f.efeParte) + ')' : 'descontada'}, efectivo recibido ${fmtReal(f.recibido)}`;
    else if (esPrest(f)) extra = textoPrest(f).titulo + ' (no es gasto)';
    else if (f.tipo === 'Ajuste') extra = 'efectivo contado ' + fmtReal(f.monto);
    else if (f.tipo === 'Devolución') extra = f.pago === 'Transferencia' ? 'devuelta por transferencia' : 'devuelta en efectivo';
    const mov = Number(f.movEfectivo) || 0;
    L.push([f.fecha, f.negocio, f.usuario || '', f.viaje || '-', f.tipo, f.categoria, f.descripcion || '-', fmtReal(f.monto), f.pago, extra || '-', (mov >= 0 ? '+' : '-') + fmtReal(Math.abs(mov))].join(' | '));
  });
  return L.join('\n');
}

    const url = URL.createObjectURL(file);
    const im = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });

    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const dataUrl = c.toDataURL('image/jpeg', 0.8);
    IA.img = dataUrl.split(',')[1]; IA.imgUrl = dataUrl;
    const a = $('iaAdj');
    if (a) { a.innerHTML = `<img src="${dataUrl}" alt="Foto elegida"><span>Foto lista para mandar. Escribí tu pregunta (o mandala así).</span><button type="button" class="cerrar" data-acc="iaQuitarFoto" aria-label="Quitar la foto">${svg('x', 16, 2.4)}</button>`; a.hidden = false; }

/* ---------- La IA propone cargar un movimiento: tarjeta con Guardar / Corregir (nunca guarda sola) ---------- */
function leerCarga(txt) {
  const m = String(txt || '').match(/\[\[cargar:([\s\S]*?)\]\](?![\s\S]*\[\[cargar:)/);

function validarCarga(c) {

  const tipo = String(c && c.tipo || '').toLowerCase(), err = [];

  const enLista = (v, lista) => lista.find(x => x.toLowerCase() === String(v || '').trim().toLowerCase()) || '';

  }

    // Lo que te dieron en la mano (si no, se calcula con el %)

    let rec = n(c.recibido);
    const pc = c.pct == null || c.pct === '' ? 0 : n(c.pct);
    // El % es sobre el efectivo: 913.500 al 1,5% → te dieron 900.000
    if (!(rec > 0)) { if (!(pc >= 0 && pc <= 100)) err.push('Revisá el porcentaje.'); rec = efeCom ? monto : efeDeTransf(monto, pc || 0); }
    if (rec > monto) err.push('Te dieron más de lo que transferiste.');
    d.recibido = String(rec);
    if (efeCom && pc > 0 && rec === monto) { d.comPesos = String(r2(rec * pc / 100)); d.como = 'billetes'; }
    else { d.comPesos = String(r2(monto - rec)); d.como = monto > rec ? 'mas' : ''; }

    let rp = n(c.recargo); if (!(rp > 0) && n(c.pct) > 0) rp = r2(tr * n(c.pct) / 100);

    if (!d.otro) err.push('Falta a qué negocio de la familia le prestaste.');
    d.nota = String(c.nota || '').trim().slice(0, 80);
  } else if (tipo === 'devprest') {
    fl.otro = enLista(c.otro || c.negocio, negOtros(negocio));
    if (!fl.otro) err.push('Falta a qué negocio le devolviste.');
    else if (!(debeA(negocio, fl.otro) > 0)) err.push('No hay un préstamo anotado con ' + fl.otro + '.');
    else if (monto > debeA(negocio, fl.otro) + 0.004) err.push('Es más de lo que se debe (' + fmtReal(debeA(negocio, fl.otro)) + ').');
  } else if (tipo === 'viaje') {
    const q = String(c.que || c.descripcion || '').trim(), l = enLista(q, S.listas['Descripciones rápidas'] || []);

  } else if (tipo === 'general') {
    d.categoria = enLista(/^(publicidad|factura|facturaci[oó]n)/i.test(String(c.categoria || '').trim()) ? CAT_FACT : c.categoria, S.listas['Categorías gastos generales'] || LISTAS_BASE['Categorías gastos generales']);
    if (!d.categoria) err.push('Elegí la categoría con Corregir.');
    d.descripcion = String(c.descripcion || '').trim().slice(0, 120);
  } else if (tipo === 'personal' || tipo === 'usar') {
    d.categoria = enLista(c.categoria, S.listas['Categorías personales'] || []);
    if (!d.categoria) err.push('Elegí la categoría con Corregir.');
    d.descripcion = String(c.descripcion || '').trim().slice(0, 120);

}

// Primero usa el espacio libre que haya arriba de las preguntas; si no alcanza, sube toda la pantalla (nada queda encimado).
function subirBarra(g) {
  const pr = document.querySelector('#contenido .s-pregunta'), barra = pr && pr.querySelector('.s-barra'); if (!barra) return;
