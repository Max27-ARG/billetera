<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Billetera Digital</title>
<meta name="theme-color" content="#0E0B1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Billetera Digital">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800;900&display=swap">
<script src="config.js"></script>
<style>
/* Billetera Digital — oscuro, violeta/fucsia, tarjetas sólidas, ventanas de carga semitransparentes */
:root{
  --bg:#0E0B1A; --bg2:#120E22; --card:#1A1530; --card2:#241D3F; --card3:#2E2550;
  --ink:#F4F1FF; --muted:#A49CC4; --soft:#C9C0E6; --dim:#7F76A3;
  --violet:#7C4DFF; --violet2:#9B6BFF; --lilac:#D7C8FF; --fuchsia:#E040A0; --pink:#F05BB5;
  --teal:#1F9E95; --teal2:#3FD6C6; --tealbg:#1F4D47; --tealink:#BDF5EE;
  --amber:#FFB547; --red:#FF6B81;
  --grad:linear-gradient(135deg,#7C4DFF 0%,#B347D9 55%,#E040A0 100%);
  --font:'Urbanist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.pantalla{position:fixed;inset:0;overflow:auto;padding:calc(24px + var(--safe-t)) max(18px,env(safe-area-inset-right,0px)) calc(24px + var(--safe-b)) max(18px,env(safe-area-inset-left,0px))}

/* ---------- Campos ---------- */
.campo{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--soft);min-width:0}
.campo input,.campo select,.input{width:100%;border:1px solid rgba(255,255,255,.12);background:rgba(11,9,22,.5);color:var(--ink);border-radius:14px;padding:12px;font-size:16px;font-weight:600}
.clave{position:relative}
.clave input{padding-right:54px}
.ojo{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--soft);display:flex;align-items:center;justify-content:center}
.ojo[aria-pressed="true"]{color:var(--lilac);background:rgba(124,77,255,.18)}
.campo input:focus,.input:focus{outline:none;border-color:var(--violet2);box-shadow:0 0 0 3px rgba(124,77,255,.3)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos>*{min-width:0}
.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-grad{background:var(--grad);color:#fff}
.btn-sec{background:var(--card3);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--soft);font-weight:700;font-size:14px;padding:10px}
.btn:disabled{opacity:.55;cursor:default}
.error{background:rgba(255,107,129,.14);color:#FFB3BF;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.ok{background:rgba(63,214,198,.14);color:var(--tealink);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.ayuda{font-size:12px;font-weight:600;color:var(--soft);line-height:1.4}
.segm{display:flex;background:rgba(11,9,22,.5);border-radius:16px;padding:4px;gap:4px}
.segm button{flex:1 1 0;border:0;background:transparent;border-radius:12px;padding:10px 4px;font-weight:700;font-size:14px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:1px}
.segm button small{font-size:10px;font-weight:600}
.segm button[aria-pressed="true"]{background:var(--violet);color:#fff;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid rgba(255,255,255,.16);background:rgba(11,9,22,.35);border-radius:14px;padding:10px 12px;font-weight:700;font-size:13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg2);border-color:var(--ink);font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* ---------- Login ---------- */
#login{display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 70% at 50% 0%,#2A1650 0%,var(--bg) 60%)}
.login-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.marca{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px;text-align:center}
.marca img{width:84px;height:84px;border-radius:24px;box-shadow:0 14px 40px rgba(176,71,217,.45)}
.marca h1{margin:0;font-size:28px;font-weight:900}
.marca p{margin:0;color:var(--muted);font-weight:600}

/* ---------- Patrón ---------- */
#patron{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#patron h2{margin:0;font-size:22px}
#patronSvg{width:280px;height:280px;touch-action:none;user-select:none}
.puntos-error{animation:sacude .35s}
@keyframes sacude{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- Bienvenida ---------- */
#bienvenida{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--grad);text-align:center}
#bienvenida span{font-size:18px;font-weight:700;opacity:.9}
#bienvenida b{font-size:38px;font-weight:900;line-height:1.1}

/* ---------- App ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#contenido{flex:1;overflow:auto;padding:calc(20px + var(--safe-t)) max(18px,env(safe-area-inset-right,0px)) calc(170px + var(--safe-b)) max(18px,env(safe-area-inset-left,0px))}
.vista{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.cabecera{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--card2);color:var(--lilac);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none}
.saludo{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.saludo small{font-size:13px;color:var(--muted);font-weight:600}
.saludo b{font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{border:0;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;background:var(--card);color:var(--soft);white-space:nowrap}
.sync.pend{background:rgba(255,181,71,.16);color:var(--amber)}
.sync.okk{background:var(--tealbg);color:var(--tealink)}
.titulo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.titulo h1{margin:0;font-size:24px;font-weight:900}
.filtro-neg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filtro-neg button{flex:none;border:0;border-radius:20px;padding:8px 13px;background:var(--card);color:var(--soft);font-weight:700;font-size:13px}
.filtro-neg button[aria-pressed="true"]{background:var(--ink);color:var(--bg2);font-weight:800}

.hero{border-radius:26px;background:var(--grad);padding:20px;display:flex;flex-direction:column;gap:14px;color:#fff}
.hero .fila{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .etq{font-size:14px;font-weight:700}
.hero .pill{font-size:12px;font-weight:700;background:rgba(14,11,26,.28);border-radius:20px;padding:5px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.hero .total{font-size:38px;font-weight:900;letter-spacing:-.5px;line-height:1.05}
.hero .sub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .sub div{background:rgba(14,11,26,.28);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hero .sub span{font-size:12px;font-weight:600}
.hero .sub b{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tarj{background:var(--card);border-radius:22px;padding:16px}
.tarj h2{margin:0 0 12px;font-size:16px;font-weight:800}
.dona{display:flex;align-items:center;gap:16px}
.dona svg{flex:none}
.leyenda{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;font-size:13px}
.leyenda div{display:flex;align-items:center;gap:8px}
.leyenda i{width:9px;height:9px;border-radius:3px;flex:none}
.leyenda span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leyenda b{font-weight:800}
.vacio{color:var(--muted);font-size:14px;text-align:center;padding:18px 8px;line-height:1.5}

.periodo{display:flex;flex-direction:column;gap:10px}
.nav-per{display:flex;align-items:center;justify-content:space-between}
.nav-per button{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}
.nav-per b{font-size:16px;font-weight:800}
.anillo{display:flex;justify-content:center}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.mini>*{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0;border:0;text-align:left;color:var(--ink)}
.mini span{font-size:11px;font-weight:700;color:var(--muted)}
.mini b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .efe{background:var(--tealbg)}
.mini .efe span{color:var(--tealink)}
.mini .efe small{font-size:11px;font-weight:700;color:var(--tealink)}

.lista{display:flex;flex-direction:column;gap:8px}
.mov{display:flex;align-items:center;gap:12px;background:transparent;border:0;padding:6px 8px;margin:0 -8px;border-radius:16px;text-align:left;color:var(--ink);width:calc(100% + 16px)}
.mov .ico{width:44px;height:44px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}
.mov .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mov .txt b{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .txt small{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .monto{font-weight:800;font-size:15px;white-space:nowrap}
.mov .monto.pos{color:var(--teal2)}
.esperando{font-size:10px;font-weight:800;color:var(--amber);background:rgba(255,181,71,.14);border-radius:6px;padding:1px 5px;margin-left:4px}

/* ---------- Barra ---------- */
nav.barra{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));height:72px;max-width:536px;margin:0 auto;background:var(--card);border-radius:24px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:5}
nav.barra button{border:0;border-radius:16px;background:transparent;width:60px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--dim)}
nav.barra button[aria-current="page"]{color:var(--lilac);font-weight:800}
nav.barra .mas{width:62px;height:62px;border-radius:50%;margin-top:-36px;background:var(--grad);color:#fff;box-shadow:0 10px 26px rgba(176,71,217,.5)}

/* ---------- Ventanas ---------- */
.fondo{position:fixed;inset:0;background:rgba(8,6,16,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:calc(12px + var(--safe-t)) 10px calc(10px + var(--safe-b))}
.vidrio{width:100%;max-width:520px;max-height:100%;overflow:auto;background:rgba(34,27,60,.72);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:13px}
@media (prefers-reduced-motion:no-preference){.vidrio{animation:sube .22s ease-out}@keyframes sube{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}}
.v-cab{display:flex;align-items:center;gap:10px}
.v-cab .ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.v-cab b{font-size:19px;font-weight:800;flex:1}
.cerrar{width:40px;height:40px;border-radius:13px;border:0;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.opcion{display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px;border:0;color:#fff;text-align:left;width:100%}
.opcion .oi{width:48px;height:48px;border-radius:15px;background:rgba(14,11,26,.25);display:flex;align-items:center;justify-content:center;flex:none}
.opcion span{display:flex;flex-direction:column;gap:3px;flex:1}
.opcion b{font-size:17px;font-weight:800}
.opcion small{font-size:13px;font-weight:600}
.caja{display:flex;flex-direction:column;gap:6px;background:rgba(11,9,22,.5);border-radius:16px;padding:12px 14px}
.caja div{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--soft)}
.caja .t{color:var(--ink);font-size:15px;font-weight:800;align-items:center}
.caja .t b{font-size:20px}
.efe-nota{font-size:12px;font-weight:700;color:var(--tealink);background:rgba(31,77,71,.6);border-radius:12px;padding:8px 12px}
.efe-nota.mal{color:var(--amber);background:rgba(255,181,71,.14)}
.fijo{display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(255,255,255,.08);background:rgba(11,9,22,.25);border-radius:14px;padding:12px;font-size:16px;font-weight:700;color:var(--ink)}

/* Desplegable propio */
.dd{position:relative}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid rgba(255,255,255,.12);background:rgba(11,9,22,.5);color:var(--ink);border-radius:14px;padding:12px;font-size:16px;font-weight:700;text-align:left}
.dd-lista{margin-top:6px;background:var(--card2);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:6px;display:flex;flex-direction:column;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.dd-lista button{border:0;background:transparent;color:var(--ink);text-align:left;padding:10px;border-radius:10px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.dd-lista button[aria-selected="true"]{background:var(--violet);font-weight:800}
.combo{display:flex;border:1px solid rgba(255,255,255,.12);background:rgba(11,9,22,.5);border-radius:14px;overflow:hidden}
.combo input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);padding:12px;font-size:16px;font-weight:600}
.combo input:focus{outline:none}
.combo button{width:48px;border:0;border-left:1px solid rgba(255,255,255,.12);background:rgba(124,77,255,.35);color:#fff;display:flex;align-items:center;justify-content:center}

.aviso{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + var(--safe-t));background:var(--ink);color:var(--bg2);padding:11px 16px;border-radius:14px;font-weight:800;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* Perfil */
.fila-p{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.fila-p:first-of-type{border-top:0}
.fila-p span{color:var(--muted);font-weight:600}
.fila-p b{font-weight:800;text-align:right}
.usr{background:var(--card2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.usr .cab{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.usr .cab b{font-size:15px}
.usr .cab small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
.estado{font-size:11px;font-weight:800;border-radius:8px;padding:3px 8px;white-space:nowrap}
.estado.activo{background:var(--tealbg);color:var(--tealink)}
.estado.pendiente{background:rgba(255,181,71,.16);color:var(--amber)}
.estado.desactivado,.estado.bloq{background:rgba(255,107,129,.14);color:#FFB3BF}
.acc{display:flex;gap:6px;flex-wrap:wrap}
.acc button{border:0;border-radius:12px;padding:9px 12px;font-weight:800;font-size:13px;background:var(--card3);color:var(--ink)}
.acc button.prim{background:var(--violet);color:#fff}

/* ================= Actualización 2 ================= */
/* Sin barras de desplazamiento */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
/* Sin "tirar para recargar" del navegador */
html,body{overscroll-behavior:none}
#contenido,.pantalla,.vidrio{overscroll-behavior:contain}
/* Sin seleccionar texto (y sin búsqueda de Google al mantener apretado) */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

/* Animación al tocar: se hunde, bordes un toque más oscuros y una luz donde está el dedo */
button{position:relative;overflow:hidden;transition:scale .14s ease;-webkit-tap-highlight-color:transparent}
button::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .2s ease;
  background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(196,170,255,.42) 0,rgba(155,107,255,.20) 34px,rgba(124,77,255,0) 80px),
             radial-gradient(farthest-side,rgba(0,0,0,0) 55%,rgba(0,0,0,.30) 100%)}
button.toque{scale:.965}
button.toque::after{opacity:1;transition:opacity .04s}
button.toque-fuera::after{opacity:.5;transition:opacity .12s}
button:disabled::after{display:none}
#patronSvg button::after{display:none}

/* Fecha: botón + Hoy / Ayer */
.fecha-fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.fecha-fila .dd-btn{justify-content:flex-start;gap:10px}
.fecha-fila .dd-btn svg{color:var(--lilac);flex:none}
.fecha-fila .dd-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fecha-fila .segm{padding:3px}
.fecha-fila .segm button{flex:none;padding:8px 13px}

/* Calendario propio */
#cal{z-index:20;align-items:center}
.cal{max-width:380px;gap:12px}
.cal-sel{font-size:13px;font-weight:700;color:var(--muted)}
.cal-sel b{display:block;font-size:22px;color:var(--ink);margin-top:2px;font-weight:800}
.cal-cab{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-cab b{font-size:17px;font-weight:800}
.cal-cab button{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.08);color:var(--ink);display:flex;align-items:center;justify-content:center}
.cal-sem,.cal-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-sem span{font-size:12px;font-weight:800;color:var(--muted);padding:4px 0}
.cal-dias button{aspect-ratio:1;border:0;border-radius:12px;background:transparent;color:var(--ink);font-size:15px;font-weight:700;padding:0}
.cal-dias button.hoy{box-shadow:inset 0 0 0 2px var(--violet2);color:var(--lilac)}
.cal-dias button[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:none}
.cal-pie{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cal-pie .btn{padding:12px 8px;font-size:15px}

/* Deslizar para actualizar */
#ptr{position:fixed;left:50%;top:calc(10px + var(--safe-t));transform:translate(-50%,-90px);z-index:8;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;opacity:0}
#ptr .c{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(176,71,217,.5)}
#ptr small{font-size:12px;font-weight:800;background:var(--card2);color:var(--lilac);padding:5px 11px;border-radius:12px;white-space:nowrap}
#ptr.vuelve{transition:transform .25s ease,opacity .25s ease}
#ptr .giro{display:flex}
#ptr.girando .c svg{animation:gira .75s linear infinite}
@keyframes gira{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* Versión nueva */
.novedad{display:flex;align-items:center;gap:10px;background:rgba(124,77,255,.18);border:1px solid rgba(155,107,255,.45);color:var(--lilac);border-radius:16px;padding:10px 14px;font-size:13px;font-weight:700;width:100%;max-width:380px;text-align:left}
.novedad svg{flex:none}
.novedad b{color:var(--ink);font-weight:800}

/* ================= Actualización 3 ================= */
/* Gráficos: anillo, resaltar una categoría */
.arco{transition:opacity .25s ease,stroke-width .25s ease;cursor:pointer}
svg.resaltando .arco{opacity:.22}
svg.resaltando .arco.activo{opacity:1;stroke-width:22}
.cc-grande,.cc-chico{transition:opacity .3s ease}
/* Chips de categoría: grandes, con monto y % */
.leg-it{border:0;background:transparent;color:var(--ink);font:inherit;display:flex;align-items:center;gap:8px;text-align:left;padding:0;min-width:0}
.leg-it i{width:10px;height:10px;border-radius:50%;flex:none}
.leg-it .n{font-weight:700}
.leg-it .m{font-weight:700;color:var(--soft)}
.leg-it b{font-weight:900}
.cats .leg-it,.tarj-cat.abierta .leg-it{background:var(--card2);border-radius:22px;padding:9px 14px;font-size:15px;gap:7px;flex:none;white-space:nowrap;max-width:100%}
.cats .leg-it .n,.tarj-cat.abierta .leg-it .n{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cats .leg-it[aria-pressed="true"],.tarj-cat.abierta .leg-it[aria-pressed="true"]{background:var(--ink);color:var(--bg2)}
.cats .leg-it[aria-pressed="true"] .m,.tarj-cat.abierta .leg-it[aria-pressed="true"] .m{color:var(--card3)}
.cats .leg-it .m::before,.tarj-cat.abierta .leg-it .m::before{content:'· '}
.cats .leg-it b::before,.tarj-cat.abierta .leg-it b::before{content:'· ';font-weight:700}
/* Tarjeta "Por categoría" de Inicio: chica / agrandada */
.tarj-cat{cursor:pointer}
.tarj-cat h2{display:flex;align-items:center;justify-content:space-between}
.tarj-cat .expandir{width:34px;height:34px;border-radius:11px;background:var(--card2);color:var(--lilac);display:flex;align-items:center;justify-content:center;transition:transform .8s ease}
.tarj-cat.abierta .expandir{transform:rotate(180deg)}
.cat-cuerpo{display:flex;align-items:center;gap:16px}
.cat-graf{flex:none;display:flex;justify-content:center}
.cat-graf svg{width:118px;height:118px;display:block}
.cat-ley{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;font-size:13px}
.tarj-cat:not(.abierta) .leg-it{width:100%}
.tarj-cat:not(.abierta) .leg-it .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tarj-cat:not(.abierta) .leg-it .m{display:none}
.tarj-cat .arco,.tarj-cat .base{stroke-width:28;transition:stroke-width .8s ease,opacity .25s ease}
.tarj-cat.abierta .cat-cuerpo{flex-direction:column;gap:16px}
.tarj-cat.abierta .cat-graf svg{width:220px;height:220px}
.tarj-cat.abierta .cat-ley{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px}
.tarj-cat.abierta .arco,.tarj-cat.abierta .base{stroke-width:15}
.tarj-cat.abierta svg.resaltando .arco.activo{stroke-width:22}
.tarj-cat:not(.abierta) .cc-grande{opacity:0}
.tarj-cat.abierta .cc-chico{opacity:0}
.tarj-cat.animando{transition:height .8s cubic-bezier(.33,.9,.3,1);overflow:hidden}
.tarj-cat.animando .cat-graf svg{transition:transform .8s cubic-bezier(.33,.9,.3,1)}
.tarj-cat.animando .leg-it{transition:transform .8s cubic-bezier(.33,.9,.3,1),opacity .55s ease .2s}
.ayuda-toca{font-size:12px;font-weight:700;color:var(--muted);text-align:center;margin-top:10px}
.tarj-cat.abierta .ayuda-toca{margin-top:14px}
/* Tarjetas tipo acordeón al llegar arriba o abajo */
.vista>*{will-change:auto}
.vista.estirando>*{transition:none!important}
.vista.volviendo>*{transition:transform .5s cubic-bezier(.25,1.45,.45,1)}
/* Interruptor (letra grande) */
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:var(--card);border-radius:22px;padding:16px;color:var(--ink);text-align:left}
.interruptor span{display:flex;flex-direction:column;gap:3px}
.interruptor b{font-size:16px;font-weight:800}
.interruptor small{font-size:12px;font-weight:600;color:var(--muted)}
.switch{width:52px;height:30px;border-radius:15px;background:var(--card3);position:relative;flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.interruptor[aria-checked="true"] .switch{background:var(--violet)}
.interruptor[aria-checked="true"] .switch::after{transform:translateX(22px)}
/* Letra grande: agranda todo un 15% */
body.grande .vista,body.grande .vidrio,body.grande .login-box,body.grande #patron>*{zoom:1.15}
body.grande nav.barra{zoom:1.1}

/* ================= Actualización 4 ================= */
/* Mes tocable (Personal / Negocio) y calendario con meses y años */
.per-btn{border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:800;padding:9px 12px;border-radius:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.per-btn svg{color:var(--lilac)}
.nav-per .per-btn{width:auto;height:44px;background:transparent;padding:0 12px}
.cal-tit{border:0;background:rgba(255,255,255,.06);color:var(--ink);font-size:17px;font-weight:800;padding:9px 14px;border-radius:12px;display:flex;align-items:center;gap:6px}
.cal-tit svg{color:var(--lilac)}
.cal-grilla{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cal-grilla button{border:0;border-radius:14px;background:rgba(255,255,255,.06);color:var(--ink);font-size:16px;font-weight:800;padding:16px 0}
.cal-grilla button.hoy{box-shadow:inset 0 0 0 2px var(--violet2);color:var(--lilac)}
.cal-grilla button[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:none}
/* Avatar tocable */
button.avatar{border:0;padding:0}
/* Últimos gastos: Consultar todos */
.h2-link{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ver-todos{border:0;background:transparent;color:var(--lilac);font-size:14px;font-weight:800;padding:6px 8px;border-radius:10px;display:flex;align-items:center;gap:2px}
/* Pantalla "Todos los movimientos" */
.titulo-todos{display:flex;align-items:center;gap:10px}
.titulo-todos h1{margin:0;font-size:22px;font-weight:900}
.volver{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.buscar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:0 14px;color:var(--muted)}
.buscar input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:600;padding:13px 0}
.buscar input:focus{outline:none}
.buscar:focus-within{border-color:var(--violet2);box-shadow:0 0 0 3px rgba(124,77,255,.3)}
.filtro-tipo{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filtro-tipo button{flex:none;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:8px 13px;background:transparent;color:var(--soft);font-weight:700;font-size:13px}
.filtro-tipo button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:800}
.fecha-grupo{margin:0 0 6px;font-size:15px;font-weight:800;color:var(--soft)}
/* Detalle de un gasto */
.det-cab{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:4px 0 6px}
.det-cab span{font-size:16px;font-weight:700;color:var(--soft)}
.det-cab b{font-size:34px;font-weight:900;letter-spacing:-.5px}
.det-cab b.pos{color:var(--teal2)}
.det-filas{background:rgba(11,9,22,.45);border-radius:18px;padding:4px 14px}
.det-filas .fila-p b{max-width:60%;overflow-wrap:anywhere}

/* ================= Actualización 5: ayudante ================= */
.robot{position:fixed;right:14px;bottom:calc(98px + var(--safe-b));z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(176,71,217,.5),0 0 0 3px rgba(14,11,26,.9)}
@media (prefers-reduced-motion:no-preference){.robot{animation:saluda 2.4s ease-in-out 1s 2}@keyframes saluda{0%,100%{translate:0 0}20%{translate:0 -6px}40%{translate:0 0}}}
#guia{position:fixed;inset:0;z-index:25;pointer-events:none}
.guia-luz{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(8,6,16,.66);transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease;pointer-events:none}
.guia-luz::after{content:'';position:absolute;inset:-4px;border-radius:22px;border:3px solid var(--lilac)}
@media (prefers-reduced-motion:no-preference){.guia-luz::after{animation:latido 1.4s ease-in-out infinite}@keyframes latido{50%{inset:-9px;opacity:.35}}}
.guia-globo{position:fixed;pointer-events:auto;width:min(330px,calc(100vw - 24px));background:var(--ink);color:#1A1530;border-radius:20px;padding:12px 14px 12px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px;transition:left .25s ease,top .25s ease}
.guia-globo::before{content:'';position:absolute;left:var(--ax,50%);width:16px;height:16px;background:var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.guia-globo.abajo::before{top:-6px}
.guia-globo.arriba::before{bottom:-6px}
.guia-globo.centro::before{display:none}
.guia-top{display:flex;align-items:center;gap:8px}
.guia-top .guia-cara{width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.guia-top small{flex:1;font-size:12px;font-weight:800;color:#6A5F92}
.guia-x{width:34px;height:34px;border-radius:11px;border:0;background:#E4DDFA;color:#1A1530;display:flex;align-items:center;justify-content:center}
.guia-txt{margin:0;font-size:18px;font-weight:700;line-height:1.35}
.guia-txt b{color:#5B2FD6;font-weight:900}
.guia-globo.largo .guia-txt{font-size:16px;font-weight:600}
.guia-acc{display:flex;gap:8px;justify-content:flex-end}
.guia-acc button{border:0;border-radius:13px;padding:11px 16px;font-weight:800;font-size:15px}
.guia-listo{background:var(--violet);color:#fff}
.guia-saltar{background:transparent;color:#5B4F86}
.guia-globo.sacude{animation:sacude .35s}
.opcion.chica{padding:13px 14px}
.opcion.chica .oi{width:40px;height:40px;border-radius:13px}
.opcion.chica b{font-size:16px}

/* ================= Actualización 6: modo simple ================= */
body.simple nav.barra,body.simple #robot{display:none!important}
.s-cab{display:flex;align-items:center;gap:12px}
.s-cab .saludo b{font-size:24px;font-weight:900}
.s-cab .saludo small{font-size:15px}
.s-grande{display:flex;align-items:center;gap:16px;width:100%;border:0;border-radius:24px;padding:18px 16px;color:#fff;text-align:left;min-height:100px}
.s-grande .oi{width:60px;height:60px;border-radius:18px;background:rgba(14,11,26,.24);display:flex;align-items:center;justify-content:center;flex:none;font-size:32px;line-height:1}
.s-grande span.tx{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.s-grande b{font-size:21px;font-weight:900;line-height:1.15}
.s-grande small{font-size:14px;font-weight:600;opacity:.92;line-height:1.3}
.s-efe{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;border-radius:22px;padding:16px 18px;background:var(--tealbg);color:var(--tealink);text-align:left}
.s-efe span{display:flex;flex-direction:column;gap:2px}
.s-efe small{font-size:13px;font-weight:700}
.s-efe b{font-size:26px;font-weight:900;color:#fff}
.s-efe em{font-style:normal;font-size:13px;font-weight:800;background:rgba(255,255,255,.12);padding:8px 12px;border-radius:12px;white-space:nowrap}
.deuda{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:22px;padding:16px 18px;background:rgba(255,181,71,.14);border:1px solid rgba(255,181,71,.4)}
.deuda span{display:flex;flex-direction:column;gap:2px;min-width:0}
.deuda small{font-size:13px;font-weight:700;color:var(--amber)}
.deuda b{font-size:24px;font-weight:900}
.deuda button{border:0;border-radius:14px;padding:12px 16px;background:var(--amber);color:#2A1A00;font-weight:900;font-size:15px;flex:none}
.s-ver{font-size:18px;min-height:60px}
/* Una pregunta por pantalla */
.f-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.f-atras{border:0;background:var(--card);color:var(--ink);font-weight:800;font-size:16px;border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:4px}
.f-puntos{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.f-puntos i{width:10px;height:10px;border-radius:50%;background:var(--card3)}
.f-puntos i.on{background:var(--violet2)}
.f-puntos i.hecho{background:var(--lilac)}
.f-tit{font-size:15px;font-weight:800;color:var(--lilac);display:flex;align-items:center;gap:8px;margin-top:6px}
.f-preg{font-size:28px;font-weight:900;line-height:1.2;margin:0}
.f-ayuda{font-size:16px;color:var(--soft);font-weight:600;margin:-4px 0 0;line-height:1.4}
.f-num,.f-txt{width:100%;border:2px solid var(--violet2);background:rgba(11,9,22,.5);color:var(--ink);border-radius:20px;padding:16px 18px;font-weight:900}
.f-num{font-size:38px}
.f-txt{font-size:22px;font-weight:700}
.f-num:focus,.f-txt:focus{outline:none;box-shadow:0 0 0 4px rgba(124,77,255,.35)}
.f-ops{display:flex;flex-direction:column;gap:12px}
.f-grilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f-op{border:2px solid rgba(255,255,255,.12);background:var(--card);color:var(--ink);border-radius:20px;padding:18px 16px;font-size:20px;font-weight:800;text-align:left;min-height:68px;display:flex;align-items:center;gap:12px}
.f-grilla .f-op{font-size:17px;padding:14px 12px;min-height:76px;justify-content:center;text-align:center}
.f-op[aria-pressed="true"]{border-color:var(--violet2);background:rgba(124,77,255,.28)}
.f-sig{font-size:20px;min-height:64px;border-radius:20px}
.f-error{background:rgba(255,107,129,.16);color:#FFB3BF;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:800}
.f-res{background:var(--card);border-radius:22px;padding:6px 18px}
.f-res .fila-p{font-size:17px;padding:14px 0}
.f-res .fila-p b{font-size:18px}
.f-fecha{border:0;background:transparent;color:var(--lilac);font-weight:800;font-size:16px;text-decoration:underline;padding:6px;align-self:center}
/* Elegir modo */
.modo-op{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;border:2px solid rgba(255,255,255,.14);border-radius:22px;padding:18px;background:var(--card2);color:var(--ink);text-align:left}
.modo-op b{font-size:21px;font-weight:900}
.modo-op small{font-size:15px;font-weight:600;color:var(--soft);line-height:1.35}
.modo-op.sim{border-color:var(--violet2);background:rgba(124,77,255,.22)}

/* ================= Actualización 8: campo de plata (estilo Ualá) ================= */
.plata{position:relative}
.plata-in{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;font-size:16px;caret-color:transparent;cursor:text}
.plata-ver{display:flex;align-items:center;min-height:50px;border:1px solid rgba(255,255,255,.12);background:rgba(11,9,22,.5);border-radius:14px;padding:10px 12px;font-size:21px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.plata-ver sup{font-size:.55em;position:relative;top:-.15em;vertical-align:super;margin-left:1px;font-weight:800}
.pv{display:inline-flex;align-items:flex-start}
.pv.vacio{color:var(--dim)}
.plata:focus-within .plata-ver{border-color:var(--violet2);box-shadow:0 0 0 3px rgba(124,77,255,.3)}
.plata:focus-within .pv::after{content:'';align-self:center;width:2px;height:1em;background:var(--lilac);margin-left:4px;animation:parpadeo 1s steps(1) infinite}
@keyframes parpadeo{50%{opacity:0}}
.plata.grande .plata-ver{font-size:40px;font-weight:900;border:2px solid var(--violet2);border-radius:20px;padding:12px 18px;min-height:84px}
.plata.efe .plata-ver{border-color:var(--teal2);font-size:28px}

/* Gastos que Google rechazó */
.esperando.mal{color:#FFB3BF;background:rgba(255,107,129,.16)}
.sync.mal{background:rgba(255,107,129,.16);color:#FFB3BF}
</style>
</head>
<body>

<!-- ============ ENTRAR / CREAR CUENTA ============ -->
<section id="login" class="pantalla" hidden>
  <div class="login-box">
    <div class="novedad" id="novLogin" hidden></div>
    <div class="marca">
      <img src="icon-192.png" alt="">
      <h1>Billetera Digital</h1>
      <p id="loginSub">Entrá con tu usuario y contraseña</p>
    </div>
    <div class="segm" role="group" aria-label="Entrar o crear cuenta">
      <button type="button" id="tabEntrar" aria-pressed="true">Entrar</button>
      <button type="button" id="tabCrear" aria-pressed="false">Crear cuenta</button>
    </div>

    <form id="formEntrar" class="login-box" novalidate>
      <label class="campo" for="eUsuario">Usuario<input id="eUsuario" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <div class="campo"><label for="eClave">Contraseña</label><div class="clave"><input id="eClave" type="password" autocomplete="current-password"><button type="button" class="ojo" data-ojo="eClave" aria-label="Mostrar contraseña" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <div class="error" id="eError" hidden></div>
      <button class="btn btn-grad" id="eBtn" type="submit">Entrar</button>
    </form>

    <form id="formCrear" class="login-box" novalidate hidden>
      <label class="campo" for="cNombre">Nombre y apellido<input id="cNombre" autocomplete="name"></label>
      <div id="cNegocioBox"></div>
      <label class="campo" for="cUsuario">Usuario<input id="cUsuario" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Ej: rina"></label>
      <div class="campo"><label for="cClave">Contraseña</label><div class="clave"><input id="cClave" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"><button type="button" class="ojo" data-ojo="cClave,cClave2" aria-label="Mostrar las contraseñas" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <label class="campo" for="cClave2">Repetí la contraseña<input id="cClave2" type="password" autocomplete="new-password"></label>
      <div class="error" id="cError" hidden></div>
      <div class="ok" id="cOk" hidden></div>
      <button class="btn btn-grad" id="cBtn" type="submit">Crear cuenta</button>
    </form>
  </div>
</section>

<!-- ============ PATRÓN ============ -->
<section id="patron" class="pantalla" hidden>
  <div class="novedad" id="novPatron" hidden></div>
  <div class="avatar" id="patAvatar"></div>
  <h2 id="patTitulo">Dibujá tu patrón</h2>
  <p class="ayuda" id="patAyuda"></p>
  <svg id="patronSvg" viewBox="0 0 300 300" role="img" aria-label="Grilla de 9 puntos para dibujar el patrón"></svg>
  <button class="btn btn-ghost" type="button" id="patOlvide">Olvidé mi patrón · Entrar con contraseña</button>
</section>

<!-- ============ BIENVENIDA ============ -->
<section id="bienvenida" class="pantalla" hidden>
  <span>Te damos la bienvenida</span>
  <b id="bvNombre"></b>
</section>

<!-- ============ APP ============ -->
<div id="app" hidden>

<script>
'use strict';
/* =========================================================
   Estado
   ========================================================= */
const API = window.BILLETERA_API || '';
// Fecha y hora de esta versión (se muestra una vez cuando alguien abre la app actualizada)
const APP_VERSION = '2026-10-27T22:45';
const COLORES = ['#9B6BFF', '#F05BB5', '#3FD6C6', '#FFB547', '#6FA8FF', '#FF8A5B', '#B5E36B', '#D7C8FF'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const LISTAS_BASE = {

};
const S = {
  token: '', yo: null, listas: LISTAS_BASE, personal: [], negocio: [], pendientes: 0, ultimaSync: 0,
  cola: [], vista: 'inicio', per: { tipo: 'mes', ref: hoy() }, viaje: '', filtro: '',
  sincronizando: false, form: null, rech: [], catAbierta: false, firmas: {}, resaltes: {}
};
const $ = id => document.getElementById(id);
const pesos = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 2 });
const fmt = n => pesos.format(Math.round((Number(n) || 0) * 100) / 100);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Guardado en el celular ---------- */
const LS = {
  get(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const kEstado = () => 'bd_estado_' + (S.yo ? S.yo.usuario : '');
const kCola = () => 'bd_cola_' + (S.yo ? S.yo.usuario : '');
const kRech = () => 'bd_rech_' + (S.yo ? S.yo.usuario : '');
function guardarEstado() {
  LS.set(kEstado(), { yo: S.yo, listas: S.listas, personal: S.personal, negocio: S.negocio, pendientes: S.pendientes, ultimaSync: S.ultimaSync });
}
function guardarCola() { LS.set(kCola(), S.cola); }
// Modo simple / completo: lo pendiente de subir manda; después lo de Google; si no, lo guardado en el celular
const kModoPend = () => 'bd_modo_pend_' + (S.yo ? S.yo.usuario : '');
const kModo = () => 'bd_modo_' + (S.yo ? S.yo.usuario : '');
function modoActual() { return S.yo ? (LS.get(kModoPend(), '') || S.yo.modo || LS.get(kModo(), '')) : ''; }
const esSimple = () => modoActual() === 'simple';
function aplicarModo() { document.body.classList.toggle('simple', esSimple()); if (typeof pintarRobot === 'function') pintarRobot(); }
function setModo(m) {
  LS.set(kModoPend(), m); LS.set(kModo(), m);
  if (S.yo) S.yo.modo = m;
  guardarEstado(); aplicarModo();
  S.flujo = null; irA('inicio'); sincronizar();
}
function guardarRech() { LS.set(kRech(), S.rech); }
const rechDe = id => S.rech.find(z => z.op.id === id);

/* ---------- Fechas ---------- */
function hoy() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function aFecha(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function aISO(d) { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); }
function fCorta(s) { const d = aFecha(s); return d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3); }
function ayer() { const d = aFecha(hoy()); d.setDate(d.getDate() - 1); return aISO(d); }
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
function fLarga(s) {
  if (!s) return 'Elegí la fecha';
  const d = aFecha(s), base = d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3) + ' ' + d.getFullYear();
  return s === hoy() ? 'Hoy · ' + base : s === ayer() ? 'Ayer · ' + base : base;
}
function rango(p) {
  const d = aFecha(p.ref);
  if (p.tipo === 'dia') return [p.ref, p.ref];
  if (p.tipo === 'semana') {
    const dia = (d.getDay() + 6) % 7;
    const ini = new Date(d); ini.setDate(d.getDate() - dia);
    const fin = new Date(ini); fin.setDate(ini.getDate() + 6);
    return [aISO(ini), aISO(fin)];
  }
  return [aISO(new Date(d.getFullYear(), d.getMonth(), 1)), aISO(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
}
function etiquetaPer(p) {
  const d = aFecha(p.ref);
  if (p.tipo === 'dia') return d.getDate() + ' de ' + MESES[d.getMonth()] + ' ' + d.getFullYear();
  if (p.tipo === 'semana') { const [a, b] = rango(p); return fCorta(a) + ' – ' + fCorta(b); }
  const m = MESES[d.getMonth()]; return m[0].toUpperCase() + m.slice(1) + ' ' + d.getFullYear();
}
function moverPer(p, paso) {
  const d = aFecha(p.ref);
  if (p.tipo === 'dia') d.setDate(d.getDate() + paso);
  else if (p.tipo === 'semana') d.setDate(d.getDate() + 7 * paso);
  else { d.setDate(1); d.setMonth(d.getMonth() + paso); }
  return { tipo: p.tipo, ref: aISO(d) };
}

/* ---------- Números ---------- */
function num(txt) {
  let s = String(txt == null ? '' : txt).replace(/[$\s%]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g, '');
  return Number(s);
}
const r2 = n => Math.round(n * 100) / 100;
// ---------- Campo de plata estilo Ualá: los números entran por la derecha (centavos chiquitos arriba) ----------
const aCentavos = v => { const t = String(v == null ? '' : v).trim(); if (!t) return ''; const n = num(t); return isNaN(n) ? '' : String(Math.round(n * 100)); };
const deCentavos = c => c === '' ? '' : (Number(c) / 100).toFixed(2);
function verPlata(c) {
  if (c === '') return `<span class="pv vacio"><span>$ 0</span><sup>,00</sup></span>`;
  const n = Number(c), ent = Math.floor(n / 100), dec = String(n % 100).padStart(2, '0');
  return `<span class="pv"><span>$ ${ent.toLocaleString('es-AR')}</span><sup>,${dec}</sup></span>`;
}
function plataHTML(id, valor, attrs, clase) {
  const c = aCentavos(valor);
  return `<div class="plata${clase ? ' ' + clase : ''}"><span class="plata-ver" aria-hidden="true">${verPlata(c)}</span><input id="${id}" class="plata-in" inputmode="numeric" autocomplete="off" value="${c}" ${attrs || ''}></div>`;
}
function normalizarPlata(el) {
  let d = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 13);
  el.value = d;
  try { el.setSelectionRange(d.length, d.length); } catch (e) {}
  const ver = el.parentNode.querySelector('.plata-ver'); if (ver) ver.innerHTML = verPlata(d);
  return deCentavos(d);
}
const valorDe = el => el.classList && el.classList.contains('plata-in') ? deCentavos(el.value) : el.value;
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('plata-in')) { const L = e.target.value.length; setTimeout(() => { try { e.target.setSelectionRange(L, L); } catch (x) {} }, 0); } });
const pct = n => (Number(n) || 0).toLocaleString('es-AR', { maximumFractionDigits: 2 }) + '%';

/* =========================================================
   Hablar con Google (Apps Script)
   ========================================================= */
async function api(datos) {
  if (!API || API.indexOf('http') !== 0) throw Object.assign(new Error('Falta pegar el link de Apps Script en config.js.'), { config: true });
  let r;
  try {
    r = await fetch(API, { method: 'POST', body: JSON.stringify(datos) });
  } catch (e) { throw Object.assign(new Error('Sin conexión.'), { red: true }); }
  let j;
  try { j = await r.json(); } catch (e) { throw Object.assign(new Error('Sin conexión.'), { red: true }); }
  if (!j.ok) throw Object.assign(new Error(j.error || 'Algo salió mal.'), { sesionVencida: !!j.sesionVencida });
  return j;
}

/* =========================================================
   Cálculos (iguales a los del cerebro, para ver todo al instante sin internet)
   ========================================================= */
function calcNegocio(d, previo) {
  const f = Object.assign({}, previo || {}, {
    id: d.id, fecha: d.fecha, viaje: d.viaje || '', tipo: d.tipo, negocio: d.negocio, usuario: d.usuario,
    categoria: '', descripcion: '', unidades: '', costoUnit: '', monto: 0, pago: '', pctRecargo: '', recargo: 0,
    pctCambio: '', comision: 0, recibido: 0, gastoReal: 0, movEfectivo: 0
  });
  if (d.tipo === 'Inversión') {
    f.categoria = 'Productos'; f.descripcion = d.descripcion; f.unidades = d.unidades; f.monto = d.monto;
    f.costoUnit = r2(d.monto / d.unidades); f.pago = d.pago;
    if (d.pago === 'Transferencia' && d.pctRecargo !== '') { f.pctRecargo = d.pctRecargo; f.recargo = r2(d.monto * d.pctRecargo / 100); }
    f.gastoReal = d.monto; f.movEfectivo = d.pago === 'Efectivo' ? -d.monto : 0;
  } else if (d.tipo === 'No reversible') {
    f.categoria = d.categoria; f.descripcion = d.descripcion; f.monto = d.monto; f.pago = d.pago;
    f.gastoReal = d.monto; f.movEfectivo = d.pago === 'Efectivo' ? -d.monto : 0;
  } else if (d.tipo === 'Cambio') {
    f.categoria = 'Interés/Gastos'; f.descripcion = (d.nota || '').trim() || 'Cambio a efectivo'; f.monto = d.monto; f.pago = 'Transferencia';
    if (d.recibido !== undefined && d.recibido !== '') { f.recibido = d.recibido; f.comision = r2(d.monto - d.recibido); f.pctCambio = r2(f.comision / d.monto * 100); f.movEfectivo = f.recibido; }
    else {
      f.pctCambio = d.pctCambio; f.comision = r2(d.monto * d.pctCambio / 100);
      // Comisión en efectivo: te dan todo y pagás la comisión con billetes que ya tenías. El efectivo neto queda igual.
      if (d.pagoComision === 'Efectivo') { f.pago = 'Efectivo'; f.recibido = d.monto; f.movEfectivo = r2(d.monto - f.comision); }
      else { f.recibido = r2(d.monto - f.comision); f.movEfectivo = f.recibido; }
    }
    f.gastoReal = f.comision;
  } else if (d.tipo === 'Devolución') {
    f.categoria = 'Devolución'; f.descripcion = (d.nota || '').trim() || 'Devolución al negocio';
    f.monto = d.monto; f.pago = 'Efectivo'; f.movEfectivo = d.monto;
  } else if (d.tipo === 'Ajuste') {
    f.categoria = 'Ajuste de efectivo'; f.descripcion = d.inicial ? 'Efectivo inicial' : 'Ajuste de efectivo';
    f.monto = d.monto; f.pago = 'Efectivo'; f.movEfectivo = r2(d.monto - efectivoDe(d.negocio, d.id));
  }
  return f;
}
function efectivoDe(negocio, sinId) {
  return r2(S.negocio.filter(f => f.negocio === negocio && f.id !== sinId).reduce((s, f) => s + (Number(f.movEfectivo) || 0), 0));
}
// Gasto que cuenta para totales y gráficos de una fila de Negocio
function partesNegocio(f) {
  const out = [];
  if (f.tipo === 'Inversión') { out.push(['Productos', Number(f.monto) || 0, 'rec']); if (Number(f.recargo)) out.push(['Interés/Gastos', Number(f.recargo), 'no']); }
  else if (f.tipo === 'No reversible') out.push([f.categoria, Number(f.gastoReal) || 0, 'no']);
  else if (f.tipo === 'Cambio') out.push(['Interés/Gastos', Number(f.comision) || 0, 'no']);
  return out;
}
// Lo que se debe al negocio: gastos personales "a devolver" menos lo ya devuelto
function deudaDe(neg) {
  const usado = S.personal.filter(f => f.negocio === neg && f.devolver === 'sí').reduce((s, f) => s + (Number(f.monto) || 0), 0);
  const devuelto = S.negocio.filter(f => f.negocio === neg && f.tipo === 'Devolución').reduce((s, f) => s + (Number(f.monto) || 0), 0);
  return r2(Math.max(0, usado - devuelto));
}
const totalNegocio = f => partesNegocio(f).reduce((s, p) => s + p[1], 0);

/* =========================================================
   Cola de cambios (funciona sin internet)
   ========================================================= */
function nuevoId() { return (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).slice(0, 14); }

function encolar(op) {
  op.opId = nuevoId();
  if (rechDe(op.id)) { S.rech = S.rech.filter(z => z.op.id !== op.id); guardarRech(); }
  S.cola.push(op); guardarCola();
  aplicarLocal(op); guardarEstado();
  render();
  sincronizar();
}
function aplicarLocal(op) {
  const lista = op.hoja === 'negocio' ? S.negocio : S.personal;
  const i = lista.findIndex(f => f.id === op.id);
  if (op.tipo === 'borrar') { if (i >= 0) lista.splice(i, 1); return; }
  const previo = i >= 0 ? lista[i] : null;
  const base = { id: op.id, usuario: previo ? previo.usuario : S.yo.usuario,
    negocio: previo ? previo.negocio : (op.datos.negocio || S.yo.negocio), cargado: previo ? previo.cargado : new Date().toISOString() };
  let fila;
  if (op.hoja === 'negocio') fila = calcNegocio(Object.assign({}, op.datos, base), previo);
  else fila = Object.assign({}, previo || {}, op.datos, base);
  if (i >= 0) lista[i] = fila; else lista.push(fila);
}
const enCola = id => S.cola.some(o => o.id === id);

let timerSync = null;
async function sincronizar() {
  if (!S.token || S.sincronizando) return false;
  if (!navigator.onLine) { pintarSync(); return false; }
  S.sincronizando = true; pintarSync();
  const enviadas = S.cola.slice();
  let bien = false;
  try {
    const modoPend = LS.get(kModoPend(), '');
    const modoAntes = modoActual();
    const r = await api({ accion: 'sync', token: S.token, ops: enviadas, modo: modoPend || undefined });
    if (modoPend && r.yo && r.yo.modo === modoPend) LS.del(kModoPend()); // queda pendiente hasta que Google lo guarde
    if (r.yo && r.yo.modo) LS.set(kModo(), r.yo.modo);
    const procesadas = new Set((r.resultados || []).map(x => x.opId));
    const fallas = (r.resultados || []).filter(x => !x.ok);
    S.cola = S.cola.filter(o => !procesadas.has(o.opId)); guardarCola();
    // Lo que Google rechazó NO se pierde: queda en el celular, marcado en rojo, para corregirlo o borrarlo.
    let rechazados = 0;
    fallas.forEach(x => {
      const op = enviadas.find(o => o.opId === x.opId);
      if (!op || op.tipo !== 'guardar') return;
      S.rech = S.rech.filter(z => z.op.id !== op.id);
      S.rech.push({ op, error: x.error || 'Algo salió mal.' });
      rechazados++;
    });
    guardarRech();
    S.yo = r.yo; S.listas = Object.assign({}, LISTAS_BASE, r.listas); S.personal = r.personal; S.negocio = r.negocio;
    S.pendientes = r.pendientes || 0; S.ultimaSync = Date.now();
    if (modoActual() !== modoAntes) { aplicarModo(); if (!$('app').hidden) { S.flujo = null; S.vista = 'inicio'; } }
    S.rech.forEach(z => aplicarLocal(z.op));
    S.cola.forEach(aplicarLocal);
    guardarEstado();
    if (rechazados) avisar(rechazados === 1 ? 'Un gasto no se pudo subir: quedó marcado en rojo para corregirlo.' : rechazados + ' gastos no se pudieron subir: quedaron marcados en rojo.');
    bien = true;
  } catch (e) {
    if (e.sesionVencida) { cerrarSesionLocal(e.message); }
    else if (e.config) avisar(e.message);
  } finally {
    S.sincronizando = false;
    if (S.token) { render(); }
  }
  // Si se cargó algo mientras subía, se sube enseguida; si algo falló, se reintenta en 15 segundos
  if (S.cola.length && navigator.onLine) { clearTimeout(timerSync); timerSync = setTimeout(sincronizar, S.cola.some(o => !enviadas.includes(o)) ? 300 : 15000); }
  return bien;
}
window.addEventListener('online', () => sincronizar());
window.addEventListener('offline', () => pintarSync());
setInterval(() => { if (S.token && navigator.onLine) sincronizar(); }, 60000);

/* =========================================================
   Pantallas
   ========================================================= */
function mostrar(id) { ['login', 'patron', 'bienvenida', 'app'].forEach(x => $(x).hidden = x !== id); }
function avisar(t) { const a = $('aviso'); a.textContent = t; a.hidden = false; clearTimeout(avisar.t); avisar.t = setTimeout(() => a.hidden = true, 3200); }
function iniciales(n) { return String(n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase(); }
function primerNombre(n) { return String(n || '').trim().split(/\s+/)[0] || ''; }

/* ---------- Entrar / crear cuenta ---------- */
// Ojito: muestra u oculta lo que se escribió en la contraseña

/* ---------- Patrón ---------- */
const PUNTOS = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => ({ x: 50 + (i % 3) * 100, y: 50 + Math.floor(i / 3) * 100 }));
const P = { modo: '', primero: '', fallos: 0, trazo: [], dibujando: false, pos: null };
async function sha(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function iniciarPatron(modo) {
  P.modo = modo; P.primero = ''; P.fallos = 0; P.trazo = [];
  mostrar('patron');
  $('patAvatar').textContent = iniciales(S.yo && S.yo.nombre);
  $('patOlvide').hidden = modo !== 'abrir';
  textoPatron();
  pintarPatron();
}
function textoPatron(extra) {
  const t = { crear: ['Creá tu patrón', 'Uní al menos 4 puntos. Lo vas a usar cada vez que abras la app.'],
    confirmar: ['Repetí el patrón', 'Dibujalo de nuevo para confirmar.'],
    abrir: ['Dibujá tu patrón', 'Hola, ' + primerNombre(S.yo && S.yo.nombre) + '.'] }[P.modo];
  $('patTitulo').textContent = t[0];
  $('patAyuda').textContent = extra || t[1];
}
function pintarPatron(error) {
  const svg = $('patronSvg');
  const col = error ? '#FF6B81' : '#B79CFF';
  let h = '';
  if (P.trazo.length) {
    const pts = P.trazo.map(i => PUNTOS[i].x + ',' + PUNTOS[i].y);
    if (P.dibujando && P.pos) pts.push(P.pos.x + ',' + P.pos.y);
    h += `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
  }
  PUNTOS.forEach((p, i) => {
    const on = P.trazo.includes(i);
    h += `<circle cx="${p.x}" cy="${p.y}" r="30" fill="${on ? 'rgba(124,77,255,.25)' : 'transparent'}"/>`;
    h += `<circle cx="${p.x}" cy="${p.y}" r="${on ? 13 : 9}" fill="${on ? col : '#4A4170'}"/>`;
  });
  svg.innerHTML = h;
  svg.classList.toggle('puntos-error', !!error);
}
function posPatron(ev) {
  const r = $('patronSvg').getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * 300, y: (ev.clientY - r.top) / r.height * 300 };
}
function tocarPunto(pos) {
  PUNTOS.forEach((p, i) => {
    if (!P.trazo.includes(i) && Math.hypot(p.x - pos.x, p.y - pos.y) < 34) P.trazo.push(i);
  });
}
$('patronSvg').addEventListener('pointerdown', ev => {
  ev.preventDefault(); $('patronSvg').setPointerCapture(ev.pointerId);
  P.dibujando = true; P.trazo = []; P.pos = posPatron(ev); tocarPunto(P.pos); pintarPatron();
});
$('patronSvg').addEventListener('pointermove', ev => {
  if (!P.dibujando) return; P.pos = posPatron(ev); tocarPunto(P.pos); pintarPatron();
});
const finPatron = async () => {
  if (!P.dibujando) return;
  P.dibujando = false; P.pos = null;
  const codigo = P.trazo.join('');
  if (P.trazo.length < 4) { textoPatron('Uní al menos 4 puntos.'); pintarPatron(true); return setTimeout(() => { P.trazo = []; pintarPatron(); }, 700); }
  const clave = 'bd_patron_' + S.yo.usuario;
  if (P.modo === 'crear') { P.primero = codigo; P.modo = 'confirmar'; P.trazo = []; textoPatron(); pintarPatron(); return; }
  if (P.modo === 'confirmar') {
    if (codigo !== P.primero) { P.modo = 'crear'; textoPatron('No coincidieron. Empezá de nuevo.'); pintarPatron(true); return setTimeout(() => { P.trazo = []; pintarPatron(); }, 700); }
    LS.set(clave, await sha(S.yo.usuario + ':' + codigo));
    return bienvenida();
  }
  if (await sha(S.yo.usuario + ':' + codigo) === LS.get(clave, '')) { P.fallos = 0; return bienvenida(); }
  P.fallos++;
  pintarPatron(true);
  if (P.fallos >= 3) return setTimeout(() => cerrarSesionLocal('Te equivocaste 3 veces de patrón. Entrá con tu usuario y contraseña.'), 600);
  textoPatron('Patrón incorrecto. Te ' + (3 - P.fallos === 1 ? 'queda 1 intento.' : 'quedan ' + (3 - P.fallos) + ' intentos.'));
  setTimeout(() => { P.trazo = []; pintarPatron(); }, 700);
};
$('patronSvg').addEventListener('pointerup', finPatron);
$('patronSvg').addEventListener('pointercancel', finPatron);
$('patOlvide').onclick = () => { LS.del('bd_patron_' + S.yo.usuario); cerrarSesionLocal('Entrá con tu usuario y contraseña para crear un patrón nuevo.'); };

const svg = (n, s = 20, w = 1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
function icoDe(f, hojaN) {
  if (hojaN) {
    if (f.tipo === 'Inversión') return 'prod'; if (f.tipo === 'Cambio') return 'cambio'; if (f.tipo === 'Ajuste' || f.tipo === 'Devolución') return 'billetera';
    const c = (f.categoria || '').toLowerCase();
    if (c.includes('sueldo') || /comida|bebida/.test((f.descripcion || '').toLowerCase())) return 'comida';
    if (c.includes('insumo')) return /colectivo|chalana|pasero|bodega/.test((f.descripcion || '').toLowerCase()) ? 'bus' : 'bolsa';
    if (c.includes('inter')) return 'pct';
    return 'recibo';
  }
  const c = (f.categoria || '').toLowerCase();
  if (c.includes('casa')) return 'casa'; if (c.includes('comida')) return 'carro'; if (c.includes('salud')) return 'salud';
  if (c.includes('transp')) return 'bus';
  return 'recibo';
}

// Anillo con animación de dibujo, conteo del total y categorías tocables
const GRAF = {};
function anillo(id, items, total, o) {
  const tam = o.tam, g = o.grosor, cx = tam / 2, R = tam / 2 - (o.grosorMax || g) / 2 - 2, C = 2 * Math.PI * R;
  GRAF[id] = { items, total, o };
  let ac = 0, arcos = '';
  items.forEach(([, v], i) => {
    const largo = v / total * C, gap = items.length > 1 ? Math.min(4, largo / 3) : 0, vis = Math.max(largo - gap, 0.01);
    arcos += `<circle class="arco" data-seg="${i}" data-graf="${id}" data-ini="${ac}" data-len="${vis}" cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="${COLORES[i % COLORES.length]}" stroke-width="${g}" stroke-dasharray="${vis} ${C}" stroke-dashoffset="${-ac}" transform="rotate(-90 ${cx} ${cx})"/>`;
    ac += largo;
  });
  const L = String(o.valor).length, grande = L > 15 ? 17 : L > 13 ? 20 : L > 11 ? 23 : 27;
  const chico = o.chico ? `<g class="cc-chico"><text x="${cx}" y="${cx - 4}" text-anchor="middle" font-size="18" font-weight="700" fill="#A49CC4">${esc(o.chico[0])}</text><text x="${cx}" y="${cx + 22}" text-anchor="middle" font-size="22" font-weight="800" fill="#F4F1FF">${esc(o.chico[1])}</text></g>` : '';
  return `<svg data-graf="${id}" data-c="${C}" width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}" role="img" aria-label="Gráfico por categoría">
    <circle class="base" cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="#241D3F" stroke-width="${g}"/>${total ? arcos : ''}
    <g class="cc-grande"><text class="c1" x="${cx}" y="${cx - 12}" text-anchor="middle" font-size="13" font-weight="700" fill="#A49CC4">${esc(o.arriba)}</text>
    <text class="c2" x="${cx}" y="${cx + 16}" text-anchor="middle" font-size="${grande}" font-weight="900" fill="#F4F1FF">${esc(o.valor)}</text>
    <text class="c3" x="${cx}" y="${cx + 38}" text-anchor="middle" font-size="12" font-weight="700" fill="#B79CFF">${esc(o.abajo)}</text></g>${chico}</svg>`;
}
function legIt(id, [k, v], i, total) {
  return `<button type="button" class="leg-it" data-graf="${id}" data-seg="${i}" aria-pressed="false"><i style="background:${COLORES[i % COLORES.length]}"></i><span class="n">${esc(k)}</span><span class="m">${fmt(v)}</span><b>${Math.round(v / total * 100)}%</b></button>`;
}
const movs = n => n + ' movimiento' + (n === 1 ? '' : 's');
// Se anima solo cuando cambian los números o se entra a la pantalla (no cada vez que se actualiza solo)
function animarGraficos() {
  const reducir = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('#contenido svg[data-graf]').forEach(sv => {
    const id = sv.dataset.graf, G = GRAF[id]; if (!G) return;
    const firma = [G.total, G.o.arriba, G.items.map(x => x.join(':')).join(',')].join('|');
    const nueva = S.firmas[id] !== firma; S.firmas[id] = firma;
    aplicarResalte(id);
    if (!nueva || reducir || !G.total) return;
    const C = Number(sv.dataset.c), arcos = [...sv.querySelectorAll('.arco')];
    const L = arcos.reduce((m, a) => Math.max(m, Number(a.dataset.ini) + Number(a.dataset.len)), 0);
    const c2 = sv.querySelector('.c2'), t0 = performance.now(), dur = 900;
    const paso = ahora => {
      if (!sv.isConnected) return;
      const p = Math.min(1, (ahora - t0) / dur), e = 1 - Math.pow(1 - p, 3), hecho = L * e;
      arcos.forEach(a => a.setAttribute('stroke-dasharray', Math.max(0.001, Math.min(Number(a.dataset.len), hecho - Number(a.dataset.ini))) + ' ' + C));
      if (G.o.contar != null && !S.resaltes[id]) c2.textContent = p < 1 ? fmt(Math.round(G.o.contar * e)) : G.o.valor;
      if (p < 1) requestAnimationFrame(paso);
    };
    paso(t0); requestAnimationFrame(paso);
  });
}
function aplicarResalte(id) {
  const sv = document.querySelector(`#contenido svg[data-graf="${id}"]`), G = GRAF[id];
  if (!sv || !G) return;
  const nom = S.resaltes[id], idx = nom == null ? -1 : G.items.findIndex(x => x[0] === nom);
  if (idx < 0) delete S.resaltes[id];
  sv.classList.toggle('resaltando', idx >= 0);
  sv.querySelectorAll('.arco').forEach(a => a.classList.toggle('activo', Number(a.dataset.seg) === idx));
  document.querySelectorAll(`#contenido .leg-it[data-graf="${id}"]`).forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.seg) === idx));
  const c1 = sv.querySelector('.c1'), c2 = sv.querySelector('.c2'), c3 = sv.querySelector('.c3');
  if (idx >= 0) { const [k, v] = G.items[idx]; c1.textContent = k; c2.textContent = fmt(v); c3.textContent = Math.round(v / G.total * 100) + '% del total'; }
  else { c1.textContent = G.o.arriba; c2.textContent = G.o.valor; c3.textContent = G.o.abajo; }
}
function resaltar(el) {
  const id = el.dataset.graf, G = GRAF[id]; if (!G) return;
  const nom = G.items[Number(el.dataset.seg)][0];

}
// Agranda / achica la tarjeta "Por categoría" con animación (el gráfico va al centro y crece; las categorías bajan)
function alternarCat() {
  const card = $('tarjCat'); if (!card) return;
  const sv = card.querySelector('.cat-graf svg'), its = [...card.querySelectorAll('.leg-it')];
  const h0 = card.offsetHeight, r0 = sv.getBoundingClientRect(), p0 = its.map(e => e.getBoundingClientRect());
  S.catAbierta = !S.catAbierta;
  if (!S.catAbierta) { delete S.resaltes.inicio; aplicarResalte('inicio'); }
  card.classList.toggle('abierta', S.catAbierta);
  card.querySelector('.ayuda-toca').textContent = S.catAbierta ? 'Tocá un color para ver su monto · Tocá la tarjeta para achicar' : 'Tocá para agrandar';
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const h1 = card.offsetHeight, r1 = sv.getBoundingClientRect(), p1 = its.map(e => e.getBoundingClientRect());
  card.style.height = h0 + 'px';
  sv.style.transformOrigin = '0 0';
  sv.style.transform = `translate(${r0.left - r1.left}px,${r0.top - r1.top}px) scale(${r0.width / r1.width})`;
  its.forEach((e, i) => { e.style.transform = `translate(${p0[i].left - p1[i].left}px,${p0[i].top - p1[i].top}px)`; e.style.opacity = '0'; });
  void card.offsetHeight;
  card.classList.add('animando');
  card.style.height = h1 + 'px';
  sv.style.transform = '';
  its.forEach((e, i) => { e.style.transitionDelay = (i * 55) + 'ms'; e.style.transform = ''; e.style.opacity = ''; });
  clearTimeout(alternarCat.t);
  alternarCat.t = setTimeout(() => { card.classList.remove('animando'); card.style.height = ''; its.forEach(e => { e.style.transitionDelay = ''; }); }, 1300);
}
function dona(items, total, tam, grosor, centro) {
  const R = tam / 2 - grosor / 2 - 2, C = 2 * Math.PI * R, cx = tam / 2;
  let ac = 0, arcos = '';
  items.forEach(([, v], i) => {
    const largo = v / total * C, gap = items.length > 1 ? Math.min(4, largo / 3) : 0;
    arcos += `<circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="${COLORES[i % COLORES.length]}" stroke-width="${grosor}" stroke-dasharray="${Math.max(largo - gap, 0.01)} ${C}" stroke-dashoffset="${-ac}" transform="rotate(-90 ${cx} ${cx})"/>`;
    ac += largo;
  });
  return `<svg width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}" role="img" aria-label="Gráfico por categoría"><circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="#241D3F" stroke-width="${grosor}"/>${total ? arcos : ''}${centro || ''}</svg>`;
}
function agrupar(pares) {
  const m = {}; pares.forEach(([k, v]) => { if (v > 0) m[k] = (m[k] || 0) + v; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}
function topN(items, n) {
  if (items.length <= n) return items;
  const resto = items.slice(n - 1).reduce((s, x) => s + x[1], 0);
  return [...items.slice(0, n - 1), ['Otros', resto]];
}

function filaMov(f, hojaN) {

    monto: fila ? String(fila.monto || '') : '', pago: fila ? fila.pago : 'Transferencia', pctRecargo: fila ? String(fila.pctRecargo || '') : '',
    pctCambio: fila ? String(fila.pctCambio || '') : '', pagoComision: fila && fila.tipo === 'Cambio' && fila.pago === 'Efectivo' ? 'Efectivo' : 'Transferencia', nota: fila && fila.tipo === 'Cambio' ? notaCambio(fila) : '', abierto: '', confirmarBorrar: false, permitirSinEfectivo: false };

      ${f.pago === 'Transferencia' ? `<label class="campo" for="fPct">% recargo de la tienda (si te cobran)<input id="fPct" inputmode="decimal" data-campo="pctRecargo" value="${esc(f.pctRecargo)}" placeholder="Ej: 3"></label>` : ''}
      <div id="calcB">${c.b}</div>`;
  } else if (f.tipo === 'No reversible') {
    const cats = S.listas['Categorías no reversibles'] || [], descs = S.listas['Descripciones rápidas'] || [];
    cuerpo = `${fechaViaje}
      <div class="campo"><span id="lCat">Categoría</span><div class="dd">
        <button type="button" class="dd-btn" data-abrir="cat" aria-expanded="${f.abierto === 'cat'}" aria-labelledby="lCat">${f.categoria ? esc(f.categoria) : '<span style="color:var(--dim)">Elegí una categoría</span>'} ${svg(f.abierto === 'cat' ? 'arriba' : 'abajo', 18, 2.4)}</button>
        ${f.abierto === 'cat' ? `<div class="dd-lista" role="listbox">${cats.map(c => `<button type="button" role="option" aria-selected="${c === f.categoria}" data-set="categoria" data-val="${esc(c)}">${esc(c)}${c === f.categoria ? svg('tilde', 16, 2.6) : ''}</button>`).join('')}</div>` : ''}
      </div></div>
      <div class="campo"><label for="fDesc">Descripción</label><div class="dd">
        <div class="combo"><input id="fDesc" data-campo="descripcion" value="${esc(f.descripcion)}" placeholder="Escribí o elegí de la lista"><button type="button" data-abrir="desc" aria-label="Ver descripciones comunes" aria-expanded="${f.abierto === 'desc'}">${svg(f.abierto === 'desc' ? 'arriba' : 'abajo', 18, 2.4)}</button></div>
        ${f.abierto === 'desc' ? `<div class="dd-lista" role="listbox">${descs.map(c => `<button type="button" role="option" aria-selected="${c === f.descripcion}" data-set="descripcion" data-val="${esc(c)}">${esc(c)}${c === f.descripcion ? svg('tilde', 16, 2.6) : ''}</button>`).join('')}</div>` : ''}
      </div></div>
      <div class="campo"><label for="fMonto">Monto</label>${plataHTML('fMonto', f.monto, 'data-campo="monto"')}</div>

  } else {

      <div class="campo">¿Cómo pagaste la comisión?<div class="segm">${[['Efectivo', 'En efectivo', 'recibís todo'], ['Transferencia', 'Descontada', 'recibís menos']].map(([v, t, sub]) => `<button type="button" data-set="pagoComision" data-val="${v}" aria-pressed="${f.pagoComision === v}">${t}<small>${sub}</small></button>`).join('')}</div></div>

// Partes que se recalculan mientras escribís (sin redibujar la ventana)
function calcForm(f) {
  const ef = efectivoDe(f.negocio, f.editando ? f.id : null);
  if (f.tipo === 'Inversión') {
    const total = num(f.monto) > 0 ? num(f.monto) : 0, un = num(f.unidades), pct = num(f.pctRecargo);
    const rec = f.pago === 'Transferencia' && pct > 0 ? r2(total * pct / 100) : 0;
    return { a: total > 0 && un > 0 ? 'Sale a ' + fmt(total / un) + ' por unidad' : 'Poné el total que pagaste por todo.',
      b: `${f.pago === 'Efectivo' ? notaEfectivo(ef, total) : ''}<div class="caja" style="margin-top:${f.pago === 'Efectivo' ? 13 : 0}px"><div><span>Productos</span><span>${fmt(total)}</span></div>${rec ? `<div><span>Recargo (${pct}%)</span><span>${fmt(rec)}</span></div>` : ''}<div class="t"><span>Total pagado</span><b>${fmt(total + rec)}</b></div></div>` };
  }
  if (f.tipo === 'No reversible') return { b: f.pago === 'Efectivo' ? notaEfectivo(ef, num(f.monto)) : '' };
  const m = num(f.monto) > 0 ? num(f.monto) : 0, pc = num(f.pctCambio);
  const com = m > 0 && pc >= 0 ? r2(m * pc / 100) : 0, efe = f.pagoComision === 'Efectivo', rec = efe ? m : r2(m - com);
  return { b: `<div class="caja"><div><span>Comisión (cuenta como gasto)</span><span style="color:#FFB3D9;font-weight:800">-${fmt(com)}</span></div>${efe && com ? `<div><span>La pagás en efectivo</span><span>${fmt(com)}</span></div>` : ''}<div class="t"><span>Efectivo que recibís</span><b>${fmt(rec)}</b></div></div>
      <div class="efe-nota" style="margin-top:13px">Efectivo de ${esc(f.negocio)}: ${fmt(ef)} → <b>${fmt(r2(ef + m - com))}</b></div>` };
}
function notaEfectivo(ef, monto) {
  const queda = r2(ef - (monto > 0 ? monto : 0));
  return `<div class="efe-nota${queda < 0 ? ' mal' : ''}">Efectivo disponible: ${fmt(ef)}${monto > 0 ? ` → te quedan <b>${fmt(queda)}</b>` : ''}</div>`;
}
function guardarNegocio() {
  const f = S.form;
  const d = { negocio: f.negocio, tipo: f.tipo, fecha: f.fecha, viaje: (f.viaje || '').trim() };
  if (!d.fecha) return errorForm('Poné la fecha.');
  let saleEfectivo = 0;
  if (f.tipo === 'Inversión') {
    d.descripcion = f.descripcion.trim(); d.unidades = num(f.unidades); d.monto = num(f.monto); d.pago = f.pago;
    d.pctRecargo = f.pago === 'Transferencia' && f.pctRecargo.trim() ? num(f.pctRecargo) : '';
    if (!d.descripcion) return errorForm('Escribí qué producto compraste.');
    if (!(d.unidades > 0)) return errorForm('Poné las unidades.');
    if (!(d.monto > 0)) return errorForm('Poné el costo total.');
    if (d.pctRecargo !== '' && !(d.pctRecargo >= 0 && d.pctRecargo <= 100)) return errorForm('Revisá el % de recargo.');
    if (d.pago === 'Efectivo') saleEfectivo = d.monto;
  } else if (f.tipo === 'No reversible') {
    d.categoria = f.categoria; d.descripcion = f.descripcion.trim(); d.monto = num(f.monto); d.pago = f.pago;
    if (!d.categoria) return errorForm('Elegí una categoría.');
    if (!(d.monto > 0)) return errorForm('Poné el monto.');
    if (d.pago === 'Efectivo') saleEfectivo = d.monto;
  } else {
    d.monto = num(f.monto); d.pctCambio = num(f.pctCambio || '0'); d.nota = (f.nota || '').trim(); d.pagoComision = f.pagoComision === 'Efectivo' ? 'Efectivo' : 'Transferencia';
    if (!(d.monto > 0)) return errorForm('Poné cuánto transferiste.');
    if (!(d.pctCambio >= 0 && d.pctCambio <= 100)) return errorForm('Revisá el % del cambio.');
  }
  if (saleEfectivo && !f.permitirSinEfectivo) {
    const ef = efectivoDe(f.negocio, f.editando ? f.id : null);
    if (saleEfectivo > ef) return avisoSinEfectivo(saleEfectivo, ef);
  }
  if (d.viaje) LS.set('bd_viaje_' + S.yo.usuario, d.viaje);
  const volver = f.tipo === 'Cambio' ? S.volverA : null;

/* =========================================================
   Exportar a Excel
   ========================================================= */
function cargarXLSX() {
  return new Promise((ok, mal) => {
    if (window.XLSX) return ok();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = ok; s.onerror = () => mal(new Error('Para descargar el Excel la primera vez necesitás internet.'));
    document.head.appendChild(s);
  });
}
async function exportar(btn) {
  const porViaje = !!S.expViaje, val = valorExport();
  if (!val) return avisar('No hay nada para descargar todavía.');
  const neg = S.yo.admin ? (S.expNeg || '') : S.yo.negocio;
  const listo = cargando(btn, 'Preparando…');
  try { await cargarXLSX(); } catch (e) { listo(); return avisar(e.message); }
  listo();
  const filtra = f => (!neg || f.negocio === neg) && (porViaje ? f.viaje === val : String(f.fecha).slice(0, 7) === val);
  const N = S.negocio.filter(filtra).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const Pp = porViaje ? [] : S.personal.filter(f => (!neg || f.negocio === neg) && String(f.fecha).slice(0, 7) === val).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const negs = neg ? [neg] : (S.listas['Negocios'] || []);
  const resumen = [['Negocio', 'Inversión (recuperable)', 'Insumos', 'Sueldo', 'Interés/Gastos', 'Otros', 'Subtotal no reversible', 'TOTAL', 'Gastos personales', 'De esos, con plata del negocio']];
  negs.forEach(n => {
    const fs = N.filter(f => f.negocio === n), partes = fs.flatMap(partesNegocio);
    const suma = c => partes.filter(p => p[0] === c).reduce((s, p) => s + p[1], 0);
    const inv = suma('Productos'), ins = suma('Insumos'), su = suma('Sueldo'), it = suma('Interés/Gastos');
    const no = partes.filter(p => p[2] === 'no').reduce((s, p) => s + p[1], 0);
    const pn = Pp.filter(f => f.negocio === n);
    resumen.push([n, inv, ins, su, it, r2(no - ins - su - it), no, inv + no, pn.reduce((s, f) => s + Number(f.monto), 0), pn.filter(f => f.origen !== 'Personal').reduce((s, f) => s + Number(f.monto), 0)]);
  });
  const inv = [['Fecha', 'Negocio', 'Viaje', 'Descripción (producto)', 'Unidades', 'Precio de costo unitario', 'Precio de costo total', 'Pago', '% recargo', 'Recargo $']]
    .concat(N.filter(f => f.tipo === 'Inversión').map(f => [f.fecha, f.negocio, f.viaje, f.descripcion, Number(f.unidades), Number(f.costoUnit), Number(f.monto), f.pago, f.pctRecargo === '' ? '' : Number(f.pctRecargo), Number(f.recargo) || '']));
  const nor = [['Fecha', 'Negocio', 'Viaje', 'Categoría', 'Descripción', 'Pago', 'Gasto real']]
    .concat(N.filter(f => f.tipo === 'No reversible').map(f => [f.fecha, f.negocio, f.viaje, f.categoria, f.descripcion, f.pago, Number(f.gastoReal)]));
  const cam = [['Fecha', 'Negocio', 'Viaje', 'Nota', 'Transferido', '% del cambio', 'Comisión (gasto real)', 'Comisión pagada con', 'Efectivo recibido']]
    .concat(N.filter(f => f.tipo === 'Cambio').map(f => [f.fecha, f.negocio, f.viaje, notaCambio(f), Number(f.monto), Number(f.pctCambio), Number(f.comision), Number(f.comision) ? (f.pago === 'Efectivo' ? 'Efectivo' : 'Descontada') : '', Number(f.recibido)]));
  const per = [['Fecha', 'Negocio', 'Origen de la plata', 'Categoría', 'Descripción', 'Pago', 'Monto', 'A devolver']]
    .concat(Pp.map(f => [f.fecha, f.negocio, f.origen, f.categoria, f.descripcion, f.pago, Number(f.monto), f.devolver === 'sí' ? 'Sí' : '']));
  const dev = [['Fecha', 'Negocio', 'Nota', 'Devuelto']]
    .concat(N.filter(f => f.tipo === 'Devolución').map(f => [f.fecha, f.negocio, f.descripcion !== 'Devolución al negocio' ? f.descripcion : '', Number(f.monto)]));
  const wb = XLSX.utils.book_new();
  const hoja = (aoa, nombre, anchos) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = anchos.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, nombre); };
  hoja(resumen, 'Resumen', [20, 14, 12, 12, 14, 12, 16, 14, 16, 18]);
  hoja(inv, 'Inversiones', [12, 18, 16, 30, 10, 14, 14, 14, 10, 12]);
  hoja(nor, 'No reversibles', [12, 18, 16, 16, 26, 14, 12]);
  hoja(cam, 'Cambios', [12, 18, 16, 24, 14, 12, 18, 18, 16]);
  if (!porViaje) hoja(per, 'Personal', [12, 18, 22, 22, 26, 14, 12, 12]);
  if (dev.length > 1) hoja(dev, 'Devoluciones', [12, 18, 26, 14]);
  const nombre = 'Billetera_' + (neg || 'Todos').replace(/[^A-Za-z0-9]+/g, '-') + '_' + val.replace(/[^A-Za-z0-9]+/g, '-') + '.xlsx';
  XLSX.writeFile(wb, nombre);
  avisar('Excel descargado');
}

const FILTROS_TIPO = [['todos', 'Todos'], ['personal', 'Personal'], ['Inversión', 'Compras'], ['No reversible', 'No reversible'], ['Cambio', 'Cambios'], ['Efectivo', 'Efectivo'], ['Transferencia', 'Transferencia']];
function filasTodos() {

    add('Costo por unidad', fmt(f.costoUnit)); add('Costo total', fmt(f.monto));
    if (Number(f.recargo)) add(`Recargo de la tienda (${pct(f.pctRecargo)})`, fmt(f.recargo));
    add('Pago', f.pago);
  } else if (esN && f.tipo === 'No reversible') {

    add('Tipo', 'Gasto no reversible'); add('Categoría', f.categoria); add('Descripción', f.descripcion); add('Pago', f.pago);
  } else if (esN && f.tipo === 'Cambio') {
