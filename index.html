    add('Comisión (cuenta como gasto)', fmt(f.comision));
    if (Number(f.comision)) add('La comisión se pagó', f.pago === 'Efectivo' ? 'En efectivo' : 'Descontada de la transferencia');
    add('Efectivo recibido', fmt(f.recibido));
  } else if (esN && f.tipo === 'Devolución') {
    titulo = 'Devolución al negocio'; monto = f.monto; signo = '+';
    add('Tipo', 'Devolución al negocio'); if (f.descripcion !== 'Devolución al negocio') add('Nota', f.descripcion); add('Entró al efectivo', fmt(f.monto));
  } else if (esN) {
    titulo = f.descripcion; monto = Math.abs(f.movEfectivo); signo = f.movEfectivo >= 0 ? '+' : '-';

/* =========================================================
   Animación al tocar: se hunde, se oscurecen los bordes y
   una luz sigue al dedo. Si sacás el dedo del botón, no se toca.
   ========================================================= */
let toque = null, cancelado = null;
// La luz sigue al dedo todo el tiempo. Si el dedo sale del botón, la luz queda en el borde más cercano (más suave)
// y el botón deja de estar "hundido": al soltar afuera, no se toca.
function moverToque(x, y) {
  const b = toque.b, r = b.getBoundingClientRect();
  const dentro = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  toque.dentro = dentro;
  b.style.setProperty('--x', (Math.min(Math.max(x, r.left), r.right) - r.left) + 'px');
  b.style.setProperty('--y', (Math.min(Math.max(y, r.top), r.bottom) - r.top) + 'px');
  b.classList.toggle('toque', dentro && !toque.scroll);
  b.classList.toggle('toque-fuera', !dentro || !!toque.scroll);
}
function soltarToque(cancelar) {
  if (!toque) return;
  const b = toque.b, falta = Math.max(0, 140 - (Date.now() - toque.t));
  if (cancelar) cancelado = { b, t: Date.now() };
  toque = null;
  const fin = () => b.classList.remove('toque', 'toque-fuera');
  if (cancelar) fin(); else setTimeout(fin, falta);
}
// Un gesto (deslizar la pantalla, tirar para actualizar) anula el toque pero la luz sigue al dedo hasta soltar
function anularToque() { if (toque) { toque.scroll = true; toque.b.classList.remove('toque'); toque.b.classList.add('toque-fuera'); } }
document.addEventListener('pointerdown', e => {
  cancelado = null;
  const b = e.target.closest && e.target.closest('button');
  if (!b || b.disabled) return;
  toque = { b, t: Date.now(), id: e.pointerId, tipo: e.pointerType, dentro: true, scroll: false };
  moverToque(e.clientX, e.clientY);
}, true);
// Mouse / lápiz
document.addEventListener('pointermove', e => { if (toque && toque.tipo !== 'touch' && e.pointerId === toque.id) moverToque(e.clientX, e.clientY); }, true);
document.addEventListener('pointerup', e => { if (!toque || toque.tipo === 'touch' || e.pointerId !== toque.id) return; moverToque(e.clientX, e.clientY); soltarToque(!toque.dentro); }, true);
// Dedo: el celular sigue mandando el movimiento aunque la pantalla se deslice
document.addEventListener('pointercancel', e => { if (!toque) return; if (toque.tipo === 'touch') anularToque(); else soltarToque(true); }, true);
document.addEventListener('touchmove', e => { if (toque && toque.tipo === 'touch' && e.touches[0]) moverToque(e.touches[0].clientX, e.touches[0].clientY); }, { capture: true, passive: true });
const finDedo = e => {
  if (!toque || toque.tipo !== 'touch') return;
  const t = e.changedTouches && e.changedTouches[0];
  if (t) moverToque(t.clientX, t.clientY);
  soltarToque(!toque.dentro || toque.scroll);
};
document.addEventListener('touchend', finDedo, { capture: true, passive: true });
document.addEventListener('touchcancel', finDedo, { capture: true, passive: true });
document.addEventListener('click', e => {
  if (cancelado && Date.now() - cancelado.t < 1000 && cancelado.b.contains(e.target)) { e.preventDefault(); e.stopImmediatePropagation(); }
  cancelado = null;
}, true);

/* =========================================================

const PTR = { y0: null, dist: 0, activo: false, ocupado: false };
const UMBRAL = 72;
function ptrPintar(dist, texto) {

}
function ptrOcultar() {

const esperar = ms => new Promise(r => setTimeout(r, ms));
async function ptrActualizar() {
  PTR.ocupado = true;
  const el = $('ptr');
  el.classList.add('vuelve'); ptrPintar(UMBRAL, navigator.onLine ? 'Actualizando…' : 'Sin internet'); el.classList.add('vuelve');

/* Acordeón: al llegar arriba o abajo, se abre un poco el espacio entre las tarjetas de ese lado */
function estirar(dist, lado) {
  const vista = document.querySelector('#contenido .vista'); if (!vista) return;
  const hijos = [...vista.children], n = hijos.length;
  vista.classList.remove('volviendo'); vista.classList.add('estirando');
  hijos.forEach((h, k) => {
    const off = lado === 'arriba' ? dist * 0.45 * (1 - Math.pow(0.55, k + 1)) : -dist * 0.45 * (1 - Math.pow(0.55, n - k));
    h.style.transform = `translateY(${off.toFixed(1)}px)`;
  });
}
function soltarEstirar() {
  const vista = document.querySelector('#contenido .vista'); if (!vista) return;
  vista.classList.remove('estirando'); vista.classList.add('volviendo');
  [...vista.children].forEach(h => { h.style.transform = ''; });
  setTimeout(() => vista.classList.remove('volviendo'), 550);
}
(function () {
  const cont = $('contenido');
  const G = { y0: null, lado: '', activo: false, dist: 0 };
  cont.addEventListener('touchstart', e => {
    G.activo = false; G.dist = 0; G.lado = '';
    if (e.touches.length !== 1) { G.y0 = null; return; }
    G.y0 = e.touches[0].clientY;
    G.arriba = cont.scrollTop <= 0;
    G.abajo = cont.scrollTop + cont.clientHeight >= cont.scrollHeight - 2;
  }, { passive: true });
  cont.addEventListener('touchmove', e => {
    if (G.y0 === null) return;
    const dy = e.touches[0].clientY - G.y0;
    const lado = dy > 0 && G.arriba && cont.scrollTop <= 0 ? 'arriba' : dy < 0 && G.abajo && cont.scrollTop + cont.clientHeight >= cont.scrollHeight - 2 ? 'abajo' : '';
    if (!lado) { if (G.activo) { soltarEstirar(); if (G.lado === 'arriba') ptrOcultar(); } G.activo = false; return; }
    if (!G.activo && Math.abs(dy) > 12) { G.activo = true; G.lado = lado; anularToque(); }
    if (!G.activo) return;
    G.dist = Math.min(Math.abs(dy) * 0.5, 110);
    estirar(G.dist, lado);
    if (lado === 'arriba' && !PTR.ocupado) ptrPintar(G.dist);
  }, { passive: true });
  const fin = () => {
    G.y0 = null;
    if (!G.activo) return;
    G.activo = false; soltarEstirar();
    if (G.lado === 'arriba' && !PTR.ocupado) { if (G.dist >= UMBRAL) ptrActualizar(); else ptrOcultar(); }
  };
  cont.addEventListener('touchend', fin);
  cont.addEventListener('touchcancel', fin);
})();

   ========================================================= */
// Mientras haya algo abierto, se deja UNA "marca" en el historial. Atrás la consume y cierra lo de arriba.
const HIST = { guarda: false, ignorar: 0, t: null };
const algoAbierto = () => !$('cal').hidden || !$('modal').hidden || (!$('app').hidden && S.vista !== 'inicio');
function histRevisar() {
  clearTimeout(HIST.t);
  HIST.t = setTimeout(() => {
    const hace = algoAbierto();
    try {
      if (hace && !HIST.guarda) { history.pushState({ billetera: 1 }, ''); HIST.guarda = true; }
      else if (!hace && HIST.guarda) { HIST.guarda = false; HIST.ignorar++; history.back(); }
    } catch (e) {}
  }, 80);
}
window.addEventListener('popstate', () => {
  if (HIST.ignorar > 0) { HIST.ignorar--; return; }

function errFlujo(t) { const e = $('fErr'); if (e) { e.textContent = t; e.hidden = false; } const i = $('fIn'); if (i) i.focus(); }
function siguienteFlujo() {
  const fl = S.flujo; if (!fl) return;
  const p = pasoFlujo();
  if (p.t === 'num' || p.t === 'texto') {
    const v = ($('fIn') ? valorDe($('fIn')) : '').trim();
    fl.d[p.k] = v;
    if (p.t === 'num') {
      const n = num(v);
      if (!v || isNaN(n)) return errFlujo('Escribí un número.');
      if (n < 0 || (!p.cero && n === 0)) return errFlujo(p.cero ? 'No puede ser negativo.' : 'Tiene que ser más de 0.');
    } else if (!v && !p.opcional) return errFlujo('Escribí algo para seguir.');
    if (p.valid) { const r = p.valid(fl.d); if (r !== true) return errFlujo(r); }

  fl.i = Math.min(fl.i + 1, pasosFlujo().length - 1);

}
function enfocarFlujo() { const i = $('fIn'); if (i) { try { i.focus({ preventScroll: true }); const L = i.value.length; i.setSelectionRange(L, L); } catch (e) {} } }
function elegirOpcionFlujo(v) {

}

  else if (fl.volver) { S.flujo = fl.volver; render(); }

}
const catDeViaje = q => /comida|bebida/i.test(q) ? 'Sueldo' : q === 'Otra cosa' ? 'Otros' : 'Insumos';
function guardarFlujo() {
  const fl = S.flujo, d = fl.d, neg = fl.negocio, fecha = d.fecha || hoy();
  const id = fl.editId || nuevoId();
  const viaje = fl.editId && fl.viajeOrig && fl.fechaOrig === fecha ? fl.viajeOrig : 'Bermejo ' + fCorta(fecha);
  let op = null, saleEfectivo = 0;
  if (fl.tipo === 'cambio') {
    const m = num(d.monto), pc = num(d.pct) || 0;
    op = { hoja: 'negocio', datos: { negocio: neg, tipo: 'Cambio', fecha, viaje, monto: m, pctCambio: pc, pagoComision: d.comision === 'Efectivo' && pc > 0 ? 'Efectivo' : 'Transferencia', nota: fl.nota || '' } };
  } else if (fl.tipo === 'compra') {
    const recargo = d.pago === 'Transferencia' && d.extra === 'Sí';
    op = { hoja: 'negocio', datos: { negocio: neg, tipo: 'Inversión', fecha, viaje, descripcion: d.descripcion, unidades: num(d.unidades), monto: num(d.monto), pago: d.pago, pctRecargo: recargo ? num(d.pct) : '' } };
    if (d.pago === 'Efectivo') saleEfectivo = num(d.monto);
  } else if (fl.tipo === 'viaje') {
    op = { hoja: 'negocio', datos: { negocio: neg, tipo: 'No reversible', fecha, viaje, categoria: catDeViaje(d.que), descripcion: d.que === 'Otra cosa' ? d.otro : d.que, monto: num(d.monto), pago: d.pago } };
    if (d.pago === 'Efectivo') saleEfectivo = num(d.monto);
  } else if (fl.tipo === 'personal') {
    op = { hoja: 'personal', datos: { negocio: neg, fecha, origen: 'Personal', devolver: '', categoria: d.categoria, descripcion: (d.descripcion || '').trim(), monto: num(d.monto), pago: d.pago } };
  } else if (fl.tipo === 'usar') {
    const devolver = fl.editId ? (d.devolver === 'sí' ? 'sí' : '') : (d.devuelto === 'No' ? '' : 'sí');
    op = { hoja: 'personal', datos: { negocio: neg, fecha, origen: 'Negocio (MercadoLibre)', devolver, categoria: d.categoria, descripcion: (d.descripcion || '').trim(), monto: num(d.monto), pago: d.pago } };
    // Si ya devolvió todo o una parte, se anota la devolución en el mismo momento
    const yaDevolvio = fl.editId ? 0 : d.devuelto === 'Toda' ? num(d.monto) : d.devuelto === 'Parte' ? num(d.parte) : 0;
    if (yaDevolvio > 0) fl.extra = { tipo: 'guardar', hoja: 'negocio', id: nuevoId(), datos: { negocio: neg, tipo: 'Devolución', fecha, viaje: '', monto: yaDevolvio, nota: '' } };
  } else if (fl.tipo === 'devolver') {
    op = { hoja: 'negocio', datos: { negocio: neg, tipo: 'Devolución', fecha, viaje: '', monto: num(d.monto), nota: fl.nota || '' } };
  } else if (fl.tipo === 'contar') {
    op = { hoja: 'negocio', datos: { negocio: neg, tipo: 'Ajuste', fecha: hoy(), viaje: '', monto: num(d.monto), inicial: false } };
  }
  // ¿Alcanza el efectivo?
  if (saleEfectivo && !fl.sinControl) {
    const ef = (fl.pedirInicial ? num(d.inicial) : 0) + efectivoDe(neg, fl.editId || null);
    if (saleEfectivo > ef) return avisoEfectivoSimple(saleEfectivo, ef);
  }
  guardarInicialFlujo(fl);
  encolar(Object.assign({ tipo: 'guardar', id }, op));
  if (fl.extra) { encolar(fl.extra); fl.extra = null; }
  avisar(fl.editId ? '✓ Corregido' : '✓ Guardado');
  if (fl.volver) { const v = fl.volver; v.i = pasosFl(v).length - 1; S.flujo = v; $('contenido').scrollTop = 0; return render(); }
  S.flujo = null; irA('inicio');
}
const pasosFl = fl => FLUJOS[fl.tipo].pasos.filter(p => !p.si || p.si(fl));
function guardarInicialFlujo(fl) {
  if (!fl.pedirInicial) return;
  fl.pedirInicial = false;
  fl.i = Math.max(0, fl.i - 1); // la pregunta del efectivo inicial ya no se cuenta
  encolar({ tipo: 'guardar', hoja: 'negocio', id: nuevoId(), datos: { negocio: fl.negocio, tipo: 'Ajuste', fecha: hoy(), viaje: '', monto: num(fl.d.inicial), inicial: true } });
}
function avisoEfectivoSimple(monto, ef) {
  abrirModal(`<div class="v-cab"><span class="ic" style="background:rgba(255,181,71,.18);color:var(--amber)">${svg('alerta', 22, 2)}</span><b>No te alcanza el efectivo</b></div>

function refrescarDetalle() {
  const d = S.detalle; if (!d) return;
  const fila = (d.h === 'negocio' ? S.negocio : S.personal).find(f => f.id === d.id); if (!fila) return;

// "Corregir" en el modo simple: vuelve a las mismas preguntas, con lo que ya estaba cargado
function corregirSimple() {
  const det = S.detalle; if (!det) return;
  const f = (det.h === 'negocio' ? S.negocio : S.personal).find(x => x.id === det.id); if (!f) return;
  const base = { editId: f.id, fechaOrig: f.fecha, viajeOrig: f.viaje, pedirInicial: false, sinControl: false };
  const s = v => String(v == null ? '' : v);
  if (det.h === 'personal') return iniciarFlujo(f.origen === 'Personal' ? 'personal' : 'usar', Object.assign(base, { d: { fecha: f.fecha, categoria: f.categoria, monto: s(f.monto), pago: f.pago, devolver: f.devolver === 'sí' ? 'sí' : '', descripcion: f.descripcion || '' } }));
  if (f.tipo === 'Inversión') return iniciarFlujo('compra', Object.assign(base, { d: { fecha: f.fecha, descripcion: f.descripcion, unidades: s(f.unidades), monto: s(f.monto), pago: f.pago, extra: f.pctRecargo !== '' && f.pctRecargo != null && Number(f.recargo) ? 'Sí' : 'No', pct: s(f.pctRecargo) } }));
  if (f.tipo === 'No reversible') { const enLista = (S.listas['Descripciones rápidas'] || []).includes(f.descripcion); return iniciarFlujo('viaje', Object.assign(base, { d: { fecha: f.fecha, que: enLista ? f.descripcion : 'Otra cosa', otro: enLista ? '' : (f.descripcion || f.categoria), monto: s(f.monto), pago: f.pago } })); }
  if (f.tipo === 'Cambio') return iniciarFlujo('cambio', Object.assign(base, { nota: notaCambio(f), d: { fecha: f.fecha, monto: s(f.monto), pct: s(f.pctCambio), comision: f.pago === 'Efectivo' ? 'Efectivo' : 'Descuento' } }));
  if (f.tipo === 'Devolución') return iniciarFlujo('devolver', Object.assign(base, { orig: s(f.monto), nota: f.descripcion !== 'Devolución al negocio' ? f.descripcion : '', d: { fecha: f.fecha, monto: s(f.monto) } }));
}

    <button class="opcion" type="button" data-acc="guiaOtros" style="background:var(--card3)"><span class="oi">${svg('info', 24)}</span><span><b>Otros</b><small>Gasto personal, corregir y más</small></span>${svg('der', 20, 2.2)}</button>`);
}
function menuOtros() {
  const op = (guia, titulo, sub, icono) => `<button class="opcion chica" type="button" data-acc="guia" data-guia="${guia}" style="background:var(--card3)"><span class="oi">${svg(icono, 21)}</span><span><b>${titulo}</b><small>${sub}</small></span>${svg('der', 18, 2.2)}</button>`;
  abrirModal(`<div class="v-cab"><button class="cerrar" type="button" data-acc="guiaMenu" aria-label="Volver">${svg('izq', 18, 2.4)}</button><b>Otros</b><button class="cerrar" type="button" data-acc="cerrar" aria-label="Cerrar">${svg('x', 18, 2.2)}</button></div>
    ${op('personal', 'Cargar un gasto personal', 'Casa, comida, salud…', 'user')}
    ${op('corregir', 'Corregir o borrar un gasto', 'Si te equivocaste', 'lapiz')}
    ${op('cuanto', 'Ver cuánto gasté', 'Este mes y los anteriores', 'recibo')}
    ${op('efectivo', '¿Qué es el efectivo disponible?', 'La plata en la mano del negocio', 'billetera')}
    ${op('recorrido', 'Recorrido por la app', 'Te muestro cada parte', 'robot')}`);
}
function saludoRobot() {
  if (LS.get('bd_ayudante', true) === false) return;
  const k = 'bd_guia_hola_' + S.yo.usuario;
  if (LS.get(k, false)) return;
  LS.set(k, true);
  setTimeout(() => {
    if (!$('modal').hidden || $('app').hidden) return;
    abrirModal(`<div class="v-cab"><span class="ic" style="background:var(--grad)">${svg('robot', 22)}</span><b>¡Hola, ${esc(primerNombre(S.yo.nombre))}! 👋</b><button class="cerrar" type="button" data-acc="cerrar" aria-label="Cerrar">${svg('x', 18, 2.2)}</button></div>
      <p style="margin:0;font-size:17px;font-weight:600;line-height:1.45;color:var(--soft)">Soy tu <b style="color:var(--ink)">ayudante</b>. Cuando tengas una duda, tocame (estoy abajo a la derecha) y te muestro dónde tocar.<br><br>¿Te muestro la app? Es cortito.</p>
      <button class="btn btn-grad" type="button" data-acc="guia" data-guia="recorrido">Sí, mostrame</button>
      <button class="btn btn-ghost" type="button" data-acc="cerrar">Ahora no</button>`);
  }, 700);
}
function iniciarGuia(nombre) {
  const g = GUIAS[nombre]; if (!g) return;
  if (g.antes) g.antes();
  const falta = g.requiere && g.requiere();
  if (falta) return avisar(falta);
  const usos = LS.get('bd_guia_usos_' + nombre, 0);
  let pasos = g.pasos;
  if (g.camino) {
    if (usos >= 3 && g.atajo) g.atajo(); // ya lo hizo 3 veces: directo al formulario
    else { cerrarModal(); pasos = g.camino.concat(g.pasos); }
  }
  Object.assign(GUIA, { activa: true, nombre, pasos, i: -1, n: 0, largo: !!g.largo });
  $('guia').hidden = false; pintarRobot();
  $('guia').querySelector('.guia-cara').innerHTML = svg('robot', 18, 2);
  $('guiaX').innerHTML = svg('x', 16, 2.4);
  siguientePaso();
  cancelAnimationFrame(GUIA.raf);
  const bucle = () => { if (!GUIA.activa) return; ubicarGuia(); GUIA.raf = requestAnimationFrame(bucle); };
  GUIA.raf = requestAnimationFrame(bucle);
}
function terminarGuia(mensaje, exito) {
  if (!GUIA.activa) return;
  const nombre = GUIA.nombre;
  GUIA.activa = false; cancelAnimationFrame(GUIA.raf);
  $('guia').hidden = true; pintarRobot();
  if (exito && GUIAS[nombre].tarea) LS.set('bd_guia_usos_' + nombre, LS.get('bd_guia_usos_' + nombre, 0) + 1);
  if (mensaje) setTimeout(() => avisar(mensaje), 50);
}
function pasoActual() { return GUIA.pasos[GUIA.i]; }
function siguientePaso() {
  let i = GUIA.i + 1;
  // saltear pasos que no corresponden (ej: el efectivo inicial ya se cargó)
  while (i < GUIA.pasos.length && GUIA.pasos[i].si && !GUIA.pasos[i].si()) i++;
  if (i >= GUIA.pasos.length) return terminarGuia(GUIAS[GUIA.nombre].tarea ? '¡Listo! Quedó guardado 🎉' : '', true);
  GUIA.i = i; GUIA.n++; GUIA.falta = 0;
  const p = pasoActual();
  $('guiaTxt').innerHTML = p.txt;
  $('guiaN').textContent = 'Paso ' + GUIA.n;
  $('guiaListo').hidden = p.modo !== 'listo';
  $('guiaListo').textContent = p.btn || 'Listo ›';
  $('guiaSaltar').hidden = !p.opcional;
  $('guia').querySelector('.guia-globo').classList.toggle('largo', !!(p.largo || GUIA.largo));
  const el = p.el();
  if (el) {
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    if (p.modo === 'listo' && el.matches('input')) setTimeout(() => { try { el.focus({ preventScroll: true }); } catch (e) {} }, 300);
  }
}
// Ubica la luz y el globito sobre lo que hay que tocar (se llama en cada cuadro, así sigue a la pantalla)
function ubicarGuia() {
  const p = pasoActual(); if (!p) return;
  const el = p.el(), luz = $('guia').querySelector('.guia-luz'), globo = $('guia').querySelector('.guia-globo');
  const vv = window.visualViewport, W = vv ? vv.width : innerWidth, H = vv ? vv.height : innerHeight, top0 = vv ? vv.offsetTop : 0;
  if (!el || !el.getClientRects().length) {
    // lo que había que tocar desapareció (por ejemplo, se cerró la ventana)
    if (++GUIA.falta > 150) return terminarGuia('Se cerró la guía. Si querés, tocame de nuevo 🤖');
    luz.style.cssText = `left:${W / 2}px;top:${H / 2}px;width:0;height:0`;
    return;
  }
  GUIA.falta = 0;
  const r = el.getBoundingClientRect(), pad = 6;
  luz.style.left = (r.left - pad) + 'px'; luz.style.top = (r.top - pad) + 'px';
  luz.style.width = (r.width + pad * 2) + 'px'; luz.style.height = (r.height + pad * 2) + 'px';
  const gw = globo.offsetWidth, gh = globo.offsetHeight;
  let x = Math.min(Math.max(12, r.left + r.width / 2 - gw / 2), W - gw - 12), y, lado;
  if (r.bottom + 16 + gh < top0 + H - 8) { y = r.bottom + 16; lado = 'abajo'; }
  else if (r.top - 16 - gh > top0 + 8) { y = r.top - 16 - gh; lado = 'arriba'; }
  else { y = Math.max(top0 + 12, top0 + H - gh - 12); lado = 'centro'; }
  globo.style.left = x + 'px'; globo.style.top = y + 'px';
  globo.classList.toggle('abajo', lado === 'abajo'); globo.classList.toggle('arriba', lado === 'arriba'); globo.classList.toggle('centro', lado === 'centro');
  globo.style.setProperty('--ax', Math.min(Math.max(20, r.left + r.width / 2 - x), gw - 20) + 'px');
}
function avanzarDesde(p) {
  if (!GUIA.activa || pasoActual() !== p) return;
  if (!p.final) return siguientePaso();
  // Después de "Guardar": ¿se guardó, falta algo o no alcanza el efectivo?
  setTimeout(() => {
    if (!GUIA.activa || pasoActual() !== p) return;
    if ($('modal').hidden) return siguientePaso();
    if (document.querySelector('#modalIn [data-acc=avisoCambio]')) return terminarGuia('No te alcanza el efectivo: elegí una opción de la ventana 👆', false);
    const err = $('fError');
    if (err && !err.hidden) { $('guiaTxt').innerHTML = 'Falta algo: mirá el <b>mensaje en rojo</b>, corregilo y tocá <b>Guardar</b> de nuevo'; sacudirGlobo(); }
  }, 250);
}
function sacudirGlobo() { const g = $('guia').querySelector('.guia-globo'); g.classList.remove('sacude'); void g.offsetWidth; g.classList.add('sacude'); }
// Avanza cuando se toca lo que corresponde
document.addEventListener('click', e => {
  if (!GUIA.activa || (e.target.closest && e.target.closest('#guia'))) return;
  const p = pasoActual(); if (!p) return;
  const el = p.el();
  const ok = p.valido ? !!e.target.closest(p.valido) : (p.modo !== 'listo' && el && el.contains(e.target));
  if (ok) setTimeout(() => avanzarDesde(p), 120);
}, true);
$('guiaListo').onclick = () => {
  const p = pasoActual(); if (!p) return;
  const el = p.el();
  if (p.req && el && el.matches('input') && !el.value.trim()) { $('guiaTxt').innerHTML = p.txt + '<br><b>Escribilo primero</b> ✍️'; sacudirGlobo(); try { el.focus(); } catch (x) {} return; }
  avanzarDesde(p);
};
// Durante una guía, solo se puede tocar lo que está iluminado, el globito (✕, Listo, Siguiente, Saltar)
// y el calendario si se abrió desde el paso. Todo lo demás queda bloqueado.
function guiaPermite(t) {
  if (!GUIA.activa || !t || !t.closest) return true;
  if (t.closest('#guia .guia-globo')) return true;
  const p = pasoActual(); if (!p) return false;
  const el = p.el();
  if (el && el.contains(t)) return true;
  if (p.valido && t.closest(p.valido)) return true;
  if (!$('cal').hidden && t.closest('#cal')) return true;
  return false;
}
['pointerdown', 'mousedown', 'touchstart', 'click'].forEach(tipo => window.addEventListener(tipo, e => {
  if (guiaPermite(e.target)) return;
  e.preventDefault(); e.stopPropagation();
  if (tipo === 'pointerdown') sacudirGlobo();
}, { capture: true, passive: false }));
$('guiaSaltar').onclick = () => { const p = pasoActual(); if (p) siguientePaso(); };
$('guiaX').onclick = () => terminarGuia('Guía cerrada. Tocame cuando quieras 🤖', false);

/* =========================================================
   Arranque
   ========================================================= */
(function arrancar() {
  document.body.classList.toggle('grande', !!LS.get('bd_letra', false));
  mostrarNovedad();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
  const ses = LS.get('bd_sesion', null);
  if (!ses || !ses.token) return mostrarLogin('');
  S.token = ses.token;
  S.yo = { usuario: ses.usuario };
  const est = LS.get(kEstado(), null);
  if (!est || !est.yo) { LS.del('bd_sesion'); S.token = ''; return mostrarLogin(''); }
  Object.assign(S, { yo: est.yo, listas: Object.assign({}, LISTAS_BASE, est.listas), personal: est.personal || [], negocio: est.negocio || [], pendientes: est.pendientes || 0, ultimaSync: est.ultimaSync || 0 });
  S.cola = LS.get(kCola(), []); S.rech = LS.get(kRech(), []);
  aplicarModo();
  if (LS.get('bd_patron_' + S.yo.usuario, '')) iniciarPatron('abrir'); else iniciarPatron('crear');
})();
</script>
